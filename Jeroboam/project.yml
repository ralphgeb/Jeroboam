name: Jeroboam
options:
  bundleIdPrefix: com.ralphgeb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"      # the TestFlight workflow overrides this with the run number
    CODE_SIGN_STYLE: Automatic

targets:
  Jeroboam:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Content
        type: folder
        buildPhase: resources
      - path: Resources/Maps
        type: folder
        buildPhase: resources
      - path: Resources/Grapes
        type: folder
        buildPhase: resources
      - path: Resources/Photos
        type: folder
        buildPhase: resources
      - Resources/Assets.xcassets
      - Resources/PrivacyInfo.xcprivacy
    dependencies:
      - target: JeroWidget                  # embeds the home-screen widgets in the app
    entitlements:
      path: Sources/Jeroboam.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.security.application-groups: [group.com.ralphgeb.jero]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Jero
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.ralphgeb.jero
            CFBundleURLSchemes: [jero]
        NSCameraUsageDescription: Jero uses the camera to photograph wine labels for your tasting journal.
        NSPhotoLibraryAddUsageDescription: Jero can save your tasting photos.
        JeroAPIKey: $(JERO_API_KEY)
        JeroPriceURL: $(JERO_PRICE_URL)
        JeroPriceKey: $(JERO_PRICE_KEY)
        JeroCloudKit: $(JERO_CLOUDKIT)   # "1" when the build carries the iCloud container (full-size photo sync, see Account.swift)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphgeb.jero
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        JERO_API_KEY: ""        # injected by CI from the ANTHROPIC_API_KEY secret (testing only)
        JERO_PRICE_URL: ""      # the shared price list (backend/cloudflare), from the PRICE_DB_URL secret
        JERO_PRICE_KEY: ""      # and its key, from PRICE_DB_KEY
        JERO_CLOUDKIT: ""       # set to 1 by build-ios.yml (with the CloudKit entitlements) when the repo variable CLOUDKIT_READY is true

  JeroWidget:
    type: app-extension
    platform: iOS
    entitlements:
      path: JeroWidget/JeroWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ralphgeb.jero]
    sources:
      - path: JeroWidget
        excludes:
          - Resources/Bottles
          - PrivacyInfo.xcprivacy
      - path: JeroWidget/Resources/Bottles
        type: folder
        buildPhase: resources
      - path: JeroWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Sources/BrandShapes.swift
    info:
      path: JeroWidget/Info.plist
      properties:
        CFBundleDisplayName: Jero
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphgeb.jero.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  JeroSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SnapshotTests
    dependencies:
      - target: Jeroboam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphgeb.jero.snapshots
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Jeroboam:
    build:
      targets:
        Jeroboam: all
        JeroSnapshots: [test]
    test:
      config: Debug
      targets:
        - JeroSnapshots
    run:
      config: Debug
    archive:
      config: Release

name: Jeroboam
options:
  bundleIdPrefix: com.ralphgeb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"      # the TestFlight workflow overrides this with the run number
    CODE_SIGN_STYLE: Automatic

targets:
  Jeroboam:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Content
        type: folder
        buildPhase: resources
      - path: Resources/Maps
        type: folder
        buildPhase: resources
      - path: Resources/Grapes
        type: folder
        buildPhase: resources
      - Resources/Assets.xcassets
      - Resources/PrivacyInfo.xcprivacy
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Jero
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Jero uses the camera to photograph wine labels for your tasting journal.
        NSPhotoLibraryAddUsageDescription: Jero can save your tasting photos.
        JeroAPIKey: $(JERO_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphgeb.jero
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        JERO_API_KEY: ""        # injected by CI from the ANTHROPIC_API_KEY secret (testing only)

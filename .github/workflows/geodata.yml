name: Fetch map data
# Downloads the EU wine PDO boundaries (figshare, CC BY 4.0) and OSM land polygons, simplifies them,
# and publishes the results to the geo-data branch.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install geopandas pyogrio shapely
      - run: python tools/geodata_pdo.py
      - name: Publish to the geo-data branch
        run: |
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b geo-data
          git add -A
          git commit -qm "Map source data"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" geo-data

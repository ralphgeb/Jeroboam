name: Which scans were paid
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/paid-scans.yml", "tools/paid_scans.py"]
jobs:
  list:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.PRICE_DB_URL }}
      KEY: ${{ secrets.PRICE_DB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyyaml && python3 tools/paid_scans.py

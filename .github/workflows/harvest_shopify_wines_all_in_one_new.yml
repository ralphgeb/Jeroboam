          fine-wine, and niche-region Shopify wine merchants worldwide.

          - NEVER modifies wine_details.csv or wine_prices.csv (all existing rows kept intact).
          - Outputs two brand-new files in your exact 18-column and 16-column schemas:
              1. content/prices/wine_details_shopify_new.csv

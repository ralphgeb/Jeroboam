          def norm(s: str) -> str:
              return re.sub(r"[^a-z0-9]+", "", str(s or "").lower())


          def clean_html(raw: str) -> str:
              if not raw:
                  return ""
              text = re.sub(r"<[^>]+>", " ", raw)
              text = html.unescape(text)
              return re.sub(r"\s+", " ", text).strip()


          def extract_vintage(text: str) -> str:
              m = re.search(r"\b(19[5-9]\d|20[0-2]\d)\b", text or "")
              return m.group(1) if m else "NV"


          def extract_size_ml(text: str) -> int:
              t = (text or "").lower()
              if "1.5l" in t or "1500ml" in t or "magnum" in t:
                  return 1500
              if "375ml" in t or "half bottle" in t:
                  return 375
              if "500ml" in t:
                  return 500
              if "620ml" in t or "clavelin" in t:
                  return 620
              if "3l" in t or "3000ml" in t or "double magnum" in t:
                  return 3000
              if "1l" in t or "1000ml" in t:
                  return 1000
              return 750


          def extract_color(text: str) -> str:
              t = (text or "").lower()
              if any(k in t for k in ["sparkling", "champagne", "crémant", "cremant", "cava", "prosecco", "pet-nat", "pét-nat", "franciacorta"]):
                  return "Sparkling"
              if any(k in t for k in ["orange wine", "amber wine", "skin contact", "skin-contact", "qvevri"]):
                  return "Orange"
              if any(k in t for k in ["rosé", "rose wine", "rosato", "rosado"]):
                  return "Rosé"
              if any(k in t for k in ["white wine", "blanc", "bianco", "blanco", "branco", "weiss", "riesling", "chardonnay", "sauvignon blanc", "chenin", "assyrtiko", "albariño", "grüner", "chablis", "sancerre", "meursault"]):
                  return "White"
              if any(k in t for k in ["red wine", "rouge", "rosso", "tinto", "rotwein", "pinot noir", "cabernet", "syrah", "nebbiolo", "sangiovese", "barolo", "bordeaux", "rioja", "malbec", "gamay", "grenache", "xinomavro", "blaufränkisch"]):
                  return "Red"
              return ""


          def extract_aromas(text: str) -> str:
              t = (text or "").lower()
              found = [a.title() for a in AROMA_LEXICON if re.search(rf"\b{re.escape(a)}\b", t)]
              return ", ".join(dict.fromkeys(found[:10]))


          def extract_scores(text: str) -> Tuple[Optional[float], str]:
              scores = []
              nums = []
              for critic, pat in CRITIC_PATTERNS:
                  m = pat.search(text or "")
                  if m:
                      val = int(m.group(1))
                      scores.append(f"{critic}: {val}")
                      nums.append(val)
              if not nums:
                  return None, ""
              return round(sum(nums) / len(nums), 1), " ; ".join(scores)


          def extract_geo(text: str) -> Tuple[str, str]:
              t = (text or "").lower()
              country = ""
              region = ""
              for pat, ctry, reg in REGION_MAP:
                  if re.search(pat, t):
                      country = ctry
                      region = reg
                      break
              if not country:
                  for c in COUNTRIES:
                      if re.search(rf"\b{re.escape(c.lower())}\b", t):
                          country = c
                          break
              if not country and re.search(r"\b(usa|u\.s\.a|california|oregon|washington)\b", t):
                  country = "United States"
              return country, region


          def extract_grapes(text: str) -> str:
              t = (text or "").lower()
              found = [g for g in GRAPES if re.search(rf"\b{re.escape(g.lower())}\b", t)]
              return ", ".join(dict.fromkeys(found[:4]))


          def build_session() -> requests.Session:
              session = requests.Session()
              retry = Retry(total=2, backoff_factor=0.8, status_forcelist=[429, 500, 502, 503, 504])
              adapter = HTTPAdapter(max_retries=retry)
              session.mount("http://", adapter)
              session.mount("https://", adapter)
              session.headers.update({"User-Agent": "JeroboamWineDB/2.1 (Catalog Research)"})
              return session


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--existing-details", default="content/prices/wine_details.csv")
              parser.add_argument("--out-details", default="content/prices/wine_details_shopify_new.csv")
              parser.add_argument("--out-prices", default="content/prices/wine_prices_shopify_new.csv")
              parser.add_argument("--target-producers", type=int, default=2500, help="0 = scan all shops without cap")
              parser.add_argument("--max-pages", type=int, default=30)
              parser.add_argument("--delay", type=float, default=1.0)
              args = parser.parse_args()

              existing_path = Path(args.existing_details)
              if not existing_path.exists():
                  existing_path = Path("wine_details.csv")

              existing_df = pd.read_csv(existing_path, usecols=["producer"], low_memory=False)
              existing_producers = {norm(p) for p in existing_df["producer"].dropna() if str(p).strip()}
              print(f"Loaded {len(existing_producers):,} normalized existing producers to skip (read-only).")

              new_producers = set()
              details_rows: List[Dict] = []
              prices_rows: List[Dict] = []
              seen_keys = set()

              session = build_session()
              cap = args.target_producers if args.target_producers > 0 else 10**9

              for m in MERCHANTS:
                  if len(new_producers) >= cap:
                      break
                  if any(b in m["base"] for b in BLOCKED_DOMAINS):
                      continue

                  print(f"Scanning {m['name']} ({m['base']}) ... [New producers so far: {len(new_producers):,}]")
                  for page in range(1, args.max_pages + 1):
                      if len(new_producers) >= cap:
                          break
                      url = f"{m['base']}/products.json?limit=250&page={page}"
                      try:
                          r = session.get(url, timeout=15)
                          if r.status_code != 200:
                              break
                          products = r.json().get("products", [])
                          if not products:
                              break
                      except Exception as e:
                          print(f"  Skipped {m['name']} page {page}: {e}")
                          break

                      for p in products:
                          title = (p.get("title") or "").strip()
                          ptype = (p.get("product_type") or "").strip()
                          tags_list = p.get("tags") or []
                          tags_str = ", ".join(tags_list) if isinstance(tags_list, list) else str(tags_list)
                          body_text = clean_html(p.get("body_html") or "")

                          combined_meta = f"{title} | {ptype} | {tags_str} | {body_text}"
                          if NON_WINE_KEYWORDS.search(f"{title} {ptype}"):
                              continue

                          producer = (p.get("vendor") or "").strip()
                          p_norm = norm(producer)
                          if not p_norm or p_norm in existing_producers or p_norm == norm(m["name"]):
                              continue

                          variants = p.get("variants") or []
                          if not variants:
                              continue
                          v = variants[0]
                          try:
                              price_raw = float(v.get("price") or 0)
                          except ValueError:
                              continue
                          if price_raw <= 0:
                              continue

                          vintage = extract_vintage(title)
                          size_ml = extract_size_ml(f"{title} {v.get('title', '')}")
                          dedupe_key = (norm(title), vintage, size_ml, m["name"])
                          if dedupe_key in seen_keys:
                              continue
                          seen_keys.add(dedupe_key)

                          cur = m["currency"]
                          price_gbp = round(price_raw * FX_TO_GBP[cur], 2)
                          price_eur = round(price_raw * FX_TO_EUR[cur], 2)
                          price_usd = round(price_raw * FX_TO_USD[cur], 2)
                          product_url = f"{m['base']}/products/{p.get('handle', '')}"
                          in_stock = "yes" if v.get("available") else "no"

                          color = extract_color(combined_meta)
                          country, region = extract_geo(combined_meta)
                          grapes = extract_grapes(combined_meta)
                          aromas = extract_aromas(body_text)
                          aromas_source = "shopify description" if aromas else ""
                          avg_score, scores_str = extract_scores(body_text)
                          notes = body_text[:600] if body_text else (f"Tags: {tags_str}" if tags_str else "")

                          new_producers.add(p_norm)

                          details_rows.append({
                              "wine": title,
                              "producer": producer,
                              "vintage": vintage,
                              "size_ml": size_ml,
                              "color": color,
                              "country": country,
                              "region": region,
                              "appellation": "",
                              "grapes": grapes,
                              "grape_blend": "",
                              "blend_source": "",
                              "aromas": aromas,
                              "aromas_source": aromas_source,
                              "notes": notes,
                              "avg_score": avg_score if avg_score is not None else "",
                              "scores": scores_str,
                              "score_links": product_url if scores_str else "",
                              "details_link": product_url,
                          })

                          prices_rows.append({
                              "wine": title,
                              "producer": producer,
                              "vintage": vintage,
                              "size_ml": size_ml,
                              "avg_price_gbp": price_gbp,
                              "avg_price_eur": price_eur,
                              "avg_price_usd": price_usd,
                              "min_price_gbp": price_gbp,
                              "max_price_gbp": price_gbp,
                              "shops_count": 1,
                              "in_stock": in_stock,
                              "sold_in": m["sold_in"],
                              "prices": f"{m['name']}: {price_raw:.2f} {cur}",
                              "cheapest_link": product_url,
                              "price_note": f"Shopify harvest {date.today().isoformat()}",
                              "links": f"{m['name']}: {product_url}",
                          })

                      time.sleep(args.delay)

              out_det = Path(args.out_details)
              out_pri = Path(args.out_prices)
              out_det.parent.mkdir(parents=True, exist_ok=True)

              pd.DataFrame(details_rows).to_csv(out_det, index=False, encoding="utf-8-sig")
              pd.DataFrame(prices_rows).to_csv(out_pri, index=False, encoding="utf-8-sig")

              print(f"\nDONE! Harvested {len(details_rows):,} wines across {len(new_producers):,} BRAND-NEW producers.")
              print(f"  -> {out_det}")
              print(f"  -> {out_pri}")


          if __name__ == "__main__":
              main()
          EOF
          python /tmp/shopify_wine_harvester.py \
            --existing-details content/prices/wine_details.csv \
            --out-details content/prices/wine_details_shopify_new.csv \
            --out-prices content/prices/wine_prices_shopify_new.csv \
            --target-producers "${{ github.event.inputs.target_producers || '2500' }}"

      - name: Commit new companion CSVs (leaving existing CSVs untouched)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/prices/wine_details_shopify_new.csv content/prices/wine_prices_shopify_new.csv
          git diff --staged --quiet || git commit -m "Add harvested Shopify niche wine companion CSVs (58 shops)"
          git push

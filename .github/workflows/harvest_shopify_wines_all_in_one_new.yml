name: Harvest New Shopify Wine Producers

on:
  workflow_dispatch:
    inputs:
      target_producers:
        description: "Minimum new producers to harvest (0 = scan all 58 shops)"
        required: false
        default: "2500"

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests urllib3


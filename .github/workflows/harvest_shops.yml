name: Harvest wine shops (Shopify catalogues)

# Downloads every shop in tools/prices/shops.json on runners (the dev container cannot reach the shops), one job per shop,
# and pushes each shop's raw catalogue to the `shop-data` branch as soon as it is done (<host>.jsonl.gz + <host>.report.json).
# Turning them into the price list happens locally:
#   shopify_to_sources.py -> legacy_details.py -> merge_prices.py -> enrich_details.py -> build_app_wines.py / build_app_prices.py
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these hosts (comma separated); empty = all shops; 'missing' = shops not yet on shop-data"
        required: false
        default: ""
  push:
    branches: ["claude/**"]
    paths:
      - "tools/prices/shops.json"
      - "tools/prices/harvest_shopify.py"
      - ".github/workflows/harvest_shops.yml"

permissions:
  contents: write

concurrency:
  group: harvest-shops
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.l.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        # a push only fills in shops missing from shop-data; a manual run without input refreshes every shop
        run: |
          ONLY="${{ github.event.inputs.only }}"
          [ "${{ github.event_name }}" = "push" ] && ONLY=missing
          if [ "$ONLY" = "missing" ]; then
            have=$(git ls-remote --exit-code origin refs/heads/shop-data >/dev/null && git fetch -q --depth 1 origin shop-data && git ls-tree --name-only FETCH_HEAD | sed -n 's/\.report\.json$//p' | paste -sd, -)
            echo "hosts=$(python3 tools/prices/harvest_shopify.py --list --skip "$have")" >> "$GITHUB_OUTPUT"
          elif [ -n "$ONLY" ]; then
            python3 -c "import json,sys;print('hosts='+json.dumps(sys.argv[1].split(',')))" "$ONLY" >> "$GITHUB_OUTPUT"
          else
            echo "hosts=$(python3 tools/prices/harvest_shopify.py --list)" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: Make sure the shop-data branch exists
        run: |
          if ! git ls-remote --exit-code origin refs/heads/shop-data; then
            mkdir /tmp/sd && cd /tmp/sd && git init -q -b shop-data
            git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
            echo "Raw Shopify catalogues of the wine shops in tools/prices/shops.json (harvest_shops.yml)." > README.md
            git add README.md && git commit -qm "shop-data" && git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shop-data
          fi

  shop:
    needs: list
    if: ${{ needs.list.outputs.hosts != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        host: ${{ fromJson(needs.list.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Harvest ${{ matrix.host }}
        run: python3 tools/prices/harvest_shopify.py --out out --only "${{ matrix.host }}" --workers 1 --budget 9000
      - name: Push to shop-data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          H="${{ matrix.host }}"
          mkdir /tmp/sd && cd /tmp/sd && git init -q -b shop-data
          for i in $(seq 1 15); do
            if git fetch -q --depth 1 "$URL" shop-data && git reset -q --hard FETCH_HEAD; then
              cp "$GITHUB_WORKSPACE"/out/* .
              date -u +%Y-%m-%dT%H:%MZ > HARVESTED_AT
              git add -A
              git diff --cached --quiet || git commit -qm "$H"
              git push -q "$URL" HEAD:shop-data || true
            fi
            # done only when the branch really has this shop's report
            if git fetch -q --depth 1 "$URL" shop-data && git cat-file -e "FETCH_HEAD:$H.report.json" 2>/dev/null \
               && [ "$(git show "FETCH_HEAD:$H.report.json" | sha1sum)" = "$(sha1sum < "$GITHUB_WORKSPACE/out/$H.report.json")" ]; then
              echo "saved $H"; exit 0
            fi
            sleep $((RANDOM % 30 + 10))
          done
          echo "could not save $H"; exit 1

name: Fetch photos
# Downloads openly licensed photos from Wikimedia Commons (content/photos.json) with credits.
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p out
          python3 tools/fetch_photos.py content/photos.json out
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: photos
          path: out

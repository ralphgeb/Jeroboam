name: Build and upload to TestFlight

# Manual for now: open the Actions tab, pick this workflow, press "Run workflow".
# Once a run succeeds you can add a `push:` trigger for the main branch.
on:
  workflow_dispatch:
    inputs:
      for_app_store:
        description: "For App Store review: no TestFlight tools or test checkout in this build"
        type: boolean
        default: false

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Jeroboam

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Claude through Jero's server (backend/cloudflare /claude) once the repo variable CLAUDE_PROXY_READY is "true":
      # then the Anthropic key is NOT put into the app at all. Until then the old way (key in the build) keeps scanning working.
      JERO_API_KEY: ${{ vars.CLAUDE_PROXY_READY != 'true' && secrets.ANTHROPIC_API_KEY || '' }}
      JERO_CLAUDE_PROXY: ${{ vars.CLAUDE_PROXY_READY == 'true' && '1' || '' }}
      JERO_STORE_BUILD: ${{ inputs.for_app_store && '1' || '' }}
      JERO_PRICE_URL: ${{ secrets.PRICE_DB_URL }}
      JERO_PRICE_KEY: ${{ secrets.PRICE_DB_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the secrets are set and look right
        run: |
          bad=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret $v"; bad=1; fi
          done
          trim() { printf %s "$1" | tr -d '[:space:]'; }
          team=$(trim "$APPLE_TEAM_ID"); key=$(trim "$ASC_KEY_ID"); iss=$(trim "$ASC_ISSUER_ID")
          [ "${#APPLE_TEAM_ID}" != "${#team}" ] && echo "::warning::APPLE_TEAM_ID had stray spaces or a line break; ignoring them"
          [ "${#ASC_KEY_ID}" != "${#key}" ] && echo "::warning::ASC_KEY_ID had stray spaces or a line break; ignoring them"
          [ "${#ASC_ISSUER_ID}" != "${#iss}" ] && echo "::warning::ASC_ISSUER_ID had stray spaces or a line break; ignoring them"
          [[ "$team" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID should be 10 letters/digits, yours is ${#team} characters"; bad=1; }
          [[ "$key" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::ASC_KEY_ID should be 10 letters/digits, yours is ${#key} characters"; bad=1; }
          [[ "$iss" =~ ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$ ]] || { echo "::error::ASC_ISSUER_ID should look like xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"; bad=1; }
          echo "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY" || { echo "::error::ASC_PRIVATE_KEY must include the -----BEGIN PRIVATE KEY----- line"; bad=1; }
          echo "$ASC_PRIVATE_KEY" | grep -q "END PRIVATE KEY" || { echo "::error::ASC_PRIVATE_KEY must include the -----END PRIVATE KEY----- line"; bad=1; }
          [ "$(echo "$ASC_PRIVATE_KEY" | wc -l | tr -d ' ')" -lt 3 ] && echo "::error::ASC_PRIVATE_KEY is on one line; paste it exactly as in the .p8 file (several lines)" && bad=1
          [ "$bad" = 0 ] || exit 1
          echo "Secrets look well-formed."

      - name: Save the App Store Connect API key
        run: |
          echo "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Remove old Development certificates (so Apple's certificate limit never blocks a build)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, urllib.parse
          import jwt
          key = open(os.environ["RUNNER_TEMP"] + "/AuthKey.p8").read()
          kid = os.environ["ASC_KEY_ID"].strip()
          iss = os.environ["ASC_ISSUER_ID"].strip()
          now = int(time.time())
          token = jwt.encode({"iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          def call(method, url):
              req = urllib.request.Request(url, method=method, headers={"Authorization": "Bearer " + token})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else {}
          q = urllib.parse.urlencode({"limit": "200", "filter[certificateType]": "DEVELOPMENT,IOS_DEVELOPMENT"})
          try:
              certs = call("GET", "https://api.appstoreconnect.apple.com/v1/certificates?" + q).get("data", [])
              print("Found", len(certs), "development certificate(s)")
              for c in certs:
                  name = c["attributes"].get("name") or c["attributes"].get("displayName") or c["id"]
                  try:
                      call("DELETE", "https://api.appstoreconnect.apple.com/v1/certificates/" + c["id"])
                      print("Deleted", name, c["id"])
                  except urllib.error.HTTPError as e:
                      print("::warning::Could not delete", name, e.code, e.read().decode()[:300])
          except urllib.error.HTTPError as e:
              print("::warning::Certificate cleanup skipped:", e.code, e.read().decode()[:300])
          PY

      - name: Enable app capabilities (Sign in with Apple, iCloud key-value store)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, urllib.parse
          import jwt
          key = open(os.environ["RUNNER_TEMP"] + "/AuthKey.p8").read()
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"].strip(), "iat": int(time.time()), "exp": int(time.time()) + 600,
                              "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"].strip(), "typ": "JWT"})
          def call(method, url, body=None):
              req = urllib.request.Request(url, method=method, data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
              with urllib.request.urlopen(req) as r:
                  b = r.read(); return json.loads(b) if b else {}
          q = urllib.parse.urlencode({"filter[identifier]": "com.ralphgeb.jero", "include": "bundleIdCapabilities"})
          res = call("GET", "https://api.appstoreconnect.apple.com/v1/bundleIds?" + q)
          ids = [d for d in res.get("data", []) if d["attributes"]["identifier"] == "com.ralphgeb.jero"]
          if not ids: print("::warning::bundle id not found"); raise SystemExit
          bid = ids[0]["id"]
          have = {i["attributes"]["capabilityType"] for i in res.get("included", []) if i["type"] == "bundleIdCapabilities"}
          print("Existing capabilities:", sorted(have))
          wanted = {"APPLE_ID_AUTH": [{"key": "APPLE_ID_AUTH_APP_CONSENT", "options": [{"key": "PRIMARY_APP_CONSENT"}]}],
                    "ICLOUD": [{"key": "ICLOUD_VERSION", "options": [{"key": "XCODE_6"}]}]}
          for cap, settings in wanted.items():
              if cap in have: continue
              body = {"data": {"type": "bundleIdCapabilities", "attributes": {"capabilityType": cap, "settings": settings},
                               "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": bid}}}}}
              try:
                  call("POST", "https://api.appstoreconnect.apple.com/v1/bundleIdCapabilities", body); print("Enabled", cap)
              except urllib.error.HTTPError as e:
                  print("::warning::Could not enable", cap, e.code, e.read().decode()[:400])
          # Stale profiles point at development certificates removed above; clear them so Xcode makes fresh ones.
          try:
              profs = call("GET", f"https://api.appstoreconnect.apple.com/v1/bundleIds/{bid}/profiles?limit=200").get("data", [])
              print("Found", len(profs), "profile(s)")
              for pf in profs:
                  try:
                      call("DELETE", "https://api.appstoreconnect.apple.com/v1/profiles/" + pf["id"])
                      print("Deleted profile", pf["attributes"].get("name"), pf["attributes"].get("profileState"))
                  except urllib.error.HTTPError as e:
                      print("::warning::Could not delete profile", pf["id"], e.code)
          except urllib.error.HTTPError as e:
              print("::warning::Could not list profiles", e.code)
          PY

      - name: Set up the Jero Plus subscription in App Store Connect ($0.99 a month)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, time, json, urllib.request, urllib.error, urllib.parse
          import jwt
          key = open(os.environ["RUNNER_TEMP"] + "/AuthKey.p8").read()
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"].strip(), "iat": int(time.time()), "exp": int(time.time()) + 1100,
                              "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"].strip(), "typ": "JWT"})
          API = "https://api.appstoreconnect.apple.com"
          def call(method, path, body=None):
              req = urllib.request.Request(path if path.startswith("http") else API + path, method=method,
                                           data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      b = r.read(); return json.loads(b) if b else {}
              except urllib.error.HTTPError as e:
                  print("::warning::", method, path.split("?")[0], e.code, e.read().decode()[:500]); return None
          def rel(t, i): return {"data": {"type": t, "id": i}}
          PID, GROUP = "com.ralphgeb.jero.plus.monthly", "Jero Plus"
          apps = (call("GET", "/v1/apps?" + urllib.parse.urlencode({"filter[bundleId]": "com.ralphgeb.jero"})) or {}).get("data", [])
          if not apps: print("::warning::Jero isn't in App Store Connect yet"); raise SystemExit
          app = apps[0]["id"]
          groups = (call("GET", f"/v1/apps/{app}/subscriptionGroups?limit=50") or {}).get("data", [])
          g = next((x for x in groups if x["attributes"]["referenceName"] == GROUP), None)
          if not g:
              g = (call("POST", "/v1/subscriptionGroups", {"data": {"type": "subscriptionGroups", "attributes": {"referenceName": GROUP},
                                                                   "relationships": {"app": rel("apps", app)}}}) or {}).get("data")
              if not g: raise SystemExit
              call("POST", "/v1/subscriptionGroupLocalizations", {"data": {"type": "subscriptionGroupLocalizations",
                   "attributes": {"name": "Jero Plus", "locale": "en-US"}, "relationships": {"subscriptionGroup": rel("subscriptionGroups", g["id"])}}})
              print("Created subscription group")
          subs = (call("GET", f"/v1/subscriptionGroups/{g['id']}/subscriptions?limit=50") or {}).get("data", [])
          sub = next((x for x in subs if x["attributes"]["productId"] == PID), None)
          if not sub:
              sub = (call("POST", "/v1/subscriptions", {"data": {"type": "subscriptions", "attributes": {
                  "name": "Jero Plus Monthly", "productId": PID, "subscriptionPeriod": "ONE_MONTH", "groupLevel": 1, "familySharable": False,
                  "reviewNote": "Unlocks every level, every country in the atlas, unlimited atlas cards and the wine journal."},
                  "relationships": {"group": rel("subscriptionGroups", g["id"])}}}) or {}).get("data")
              if not sub: raise SystemExit
              call("POST", "/v1/subscriptionLocalizations", {"data": {"type": "subscriptionLocalizations", "attributes": {
                  "name": "Jero Plus", "locale": "en-US", "description": "Every level, the whole atlas and your journal"},
                  "relationships": {"subscription": rel("subscriptions", sub["id"])}}})
              print("Created subscription", PID)
          sid = sub["id"]
          print("Subscription state:", sub["attributes"].get("state"))
          # territories first: Apple refuses prices in places the subscription isn't sold yet
          terr = [t["id"] for t in (call("GET", "/v1/territories?limit=200") or {}).get("data", [])]
          if terr and call("GET", f"/v1/subscriptions/{sid}/subscriptionAvailability") is None:
              r = call("POST", "/v1/subscriptionAvailabilities", {"data": {"type": "subscriptionAvailabilities", "attributes": {"availableInNewTerritories": True},
                   "relationships": {"subscription": rel("subscriptions", sid), "availableTerritories": {"data": [{"type": "territories", "id": t} for t in terr]}}}})
              print("Availability set in", len(terr), "territories" if r is not None else "territories (failed)")
          have = (call("GET", f"/v1/subscriptions/{sid}/prices?limit=1") or {}).get("data", [])
          if not have:
              pts = call("GET", f"/v1/subscriptions/{sid}/pricePoints?" + urllib.parse.urlencode({"filter[territory]": "USA", "limit": "200"})) or {}
              pp = next((x for x in pts.get("data", []) if x["attributes"].get("customerPrice") == "0.99"), None)
              if pp:
                  todo = [pp["id"]]
                  url = f"/v1/subscriptionPricePoints/{pp['id']}/equalizations?limit=200"
                  while url:
                      r = call("GET", url) or {}
                      todo += [x["id"] for x in r.get("data", [])]
                      url = (r.get("links") or {}).get("next")
                  ok = 0
                  for i in todo:
                      if call("POST", "/v1/subscriptionPrices", {"data": {"type": "subscriptionPrices", "attributes": {"preserveCurrentPrice": False},
                              "relationships": {"subscription": rel("subscriptions", sid), "subscriptionPricePoint": rel("subscriptionPricePoints", i)}}}) is not None:
                          ok += 1
                  print("Set $0.99 (and equivalents) in", ok, "territories")
              else:
                  print("::warning::no $0.99 price point found")
          print("Done. A review screenshot can be added in App Store Connect; until the product loads, the app uses its test checkout.")
          PY

      - name: Select the newest released Xcode 
        run: |
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app
          best=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE "beta|rc|preview" | sort -V | tail -1)
          if [ -n "$best" ]; then sudo xcode-select -s "$best/Contents/Developer"; fi
          xcodebuild -version; swift --version
          echo "::notice::Using $(xcodebuild -version | head -1) / $(swift --version 2>&1 | head -1)"

      # Full-size photo sync (CloudKit) needs the iCloud container iCloud.com.ralphgeb.jero, registered once by hand in the
      # Apple Developer portal (Identifiers > iCloud Containers, then App ID com.ralphgeb.jero > iCloud > CloudKit + that
      # container). Set the repository variable CLOUDKIT_READY to true afterwards; until then the app syncs as before.
      - name: Add the CloudKit container (when CLOUDKIT_READY is set)
        if: ${{ vars.CLOUDKIT_READY == 'true' }}
        run: |
          python3 - <<'PY'
          p = "project.yml"   # the job runs inside Jeroboam/
          s = open(p).read()
          s = s.replace("        com.apple.security.application-groups: [group.com.ralphgeb.jero]\n    info:\n      path: Sources/Info.plist",
                        "        com.apple.security.application-groups: [group.com.ralphgeb.jero]\n"
                        "        com.apple.developer.icloud-services: [CloudKit]\n"
                        "        com.apple.developer.icloud-container-identifiers: [iCloud.com.ralphgeb.jero]\n"
                        "    info:\n      path: Sources/Info.plist", 1)
          s = s.replace('JERO_CLOUDKIT: ""', 'JERO_CLOUDKIT: "1"', 1)
          assert "icloud-services" in s and 'JERO_CLOUDKIT: "1"' in s, "project.yml did not change as expected"
          open(p, "w").write(s)
          print("CloudKit entitlements added")
          PY
      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (Xcode creates and signs with Apple-managed certificates)
        run: |
          APPLE_TEAM_ID=$(printf %s "$APPLE_TEAM_ID" | tr -d '[:space:]')
          ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf %s "$ASC_ISSUER_ID" | tr -d '[:space:]')
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project Jeroboam.xcodeproj \
            -scheme Jeroboam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            JERO_API_KEY="$JERO_API_KEY" \
            JERO_CLAUDE_PROXY="$JERO_CLAUDE_PROXY" \
            JERO_STORE_BUILD="$JERO_STORE_BUILD" \
            JERO_PRICE_URL="$JERO_PRICE_URL" \
            JERO_PRICE_KEY="$JERO_PRICE_KEY" \
            2>&1 | tee build/archive.log || {
              # Show the real reasons as red annotations at the top of the run page
              grep -E -A2 "error:|ARCHIVE FAILED|No profiles|requires a provisioning|Provisioning profile|No Accounts|not registered" build/archive.log \
                | grep -v '^--$' | sed 's/%/%25/g; s/Team "[A-Z0-9]*"/Team "(hidden)"/' | awk '!seen[$0]++' | head -25 | while IFS= read -r line; do echo "::error::${line}"; done
              exit 1
            }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: Jeroboam/build/*.log

      - name: Export and upload to TestFlight
        run: |
          APPLE_TEAM_ID=$(printf %s "$APPLE_TEAM_ID" | tr -d '[:space:]')
          ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf %s "$ASC_ISSUER_ID" | tr -d '[:space:]')
          set -o pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee build/export.log || {
            grep -iE "error|invalid|failed|already|rejected|missing" build/export.log | sort -u | head -15 | while read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }

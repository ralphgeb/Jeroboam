name: TestFlight build status
# Asks App Store Connect what happened to the latest uploads (processing state, TestFlight state, compliance).
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/asc-status.yml"]
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - run: pip install --quiet pyjwt cryptography
      - shell: python
        run: |
          import os, time, json, urllib.request, urllib.parse, jwt
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"].strip(), "iat": now, "exp": now + 600,
                              "aud": "appstoreconnect-v1"}, os.environ["ASC_PRIVATE_KEY"], algorithm="ES256",
                             headers={"kid": os.environ["ASC_KEY_ID"].strip(), "typ": "JWT"})
          def get(path, **q):
              url = "https://api.appstoreconnect.apple.com/v1/" + path + ("?" + urllib.parse.urlencode(q) if q else "")
              with urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": "Bearer " + token})) as r:
                  return json.loads(r.read())
          app = get("apps", **{"filter[bundleId]": "com.ralphgeb.jero"})["data"][0]
          print("App", app["attributes"]["name"], app["id"])
          b = get("builds", **{"filter[app]": app["id"], "sort": "-uploadedDate", "limit": "6",
                               "include": "buildBetaDetail,preReleaseVersion"})
          inc = {(i["type"], i["id"]): i["attributes"] for i in b.get("included", [])}
          for d in b["data"]:
              a = d["attributes"]
              rel = d["relationships"]
              det = inc.get(("buildBetaDetails", (rel["buildBetaDetail"]["data"] or {}).get("id")), {})
              ver = inc.get(("preReleaseVersions", (rel["preReleaseVersion"]["data"] or {}).get("id")), {})
              print(f"build {a['version']} (v{ver.get('version')}) uploaded {a['uploadedDate']}: "
                    f"processing={a['processingState']} expired={a['expired']} "
                    f"encryption={a.get('usesNonExemptEncryption')} "
                    f"internal={det.get('internalBuildState')} external={det.get('externalBuildState')}")

name: Shortlist test (scanning)
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/shortlist-test.yml", "tools/shortlist_test.py"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      URL: ${{ secrets.PRICE_DB_URL }}
      KEY: ${{ secrets.PRICE_DB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyyaml && python3 tools/shortlist_test.py
      - if: always()
        run: '[ -f shortlist_report.md ] && cat shortlist_report.md >> "$GITHUB_STEP_SUMMARY" || true'

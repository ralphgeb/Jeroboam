# History shown on each region's Atlas page: the why, how and when of the place.
france: "Greeks planted vines at Marseille around 600 BC and the Romans spread them up the Rhône, to Bordeaux, Burgundy and the Loire. Medieval monks mapped the best plots; merchants and kings built the great names. Phylloxera ruined almost every vineyard in the 1870s–80s, and fraud that followed led to the AOC laws of 1935, the model for wine laws worldwide."
bordeaux: "Founded as Roman Burdigala, Bordeaux grew rich on trade: it belonged to the English crown from 1152 to 1453 and shipped 'claret' to London. In the 1600s Dutch engineers drained the Médoc, revealing the gravel where Cabernet thrives; estates such as Haut-Brion began selling wine by name. The 1855 classification, Émile Peynaud's scientific winemaking and the 1982 vintage made Bordeaux the world's benchmark for fine wine."
burgundy: "Benedictine and Cistercian monks spent centuries tasting each plot and walling the best, such as the Clos de Vougeot. The Dukes of Burgundy made its wine a diplomatic gift, and in 1395 Philip the Bold banned Gamay to protect Pinot Noir. The Revolution sold Church land and Napoleon's inheritance law split it among heirs, which is why vineyards today are divided among many small growers. UNESCO listed the climats in 2015."
champagne: "Still wines from Champagne were served at the coronations of French kings in Reims. Cold winters stopped fermentation and spring restarted it, so the wine was often fizzy by accident. Stronger English glass, Dom Pérignon's careful blending and the widow Clicquot's riddling (1816) turned an accident into a luxury. Riots in 1911 led to the strict borders of today's appellation."
rhone: "Romans planted the steep granite hills of Côte-Rôtie and Hermitage. In the 14th century the popes lived in Avignon and gave Châteauneuf-du-Pape its name. In the 1920s Baron Le Roy wrote rules for Châteauneuf that became the blueprint for France's appellation system."
loire: "The 'Garden of France', lined with royal châteaux. The river carried wine to Paris and to Dutch merchants, who loved sweet Chenin Blanc from Anjou and Vouvray. Sancerre, once a red-wine village, was replanted with Sauvignon Blanc after phylloxera and became famous in Paris bistros in the 1960s–70s."
alsace: "Alsace changed hands between France and Germany four times between 1871 and 1945, which explains its German grape names, tall flute bottles and wines labeled by grape. After 1918 growers turned from bulk wine to quality; Grand Cru vineyards were defined from 1975."
beaujolais: "Gamay was banished from the Côte d'Or in 1395 and found its home on Beaujolais' granite hills. Lyon became its thirsty market. In the 1970s–80s Georges Duboeuf turned the November release of Beaujolais Nouveau into a worldwide event; today the ten crus are winning back respect."
italy: "Greeks called southern Italy Oenotria, 'land of vines'; the Etruscans and then Rome turned wine into an industry. Families such as the Antinori have made wine for 600 years. Italy's DOC laws arrived in 1963; the Super Tuscan rebels of the 1970s forced them to modernize, and today Italy grows more native grapes than any other country."
piedmont: "Nebbiolo was long made sweet and slightly fizzy. In the mid-1800s the Marchesa Falletti of Barolo and Count Cavour hired the French winemaker Louis Oudart, who made it dry and age-worthy: Barolo became 'the wine of kings, the king of wines', the favorite of the House of Savoy. Since the 1980s, 'modernists' with small barrels and 'traditionalists' with big casks have argued over its style."
tuscany: "Cosimo III de' Medici drew Chianti's borders in 1716, and Baron Ricasoli wrote its Sangiovese recipe in 1872. When the rules allowed thin, white-grape-heavy blends, rebels made Super Tuscans: Sassicaia (1968) and Tignanello (1971). Brunello di Montalcino was created by the Biondi-Santi family in the late 1800s."
spain: "Phoenicians and Romans planted Spain's first vineyards; the Moors limited wine but kept vines for table grapes. Sherry traded with England for centuries, and phylloxera in France sent French merchants to Rioja in the 1870s. After Franco, Spain modernized fast: Ribera del Duero, Priorat and Rías Baixas rose from almost nothing in the 1980s–90s."
rioja: "When phylloxera and mildew hit Bordeaux in the 1860s–70s, French merchants came to Rioja for wine, bringing oak barrels and Bordeaux methods. A railway from Haro took the wine north. Houses founded then, such as López de Heredia (1877) and CVNE (1879), still define classic, long-aged Rioja."
ribera-del-duero: "Vega Sicilia, founded in 1864 with Bordeaux vines, was for a century Spain's only famous red from the Duero. When Alejandro Fernández's Pesquera won praise from Robert Parker in the 1980s, the region boomed and gained its DO in 1982."
portugal: "Portugal's long alliance with England shaped its wine. The Methuen Treaty of 1703 gave Portuguese wine low taxes in England, and fortified Douro wine became Port. Madeira, heated on long voyages, became America's favorite wine in colonial times; toasts at the signing of the Declaration of Independence were made with it."
douro: "The Marquis of Pombal demarcated the Douro in 1756, one of the first protected wine regions. Terraces were cut by hand into schist over centuries. British families such as Taylor's, Croft and Graham's built lodges in Vila Nova de Gaia, where Port aged before shipping. UNESCO listed the valley in 2001."
germany: "The Romans planted the Mosel and the monks of Kloster Eberbach made the Rheingau famous. In 1775 a late messenger at Schloss Johannisberg delayed the harvest and gave birth to Spätlese. In the 1800s top Rieslings cost more than Bordeaux First Growths; two wars and cheap sweet exports damaged its name, now rebuilt by dry Grosses Gewächs wines."
mosel: "Roman poet Ausonius praised the Mosel's vineyards in the 4th century. Monks and electors planted Riesling on the steep slate slopes from the 1400s. The light, slightly sweet Kabinett style made it famous; today warmer summers let growers make more dry Riesling too."
austria: "Vines have grown along the Danube since the Celts and Romans. In 1985 a few brokers were caught sweetening wine with glycol, and exports collapsed. Austria answered with some of the strictest wine laws in Europe and rebuilt its name on dry Grüner Veltliner and Riesling from the Wachau, Kamptal and Kremstal."
hungary: "Hungary's wine culture flourished under the Habsburgs. Tokaj was classified in 1730 and was the toast of European courts. Communism (1949–1989) turned vineyards into state farms; since the 1990s private and foreign investment has revived Tokaj and red regions such as Villány and Eger."
tokaj: "Noble-rot wines were made in Tokaj by the 1600s; by legend a harvest delayed by a Turkish raid revealed the magic of botrytis. The vineyards were classified in 1730, and Louis XIV called Tokaji 'the wine of kings, the king of wines'. After decades as a state farm, the region was revived from 1990 by Royal Tokaji and others."
greece: "Ancient Greece built a wine culture, with festivals for Dionysus, symposia and amphorae shipped around the Mediterranean. Centuries of Ottoman rule and then war held winemaking back. Since the 1980s a new generation has rediscovered native grapes such as Assyrtiko, Xinomavro and Agiorgitiko."
santorini: "On this volcanic island, vines grow in sand-like ash that phylloxera cannot cross, so some roots are centuries old. Growers weave vines into low baskets, kouloura, to protect grapes from wind. Its Vinsanto, a sweet wine from sun-dried grapes, was traded across the Mediterranean in Venetian times."
usa: "Spanish missionaries planted vines in California from 1769. The Gold Rush brought immigrants, and Napa and Sonoma grew quickly until phylloxera and then Prohibition (1920–1933) closed most wineries. Robert Mondavi's winery (1966) and the 1976 Judgment of Paris began the modern era."
napa-valley: "Charles Krug founded Napa's first commercial winery in 1861. Prohibition shut most of the valley; Beaulieu Vineyard kept going with sacramental wine. Robert Mondavi's Oakville winery (1966) and Stag's Leap's victory at the 1976 Judgment of Paris made Napa Cabernet world-famous."
chile: "Spanish conquistadors and missionaries planted País vines in the 1550s. In the 1850s landowners imported Bordeaux vines, including Carmenère, just before phylloxera struck France. Protected by mountains, ocean and desert, Chile never had phylloxera; Carmenère was rediscovered there in 1994, long mistaken for Merlot."
argentina: "Missionaries brought vines in the 1550s; Italian and Spanish immigrants in the late 1800s built a huge industry for home drinking. In the 1990s producers such as Nicolás Catena bet on quality and exports, and Malbec from high Mendoza vineyards became Argentina's signature."
mendoza: "Irrigation canals first dug by the Huarpe people, then extended by Spanish settlers, turned Mendoza's desert into vineyards fed by Andean snowmelt. A railway from Buenos Aires (1885) opened its market. From the 1990s, altitude vineyards in the Uco Valley made it a world name for Malbec."
australia: "Vines arrived with the First Fleet in 1788. James Busby brought hundreds of cuttings from Europe in the 1830s, and German Lutherans settled the Barossa in the 1840s. Strict quarantine kept phylloxera out of South Australia, so some of the world's oldest vines grow there. Penfolds Grange (1951) proved Australia could make icons."
barossa: "Silesian Lutherans fleeing persecution settled the valley from 1842 and planted Shiraz, Grenache and Mourvèdre. Phylloxera never reached South Australia, so vines from the 1840s still produce wine. In the 1980s, growers were paid to pull out old vines; champions such as Peter Lehmann saved many of them."
new-zealand: "Missionary Samuel Marsden planted New Zealand's first vines in 1819. For a century the industry was small and focused on fortified wine. Marlborough's first commercial vineyards were planted in 1973, and Cloudy Bay's 1985 Sauvignon Blanc made the country famous almost overnight."
marlborough: "Marlborough was sheep country until Montana planted vines in 1973. Sunny days, cold nights and stony soils gave Sauvignon Blanc an intense, pungent style unlike any other. Cloudy Bay's 1985 release launched a worldwide category; today the region makes most of New Zealand's wine."
south-africa: "The Dutch East India Company planted vines at the Cape in 1655, and Constantia's sweet wine was drunk by Napoleon and Jane Austen's heroines. Phylloxera, then the KWV cooperative's focus on volume, and sanctions under apartheid held the Cape back; since 1994 it has reinvented itself around old-vine Chenin Blanc and regions such as Swartland."
lebanon: "Phoenician traders from the Lebanese coast spread wine across the Mediterranean 3,000 years ago, and the Romans built the Temple of Bacchus at Baalbek. Jesuit monks founded Château Ksara in 1857 with French vines. Château Musar kept making wine through the civil war (1975–1990), and since then dozens of new estates have opened."
bekaa-valley: "The high plateau between the Mount Lebanon and Anti-Lebanon ranges has grown grapes since antiquity. Jesuits planted Cinsault and Bordeaux varieties at Ksara in 1857; Château Kefraya and Château Musar's vineyards followed. Today most Lebanese wine comes from the Bekaa, at about 1,000 m."

  grapes: [syrah, grenache, mourvedre, viognier, marsanne, cinsault]
  summary: "Two regions in one: the narrow, steep Northern Rhône devoted to Syrah, and the broad, sunny Southern Rhône of Grenache-based blends."
  styles: "North: single-varietal Syrah (Hermitage, Côte-Rôtie), Viognier (Condrieu). South: GSM blends (Châteauneuf-du-Pape, Côtes du Rhône), rosé (Tavel) and sweet Muscat de Beaumes-de-Venise."
  classification: "Côtes du Rhône → Côtes du Rhône Villages → named villages → crus such as Gigondas and Châteauneuf-du-Pape."
  facts: ["Châteauneuf-du-Pape allows 13 grape varieties.", "Côte-Rôtie means 'roasted slope', after its steep sun-baked terraces."]
  sub: [cote-rotie, condrieu, saint-joseph, hermitage, crozes-hermitage, cornas, chateauneuf-du-pape, gigondas, vacqueyras, tavel, cotes-du-rhone]
- {id: cote-rotie, name: Côte-Rôtie, country: France, kind: subregion, map: rhone, highlight: [cote-rotie], level: 2, grapes: [syrah, viognier], summary: "Perfumed, elegant Syrah from very steep terraces; up to 20% Viognier may be co-fermented for aroma and color."}
- {id: condrieu, name: Condrieu, country: France, kind: subregion, map: rhone, highlight: [condrieu], level: 2, grapes: [viognier], summary: "Viognier's spiritual home: heady apricot, peach and blossom, full-bodied and silky."}

- {id: savoie, name: Savoie, country: France, kind: region, map: france, highlight: [savoie], level: 3, grapes: [gamay, chardonnay], summary: "Alpine vineyards making crisp, light whites (Jacquère, Altesse) and reds (Mondeuse) perfect with fondue."}
- id: rhone

- {id: crozes-hermitage, name: Crozes-Hermitage, country: France, kind: subregion, map: rhone, highlight: [crozes-hermitage], level: 2, grapes: [syrah, marsanne], summary: "The largest Northern Rhône appellation, around Hermitage: fruity, peppery, approachable Syrah."}
- {id: cornas, name: Cornas, country: France, kind: subregion, map: rhone, highlight: [cornas], level: 3, grapes: [syrah], summary: "100% Syrah from a warm granite amphitheater: dark, tannic and wild."}

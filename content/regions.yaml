- {id: cotes-du-rhone, name: Côtes du Rhône, country: France, kind: subregion, map: rhone, highlight: [southern-rhone], level: 1, grapes: [grenache, syrah, mourvedre], summary: "The big regional appellation, mostly in the south: juicy, spicy red blends with great value."}

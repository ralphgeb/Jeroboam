# ======================================================================= LEBANON
- id: lebanon
  name: Lebanon
  country: Lebanon
  kind: country
  map: lebanon
  level: 3
  climate: "Mediterranean, but the vineyards sit high: the Bekaa Valley floor is around 1,000 m, giving hot days, cold nights and a long, dry growing season."
  grapes: [cinsault, cabernet-sauvignon, syrah, carignan, obaideh, merwah]
  summary: "One of the oldest wine cultures on earth, from Phoenician traders to the Temple of Bacchus at Baalbek. Today it is known for structured red blends from the high Bekaa Valley."
  classification: "No formal appellation system yet; wines are labeled by producer, region and grape."
  styles: "Bordeaux- and Rhône-style red blends, often Cabernet Sauvignon with Cinsault, Carignan or Syrah; fresh whites from native Obaideh and Merwah; dry rosé from Cinsault."
  facts:
    - "**Château Musar** (founded 1930) made Lebanon famous, with long-lived reds released years after the vintage."
    - "**Château Ksara**, founded by Jesuits in 1857, keeps its wine in Roman-era limestone caves."
    - "Most vineyards lie in the **Bekaa Valley**, a high plateau between the Mount Lebanon and Anti-Lebanon ranges."
    - "**Obaideh** and **Merwah** are native white grapes, sometimes compared to Chardonnay and Sémillon."
  sub: [bekaa-valley, baalbek, mount-lebanon, batroun]
- {id: bekaa-valley, name: Bekaa Valley, country: Lebanon, kind: region, map: lebanon, highlight: [bekaa-valley], level: 3, climate: "High plateau (about 1,000 m): sunny, dry summers with cool nights.", grapes: [cabernet-sauvignon, cinsault, syrah], summary: "The heart of Lebanese wine, from Zahlé south to the West Bekaa (Kefraya, Ammiq): home to Ksara and many leading estates. Ripe, spicy red blends with fresh acidity from the altitude."}
- {id: baalbek, name: Baalbek, country: Lebanon, kind: region, map: lebanon, highlight: [baalbek], level: 3, grapes: [cinsault, carignan], summary: "The northern Bekaa, near the Roman Temple of Bacchus. Drier and higher, with old bush vines and a growing number of new estates."}

- {id: marsannay, name: "Marsannay", country: France, kind: subregion, map: france, highlight: [marsannay], level: 3, grapes: [pinot-noir, chardonnay], summary: "The northern gateway to the Côte d'Or, just south of Dijon. The only Burgundy village appellation allowed to make rosé, alongside fresh Pinot Noir and Chardonnay."}
- {id: fixin, name: "Fixin", country: France, kind: subregion, map: france, highlight: [fixin], level: 3, grapes: [pinot-noir], summary: "A small village making firm, sturdy, rustic Pinot Noir, often good value compared with its famous neighbors. Clos de la Perrière is the best-known Premier Cru."}
- {id: gevrey-chambertin, name: "Gevrey-Chambertin", country: France, kind: subregion, map: france, highlight: [gevrey-chambertin], level: 3, grapes: [pinot-noir], summary: "The largest village of the Côte de Nuits and home of nine Grand Crus. Powerful, dark, structured reds with black cherry and spice, said to be Napoleon's favorite.", sub: [chambertin, chambertin-clos-de-beze, chapelle-chambertin, charmes-chambertin, griotte-chambertin, latricieres-chambertin, mazis-chambertin, ruchottes-chambertin]}
- {id: morey-saint-denis, name: "Morey-Saint-Denis", country: France, kind: subregion, map: france, highlight: [morey-saint-denis], level: 3, grapes: [pinot-noir], summary: "A small village between Gevrey and Chambolle with four Grand Crus (Clos de Tart, Clos des Lambrays, Clos de la Roche, Clos Saint-Denis). Its reds sit between Gevrey's power and Chambolle's silk.", sub: [clos-de-la-roche, clos-saint-denis, clos-des-lambrays, clos-de-tart]}
- {id: chambolle-musigny, name: "Chambolle-Musigny", country: France, kind: subregion, map: france, highlight: [chambolle-musigny], level: 3, grapes: [pinot-noir], summary: "The most delicate and perfumed reds of the Côte de Nuits, grown on chalky, limestone-rich soils. Home of the Grand Crus Musigny and Bonnes-Mares.", sub: [musigny, bonnes-mares]}
- {id: vougeot, name: "Vougeot", country: France, kind: subregion, map: france, highlight: [vougeot], level: 3, grapes: [pinot-noir, chardonnay], summary: "The smallest village appellation of the Côte de Nuits, dominated by the walled Clos de Vougeot, built by Cistercian monks. A rare white Premier Cru, Clos Blanc de Vougeot, also exists.", sub: [clos-de-vougeot]}
- {id: vosne-romanee, name: "Vosne-Romanée", country: France, kind: subregion, map: france, highlight: [vosne-romanee], level: 3, grapes: [pinot-noir], summary: "Arguably the greatest red wine village on earth: Romanée-Conti, La Tâche, Richebourg, Romanée-Saint-Vivant, La Romanée, La Grande Rue, Échezeaux and Grands-Échezeaux. Silky, spicy, long-lived Pinot Noir.", sub: [echezeaux, grands-echezeaux, la-grande-rue, la-romanee, la-tache, richebourg, romanee-conti, romanee-saint-vivant]}
- {id: nuits-saint-georges, name: "Nuits-Saint-Georges", country: France, kind: subregion, map: france, highlight: [nuits-saint-georges], level: 3, grapes: [pinot-noir], summary: "The wine capital of the Côte de Nuits and its biggest town. Robust, earthy, age-worthy reds. It has no Grand Cru, but many fine Premiers Crus such as Les Saint-Georges and Les Vaucrains."}
- {id: ladoix, name: "Ladoix", country: France, kind: subregion, map: france, highlight: [ladoix], level: 3, grapes: [pinot-noir, chardonnay], summary: "The first village of the Côte de Beaune, sharing the slope of Corton. Fresh reds and whites, with parts of the Grand Crus Corton and Corton-Charlemagne."}
- {id: aloxe-corton, name: "Aloxe-Corton", country: France, kind: subregion, map: france, highlight: [aloxe-corton], level: 3, grapes: [pinot-noir, chardonnay], summary: "A village beneath the hill of Corton, which carries Burgundy's only red Grand Cru on the Côte de Beaune and the white Corton-Charlemagne.", sub: [corton, corton-charlemagne]}
- {id: pernand-vergelesses, name: "Pernand-Vergelesses", country: France, kind: subregion, map: france, highlight: [pernand-vergelesses], level: 3, grapes: [chardonnay, pinot-noir], summary: "A quiet village behind the hill of Corton. Good-value whites and reds, plus a share of Corton-Charlemagne on its western slope."}
- {id: savigny, name: "Savigny-lès-Beaune", country: France, kind: subregion, map: france, highlight: [savigny], level: 3, grapes: [pinot-noir], summary: "Light, red-fruited, early-drinking Pinot Noir from a village on both sides of a small valley north of Beaune."}
- {id: chorey, name: "Chorey-lès-Beaune", country: France, kind: subregion, map: france, highlight: [chorey], level: 3, grapes: [pinot-noir], summary: "Soft, fruity reds from flat land beside the road, mostly village-level wine and often excellent value."}
- {id: beaune, name: "Beaune", country: France, kind: subregion, map: france, highlight: [beaune], level: 3, grapes: [pinot-noir, chardonnay], summary: "The wine capital of Burgundy, with its famous Hospices de Beaune auction each November. Elegant, perfumed reds from many Premiers Crus (no Grand Cru) and some whites."}
- {id: pommard, name: "Pommard", country: France, kind: subregion, map: france, highlight: [pommard], level: 3, grapes: [pinot-noir], summary: "Powerful, structured reds with dark fruit and firm tannins that age well. Les Rugiens and Les Épenots are the best-known Premiers Crus."}
- {id: volnay, name: "Volnay", country: France, kind: subregion, map: france, highlight: [volnay], level: 3, grapes: [pinot-noir], summary: "Among the most elegant red Burgundies: pale, perfumed, silky, with red cherry and violets. Clos des Chênes and Caillerets are top Premiers Crus."}
- {id: monthelie, name: "Monthélie", country: France, kind: subregion, map: france, highlight: [monthelie], level: 3, grapes: [pinot-noir, chardonnay], summary: "A small village next to Volnay and Meursault, making good-value, Volnay-like reds and a little white."}
- {id: auxey-duresses, name: "Auxey-Duresses", country: France, kind: subregion, map: france, highlight: [auxey-duresses], level: 3, grapes: [pinot-noir, chardonnay], summary: "A hillside village at the end of a valley behind Meursault: affordable reds and nutty whites."}
- {id: saint-romain, name: "Saint-Romain", country: France, kind: subregion, map: france, highlight: [saint-romain], level: 3, grapes: [chardonnay, pinot-noir], summary: "A high, cool village known for fresh, mineral Chardonnay and light reds, often good value."}
- {id: meursault, name: "Meursault", country: France, kind: subregion, map: france, highlight: [meursault], level: 3, grapes: [chardonnay], summary: "Rich, rounded, nutty white Burgundy: hazelnut, butter and ripe orchard fruit. It has no Grand Cru, but Perrières, Genevrières and Charmes are great Premiers Crus."}
- {id: puligny-montrachet, name: "Puligny-Montrachet", country: France, kind: subregion, map: france, highlight: [puligny-montrachet], level: 3, grapes: [chardonnay], summary: "Tight, mineral, precise Chardonnay. It shares the Grand Cru Montrachet with Chassagne and holds Chevalier-Montrachet, Bâtard-Montrachet and Bienvenues-Bâtard-Montrachet.", sub: [montrachet, chevalier-montrachet, batard-montrachet, bienvenues-batard-montrachet]}
- {id: chassagne-montrachet, name: "Chassagne-Montrachet", country: France, kind: subregion, map: france, highlight: [chassagne-montrachet], level: 3, grapes: [chardonnay, pinot-noir], summary: "Fuller, richer whites than Puligny, plus some red. It shares Montrachet and Bâtard-Montrachet and holds Criots-Bâtard-Montrachet.", sub: [criots-batard-montrachet]}
- {id: saint-aubin, name: "Saint-Aubin", country: France, kind: subregion, map: france, highlight: [saint-aubin], level: 3, grapes: [chardonnay, pinot-noir], summary: "A high valley next to Puligny and Chassagne: crisp, mineral Chardonnay at a fraction of the price of its famous neighbors."}
- {id: santenay, name: "Santenay", country: France, kind: subregion, map: france, highlight: [santenay], level: 3, grapes: [pinot-noir], summary: "The southern end of the Côte de Beaune: sturdy, earthy reds, and a spa town."}
- {id: maranges, name: "Maranges", country: France, kind: subregion, map: france, highlight: [maranges], level: 3, grapes: [pinot-noir], summary: "The last appellation of the Côte d'Or, covering three villages: rustic, good-value Pinot Noir."}
- {id: bouzeron, name: "Bouzeron", country: France, kind: subregion, map: france, highlight: [bouzeron], level: 3, grapes: [chardonnay], summary: "The only village appellation in Burgundy for Aligoté, the region's other white grape: lively, lemony and herbal."}
- {id: rully, name: "Rully", country: France, kind: subregion, map: france, highlight: [rully], level: 3, grapes: [chardonnay, pinot-noir], summary: "The northernmost village of the Côte Chalonnaise: fresh Chardonnay, light reds and much of Burgundy's sparkling Crémant."}
- {id: mercurey, name: "Mercurey", country: France, kind: subregion, map: france, highlight: [mercurey], level: 3, grapes: [pinot-noir], summary: "The biggest and best-known red village of the Côte Chalonnaise: sturdy, fruity Pinot Noir at friendly prices."}
- {id: givry, name: "Givry", country: France, kind: subregion, map: france, highlight: [givry], level: 3, grapes: [pinot-noir], summary: "Soft, red-fruited Pinot Noir, once the favorite wine of King Henri IV."}
- {id: montagny, name: "Montagny", country: France, kind: subregion, map: france, highlight: [montagny], level: 3, grapes: [chardonnay], summary: "The Côte Chalonnaise's white-only appellation: crisp, unoaked-leaning Chardonnay, and everything is classed Premier Cru."}
- {id: chambertin, name: "Chambertin", country: France, kind: subregion, map: france, highlight: [chambertin], level: 3, grapes: [pinot-noir], summary: "'The king of wines': deep, powerful, tannic Pinot Noir that needs many years. A Grand Cru of Gevrey-Chambertin."}
- {id: chambertin-clos-de-beze, name: "Chambertin-Clos de Bèze", country: France, kind: subregion, map: france, highlight: [chambertin-clos-de-beze], level: 3, grapes: [pinot-noir], summary: "Next to Chambertin and every bit as great, with a little more finesse. Named after a vineyard planted by monks in the 7th century."}
- {id: chapelle-chambertin, name: "Chapelle-Chambertin", country: France, kind: subregion, map: france, highlight: [chapelle-chambertin], level: 3, grapes: [pinot-noir], summary: "One of the lighter, more elegant Chambertin Grand Crus."}
- {id: charmes-chambertin, name: "Charmes-Chambertin", country: France, kind: subregion, map: france, highlight: [charmes-chambertin], level: 3, grapes: [pinot-noir], summary: "The largest of the Gevrey Grand Crus: rich, fleshy, generous Pinot Noir. It includes Mazoyères-Chambertin."}
- {id: griotte-chambertin, name: "Griotte-Chambertin", country: France, kind: subregion, map: france, highlight: [griotte-chambertin], level: 3, grapes: [pinot-noir], summary: "A tiny Grand Cru, named after sour cherries (griottes), with silky red-fruited wines."}
- {id: latricieres-chambertin, name: "Latricières-Chambertin", country: France, kind: subregion, map: france, highlight: [latricieres-chambertin], level: 3, grapes: [pinot-noir], summary: "Firm, structured Grand Cru, lighter than Chambertin and long-lived."}
- {id: mazis-chambertin, name: "Mazis-Chambertin", country: France, kind: subregion, map: france, highlight: [mazis-chambertin], level: 3, grapes: [pinot-noir], summary: "Powerful, muscular Grand Cru with great depth, close to Chambertin in style."}
- {id: ruchottes-chambertin, name: "Ruchottes-Chambertin", country: France, kind: subregion, map: france, highlight: [ruchottes-chambertin], level: 3, grapes: [pinot-noir], summary: "A small, high Grand Cru on stony soil: finer, more floral wines."}
- {id: clos-de-la-roche, name: "Clos de la Roche", country: France, kind: subregion, map: france, highlight: [clos-de-la-roche], level: 3, grapes: [pinot-noir], summary: "The largest Grand Cru of Morey-Saint-Denis: a structured, earthy and powerful Pinot Noir."}
- {id: clos-saint-denis, name: "Clos Saint-Denis", country: France, kind: subregion, map: france, highlight: [clos-saint-denis], level: 3, grapes: [pinot-noir], summary: "Grand Cru that gave its name to the village: finely structured, perfumed reds."}
- {id: clos-des-lambrays, name: "Clos des Lambrays", country: France, kind: subregion, map: france, highlight: [clos-des-lambrays], level: 3, grapes: [pinot-noir], summary: "A Grand Cru almost entirely owned by one estate, promoted in 1981."}
- {id: clos-de-tart, name: "Clos de Tart", country: France, kind: subregion, map: france, highlight: [clos-de-tart], level: 3, grapes: [pinot-noir], summary: "A walled Grand Cru that has been a monopole (single owner) for centuries, with only three owners since 1141."}
- {id: musigny, name: "Musigny", country: France, kind: subregion, map: france, highlight: [musigny], level: 3, grapes: [pinot-noir], summary: "The most refined red Burgundy: silky, floral, ethereal. A tiny amount of white Musigny is also made."}
- {id: bonnes-mares, name: "Bonnes-Mares", country: France, kind: subregion, map: france, highlight: [bonnes-mares], level: 3, grapes: [pinot-noir], summary: "A Grand Cru on the border of Chambolle and Morey: firmer and darker than Musigny."}

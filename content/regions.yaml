- id: bordeaux
  name: Bordeaux
  country: France
  kind: region
  map: france
  level: 1
  climate: "Moderate maritime, moderated by the Atlantic and the Gironde estuary; vintages vary with autumn rain."
  grapes: [merlot, cabernet-sauvignon, cabernet-franc, petit-verdot, sauvignon-blanc, semillon]
  summary: "The world's most famous red wine region: blends of Cabernet Sauvignon and Merlot from châteaux on either side of the Gironde estuary, plus great sweet and dry whites."
  styles: "Mostly red blends. **Left Bank** (Médoc, Graves): gravel soils, Cabernet Sauvignon-led. **Right Bank** (Saint-Émilion, Pomerol): clay and limestone, Merlot-led. Dry whites from Sauvignon Blanc and Sémillon; sweet Sauternes."
  classification: "The **1855 Classification** ranked Médoc (and one Graves) châteaux from First to Fifth Growth; Sauternes was ranked too. Saint-Émilion has its own classification, revised about every ten years. Pomerol has none."
  facts: ["Blending spreads risk: Merlot ripens early, Cabernet Sauvignon late.", "The five First Growths are Lafite, Latour, Margaux, Haut-Brion and Mouton Rothschild (promoted in 1973)."]
  sub: [medoc, haut-medoc, saint-estephe, pauillac, saint-julien, margaux, pessac-leognan, graves, sauternes, entre-deux-mers, saint-emilion, pomerol, fronsac, castillon, bourg, blaye]
- {id: medoc, name: Médoc, country: France, kind: subregion, map: france, highlight: [medoc], level: 3, grapes: [cabernet-sauvignon, merlot], summary: "The northern, lower-lying part of the Left Bank peninsula. More clay and Merlot than the Haut-Médoc; good-value reds and many Crus Bourgeois."}
- {id: haut-medoc, name: Haut-Médoc, country: France, kind: subregion, map: france, highlight: [haut-medoc], level: 3, climate: "Gravel ridges near the estuary drain well and store heat, helping late-ripening Cabernet.", grapes: [cabernet-sauvignon, merlot, cabernet-franc, petit-verdot], summary: "The heart of the Left Bank, home to four famous communes and most of the 1855 classified growths.", sub: [saint-estephe, pauillac, saint-julien, margaux]}
- {id: saint-estephe, name: Saint-Estèphe, country: France, kind: subregion, map: france, highlight: [saint-estephe], level: 3, grapes: [cabernet-sauvignon, merlot], summary: "The northernmost famous commune: more clay, firmer and more rustic wines with high acidity and tannin. Cos d'Estournel and Montrose are leaders."}
- {id: pauillac, name: Pauillac, country: France, kind: subregion, map: france, highlight: [pauillac], level: 3, grapes: [cabernet-sauvignon, merlot], summary: "Home of three First Growths (Lafite, Latour, Mouton). Powerful, long-lived Cabernet with blackcurrant, cedar and pencil shavings."}
- {id: saint-julien, name: Saint-Julien, country: France, kind: subregion, map: france, highlight: [saint-julien], level: 3, grapes: [cabernet-sauvignon, merlot], summary: "Small and consistent: balanced, elegant, classic claret between Pauillac and Margaux. Léoville Las Cases, Ducru-Beaucaillou."}
- {id: margaux, name: Margaux, country: France, kind: subregion, map: france, highlight: [margaux], level: 3, grapes: [cabernet-sauvignon, merlot], summary: "Thin gravel soils give the most perfumed, silky wines of the Médoc. Château Margaux is its First Growth."}
- {id: pessac-leognan, name: Pessac-Léognan, country: France, kind: subregion, map: france, highlight: [pessac-leognan], level: 3, grapes: [cabernet-sauvignon, merlot, sauvignon-blanc, semillon], summary: "The northern Graves, on Bordeaux's doorstep. Smoky, earthy reds and the best oaked dry whites. Home of First Growth Haut-Brion."}
- {id: graves, name: Graves, country: France, kind: subregion, map: france, highlight: [graves], level: 3, grapes: [cabernet-sauvignon, merlot, sauvignon-blanc, semillon], summary: "Named after its gravel soils, south of the city along the Garonne. Red and dry white wines."}
- {id: sauternes, name: Sauternes & Barsac, country: France, kind: subregion, map: france, highlight: [sauternes], level: 2, climate: "Autumn mists from the cold Ciron river meeting the warmer Garonne encourage noble rot; sunny afternoons dry the grapes.", grapes: [semillon, sauvignon-blanc], summary: "The world's most famous noble-rot sweet wines: golden, honeyed, with apricot, marmalade and great ageing potential. Château d'Yquem is the icon.", styles: "Grapes are picked in several passes (tries) through the vineyard, berry by berry."}
- {id: entre-deux-mers, name: Entre-Deux-Mers, country: France, kind: subregion, map: france, highlight: [entre-deux-mers], level: 3, grapes: [sauvignon-blanc, semillon, merlot], summary: "'Between two seas': the land between the Garonne and Dordogne rivers. Fresh dry whites and plenty of Bordeaux AOC red."}
- {id: saint-emilion, name: Saint-Émilion, country: France, kind: subregion, map: france, highlight: [saint-emilion], level: 2, climate: "Limestone plateau and clay slopes; cooler soils suit early-ripening Merlot.", grapes: [merlot, cabernet-franc], summary: "A medieval hilltop town and UNESCO site on the Right Bank. Plush Merlot and Cabernet Franc blends from limestone and clay.", classification: "Saint-Émilion Grand Cru Classé, Premier Grand Cru Classé B and A, revised roughly every ten years."}
- {id: pomerol, name: Pomerol, country: France, kind: subregion, map: france, highlight: [pomerol], level: 2, grapes: [merlot, cabernet-franc], summary: "A tiny plateau of clay and gravel producing velvety, opulent Merlot, including Pétrus and Le Pin. No classification, yet some of the world's priciest reds."}
- {id: fronsac, name: Fronsac, country: France, kind: subregion, map: france, highlight: [fronsac], level: 3, grapes: [merlot, cabernet-franc], summary: "Hilly Right Bank appellation west of Libourne: sturdy, value Merlot."}
- {id: castillon, name: Castillon, country: France, kind: subregion, map: france, highlight: [castillon], level: 3, grapes: [merlot, cabernet-franc], summary: "Castillon Côtes de Bordeaux: limestone slopes east of Saint-Émilion, a source of value Merlot."}
- {id: bourg, name: Côtes de Bourg, country: France, kind: subregion, map: france, highlight: [bourg], level: 3, grapes: [merlot], summary: "Right bank of the Gironde opposite Margaux: robust, good-value Merlot-based reds."}
- {id: blaye, name: Blaye, country: France, kind: subregion, map: france, highlight: [blaye], level: 3, grapes: [merlot, sauvignon-blanc], summary: "Blaye Côtes de Bordeaux: rolling hills north of Bourg, fruity reds and some whites."}
- id: burgundy
  name: Burgundy
  country: France
  kind: region
  map: france
  level: 1
  climate: "Cool continental: cold winters, warm summers, risk of spring frost and hail. Vineyards face east and south-east for morning sun."
  grapes: [pinot-noir, chardonnay, gamay]
  summary: "Terroir taken to its extreme: a narrow strip of slopes where Pinot Noir and Chardonnay change character from one vineyard to the next."
  styles: "Red Burgundy (Pinot Noir), white Burgundy (Chardonnay), from crisp Chablis to rich Meursault. Crémant de Bourgogne sparkling."
  classification: "A pyramid: **Regional** (Bourgogne) → **Village** (e.g. Gevrey-Chambertin) → **Premier Cru** → **Grand Cru** (33 vineyards, about 1–2% of production)."
  facts: ["Vineyards are split between many owners, so a Grand Cru like Clos de Vougeot has more than 80 producers.", "A 'climat' is a precisely named vineyard plot; Burgundy's climats are a UNESCO World Heritage site."]
  sub: [chablis, cote-d-or, cote-chalonnaise, maconnais, beaujolais]
- {id: chablis, name: Chablis, country: France, kind: subregion, map: france, highlight: [chablis], level: 1, climate: "The northernmost part of Burgundy: cool, with frost risk. Kimmeridgian limestone full of fossil oyster shells.", grapes: [chardonnay], summary: "Steely, unoaked or lightly oaked Chardonnay: green apple, lemon and wet stones with high acidity. Petit Chablis, Chablis, Premier Cru and Grand Cru."}
- {id: cote-d-or, name: "Côte d'Or", country: France, kind: subregion, map: france, highlight: [cote-de-nuits, cote-de-beaune], level: 2, sub: [cote-de-nuits, cote-de-beaune], grapes: [pinot-noir, chardonnay], summary: "The golden slope of Burgundy: a 50 km ridge south of Dijon, split into the Côte de Nuits (great reds) and the Côte de Beaune (great whites and fine reds). Almost every Burgundy Grand Cru lives here.", facts: ["The name is often said to come from the golden autumn color of the vines, though it is short for Côte d'Orient, meaning east-facing slope."]}
- {id: cote-de-nuits, name: Côte de Nuits, country: France, kind: subregion, map: france, highlight: [cote-de-nuits], level: 2, grapes: [pinot-noir], summary: "The northern half of the Côte d'Or and the home of great red Burgundy: Gevrey-Chambertin, Chambolle-Musigny, Vosne-Romanée (Romanée-Conti), Nuits-Saint-Georges.", sub: [marsannay, fixin, gevrey-chambertin, morey-saint-denis, chambolle-musigny, vougeot, vosne-romanee, nuits-saint-georges]}
- {id: cote-de-beaune, name: Côte de Beaune, country: France, kind: subregion, map: france, highlight: [cote-de-beaune], level: 2, grapes: [chardonnay, pinot-noir], summary: "The southern half of the Côte d'Or: the world's greatest Chardonnay in Meursault, Puligny- and Chassagne-Montrachet, plus fine reds from Pommard, Volnay and Corton.", sub: [ladoix, aloxe-corton, pernand-vergelesses, savigny, chorey, beaune, pommard, volnay, monthelie, auxey-duresses, saint-romain, meursault, puligny-montrachet, chassagne-montrachet, saint-aubin, santenay, maranges]}
- {id: cote-chalonnaise, name: Côte Chalonnaise, country: France, kind: subregion, map: france, highlight: [cote-chalonnaise], level: 3, grapes: [pinot-noir, chardonnay], summary: "Value Burgundy from villages such as Mercurey, Givry, Rully and Montagny; also Bouzeron (Aligoté).", sub: [bouzeron, rully, mercurey, givry, montagny]}
- {id: maconnais, name: Mâconnais, country: France, kind: subregion, map: france, highlight: [maconnais], level: 2, climate: "Warmer and sunnier than the Côte d'Or.", grapes: [chardonnay], summary: "Ripe, rounded, mostly unoaked Chardonnay: Mâcon-Villages and the richer Pouilly-Fuissé and Saint-Véran."}
- id: beaujolais
  name: Beaujolais
  country: France
  kind: region
  map: france
  highlight: [beaujolais]
  level: 2
  climate: "Semi-continental, warmer than Burgundy; granite hills in the north, clay and limestone in the south."
  grapes: [gamay]

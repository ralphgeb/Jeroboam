- {id: batroun, name: Batroun, country: Lebanon, kind: region, map: lebanon, highlight: [batroun], level: 3, grapes: [syrah, cabernet-sauvignon], summary: "Coastal hills in the north with a cluster of small family wineries; sea breezes and limestone soils."}

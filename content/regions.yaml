- {id: echezeaux, name: "Échezeaux", country: France, kind: subregion, map: france, highlight: [echezeaux], level: 3, grapes: [pinot-noir], summary: "A large Grand Cru of many different climats next to Vosne-Romanée: spicy, savory, floral reds."}
- {id: grands-echezeaux, name: "Grands-Échezeaux", country: France, kind: subregion, map: france, highlight: [grands-echezeaux], level: 3, grapes: [pinot-noir], summary: "The slightly more refined neighbor of Échezeaux, higher on the slope."}
- {id: la-grande-rue, name: "La Grande Rue", country: France, kind: subregion, map: france, highlight: [la-grande-rue], level: 3, grapes: [pinot-noir], summary: "A narrow strip between La Tâche and La Romanée, a monopole of Domaine Lamarche, promoted to Grand Cru in 1992."}
- {id: la-romanee, name: "La Romanée", country: France, kind: subregion, map: france, highlight: [la-romanee], level: 3, grapes: [pinot-noir], summary: "The smallest appellation in France (about 0.85 ha), a monopole of Domaine du Comte Liger-Belair."}
- {id: la-tache, name: "La Tâche", country: France, kind: subregion, map: france, highlight: [la-tache], level: 3, grapes: [pinot-noir], summary: "A monopole of Domaine de la Romanée-Conti: powerful, exotic, spicy and incredibly long-lived."}
- {id: richebourg, name: "Richebourg", country: France, kind: subregion, map: france, highlight: [richebourg], level: 3, grapes: [pinot-noir], summary: "Rich, opulent, spicy Pinot Noir, just above Romanée-Conti. Owned by several famous estates."}
- {id: romanee-conti, name: "Romanée-Conti", country: France, kind: subregion, map: france, highlight: [romanee-conti], level: 3, grapes: [pinot-noir], summary: "The most famous and most expensive vineyard in the world: 1.8 ha, a monopole of Domaine de la Romanée-Conti."}
- {id: romanee-saint-vivant, name: "Romanée-Saint-Vivant", country: France, kind: subregion, map: france, highlight: [romanee-saint-vivant], level: 3, grapes: [pinot-noir], summary: "The most delicate Grand Cru of Vosne-Romanée: silky, perfumed and elegant."}
- {id: corton, name: "Corton", country: France, kind: subregion, map: france, highlight: [corton], level: 3, grapes: [pinot-noir], summary: "The only red Grand Cru of the Côte de Beaune: a big hill shared by Aloxe-Corton, Ladoix and Pernand-Vergelesses. Structured, earthy and long-lived; some white is made too."}

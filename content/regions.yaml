- {id: chevalier-montrachet, name: "Chevalier-Montrachet", country: France, kind: subregion, map: france, highlight: [chevalier-montrachet], level: 3, grapes: [chardonnay], summary: "Above Montrachet on a stony slope: lighter, finer, more mineral and very long-lived."}
- {id: batard-montrachet, name: "Bâtard-Montrachet", country: France, kind: subregion, map: france, highlight: [batard-montrachet], level: 3, grapes: [chardonnay], summary: "Just below Montrachet, shared between Puligny and Chassagne: broader, richer and more powerful."}
- {id: bienvenues-batard-montrachet, name: "Bienvenues-Bâtard-Montrachet", country: France, kind: subregion, map: france, highlight: [bienvenues-batard-montrachet], level: 3, grapes: [chardonnay], summary: "A small Grand Cru in Puligny: silky, delicate and perfumed."}
- {id: criots-batard-montrachet, name: "Criots-Bâtard-Montrachet", country: France, kind: subregion, map: france, highlight: [criots-batard-montrachet], level: 3, grapes: [chardonnay], summary: "The smallest white Grand Cru (1.6 ha), in Chassagne: fresh and fine."}

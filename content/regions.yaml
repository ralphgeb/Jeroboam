  summary: "The benchmark for almost every classic style. France's regions gave the world its most imitated grapes, its appellation system and the very idea of terroir."
  classification: "**AOC/AOP** (Appellation d'Origine Contrôlée/Protégée) rules control where grapes grow, which varieties are allowed, yields and winemaking. **IGP** (Vin de Pays) gives more freedom; **Vin de France** is the most basic category."
  facts: ["Labels usually name the place, not the grape: Sancerre is Sauvignon Blanc, red Burgundy is Pinot Noir.", "Champagne, Bordeaux and Burgundy are among the most valuable wine regions on earth."]

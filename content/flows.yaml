- id: fermentation
  title: Alcoholic fermentation
  steps:
    - {icon: circle.grid.3x3.fill, title: Sugar, text: "Ripe grapes are full of sugar (glucose and fructose)."}
    - {icon: allergens, title: Yeast, text: "Yeast, natural or added, feeds on the sugar."}
    - {icon: drop.fill, title: Alcohol, text: "Sugar becomes **alcohol** and **carbon dioxide**, plus heat and flavor compounds."}
    - {icon: bubbles.and.sparkles, title: CO₂, text: "Usually escapes. Trap it and you get bubbles."}
- id: white-making
  title: White winemaking
  steps:
    - {icon: basket, title: Harvest, text: "Grapes picked at the right balance of sugar and acid, often in the cool of morning."}
    - {icon: arrow.down.to.line, title: Crush & press, text: "Juice is separated from skins **before** fermentation, so the wine stays pale."}
    - {icon: thermometer.low, title: Cool fermentation, text: "Usually 12–22 °C in stainless steel to keep fresh fruit aromas."}
    - {icon: cylinder.split.1x2, title: Optional maturation, text: "On lees, in oak, or with malolactic conversion for richer styles."}
    - {icon: line.3.horizontal.decrease, title: Clarify & bottle, text: "Fined, filtered, stabilized and bottled."}
- id: red-making
  title: Red winemaking
  steps:
    - {icon: basket, title: Harvest, text: "Black grapes picked when skins and seeds are ripe."}
    - {icon: arrow.down.to.line, title: Crush, text: "Grapes are lightly crushed; juice stays **with the skins**."}
    - {icon: thermometer.medium, title: Warm fermentation, text: "20–32 °C extracts color and tannin. The cap of skins is punched down or pumped over."}
    - {icon: hourglass, title: Maceration, text: "Skins may stay in after fermentation to extract more."}
    - {icon: arrow.down.to.line.compact, title: Press, text: "The new wine is drained and the skins pressed."}
    - {icon: cylinder.split.1x2, title: Maturation, text: "Malolactic conversion, then months or years in tank or oak before bottling."}
- id: rose-making
  title: Rosé winemaking
  steps:
    - {icon: basket, title: Black grapes, text: "Rosé is made from black grapes."}
    - {icon: clock, title: Short skin contact, text: "A few hours to a couple of days, just enough for a pink color."}
    - {icon: arrow.down.to.line.compact, title: Run off or press, text: "Juice is separated from the skins, or grapes are pressed directly."}
    - {icon: thermometer.low, title: Ferment like a white, text: "Cool temperatures keep fresh red-fruit aromas."}
- id: traditional-method
  title: Traditional method
  steps:
    - {icon: drop, title: Base wine, text: "A high-acid, still, dry wine, often a blend."}
    - {icon: plus.circle, title: Liqueur de tirage, text: "Wine, sugar and yeast are added and the bottle is sealed with a crown cap."}
    - {icon: bubbles.and.sparkles, title: Second fermentation, text: "In the bottle. The CO₂ is trapped and dissolves: the wine becomes sparkling."}
    - {icon: hourglass, title: Ageing on lees, text: "Months to years in contact with dead yeast: biscuit, bread and brioche aromas (autolysis)."}
    - {icon: arrow.triangle.2.circlepath, title: Riddling, text: "Bottles are turned and tilted until the yeast collects in the neck."}
    - {icon: snowflake, title: Disgorgement, text: "The neck is frozen and the plug of yeast shoots out."}
    - {icon: drop.halffull, title: Dosage, text: "A little wine and sugar sets the sweetness, from Brut Nature to Doux."}
- id: tank-method
  title: Tank method
  steps:
    - {icon: drop, title: Base wine, text: "Often from aromatic grapes such as Glera."}
    - {icon: cylinder, title: Second fermentation in tank, text: "In a large sealed pressure tank, not in bottle."}
    - {icon: line.3.horizontal.decrease, title: Filter & bottle, text: "Filtered and bottled under pressure, ready to drink."}
    - {icon: leaf, title: Result, text: "Fresh, fruity and floral, with little or no yeasty character. Prosecco is the best-known example."}
- id: carbonic
  title: Carbonic maceration
  steps:
    - {icon: square.stack.3d.up, title: Whole bunches, text: "Uncrushed bunches go into a vessel filled with carbon dioxide."}
    - {icon: bolt.horizontal, title: Fermentation inside the berry, text: "Without oxygen, an enzyme starts converting sugar to alcohol inside each grape."}
    - {icon: arrow.down.to.line.compact, title: Press, text: "Berries burst or are pressed; fermentation finishes as normal."}
    - {icon: heart, title: Result, text: "Deep color, soft tannins, and aromas of banana, kirsch and bubblegum: classic Beaujolais Nouveau."}
- id: sweet-wines
  title: Ways to make sweet wine
  steps:
    - {icon: hand.raised, title: Stop the fermentation, text: "Chill, filter or add alcohol (fortification) while sugar remains."}
    - {icon: sun.max, title: Late harvest, text: "Leave grapes on the vine to ripen and shrivel: Spätlese, Vendanges Tardives."}
    - {icon: allergens, title: Noble rot, text: "*Botrytis cinerea* pierces the skins and concentrates sugar and acid: Sauternes, Tokaji, Beerenauslese."}
    - {icon: snowflake, title: Frozen grapes, text: "Grapes freeze on the vine and are pressed frozen, leaving concentrated juice: Icewine, Eiswein."}
    - {icon: sun.haze, title: Dried grapes, text: "Grapes are dried after picking (passito): Recioto, Vin Santo, Pedro Ximénez."}
    - {icon: plus.circle, title: Sweet reserve, text: "Unfermented grape juice blended back into dry wine."}
- id: port
  title: How Port is made
  steps:
    - {icon: basket, title: Douro grapes, text: "Touriga Nacional, Touriga Franca and other native black grapes."}
    - {icon: figure.walk, title: Intense extraction, text: "Traditionally foot-trodden in stone lagares; now often robotic treaders."}
    - {icon: drop.fill, title: Fortify early, text: "Halfway through fermentation, grape spirit (77% abv) is added. Yeast dies and sugar remains."}
    - {icon: cylinder.split.1x2, title: Mature, text: "**Ruby** styles in large vessels to keep fruit; **tawny** styles in small casks for oxidative, nutty character."}
- id: sherry
  title: How Sherry is made
  steps:
    - {icon: basket, title: Palomino base wine, text: "A neutral, dry white from the chalky albariza soils around Jerez."}
    - {icon: drop.fill, title: Fortification, text: "To 15–15.5% for biological ageing (fino) or 17% for oxidative ageing (oloroso)."}
    - {icon: cloud, title: Flor or oxygen, text: "**Flor**, a layer of yeast, protects Fino and Manzanilla from oxygen. Without flor, Oloroso oxidizes and darkens."}
    - {icon: square.stack.3d.down.right, title: Solera, text: "Fractional blending across rows of barrels keeps the style consistent year after year."}
- id: tasting
  title: The four steps of tasting
  steps:
    - {icon: eye, title: Look, text: "Clarity, intensity and color, against a white background."}
    - {icon: nose, title: Smell, text: "Swirl, then sniff. Intensity first, then the aroma families."}
    - {icon: mouth, title: Taste, text: "Sweetness, acidity, tannin, alcohol, body, flavors and the length of the finish."}
    - {icon: checkmark.seal, title: Conclude, text: "Quality and readiness: is it balanced, intense, complex and long?"}
- id: oak
  title: What oak does
  steps:
    - {icon: cylinder.split.1x2, title: New barrels, text: "Add flavor: vanilla, toast, clove, coconut, smoke."}
    - {icon: wind, title: Slow oxygen, text: "Tiny amounts of oxygen through the staves soften tannin and deepen color."}
    - {icon: arrow.triangle.2.circlepath, title: Old barrels, text: "Add little flavor but still allow gentle oxygen exposure."}
    - {icon: square.grid.3x3, title: Cheaper options, text: "Oak chips or staves in a tank add oak flavors quickly, without the oxygen effect."}
- id: body
  title: Body is weight
  steps:
    - {icon: drop, title: Light, text: "Like skimmed milk: Muscadet, Prosecco, Beaujolais, Mosel Riesling."}
    - {icon: drop.halffull, title: Medium, text: "Like whole milk: Chianti, Merlot, Sancerre, unoaked Chardonnay."}
    - {icon: drop.fill, title: Full, text: "Like cream: Barossa Shiraz, Napa Cabernet, oaked Chardonnay, Amarone."}
    - {icon: plus.circle, title: What adds weight, text: "Alcohol, sugar and extract (the solids from ripe skins)."}
- id: blic
  title: Judging quality with BLIC
  steps:
    - {icon: scalemass, title: Balance, text: "Fruit, acidity, tannin, alcohol and sweetness in harmony: nothing sticks out."}
    - {icon: timer, title: Length, text: "How long the flavor lingers after you swallow: ten seconds or more is long."}
    - {icon: speaker.wave.3, title: Intensity, text: "How pronounced the aromas and flavors are."}
    - {icon: square.stack.3d.up, title: Complexity, text: "Many layers: fruit, then flowers, spice, earth, toast, that change in the glass."}
- id: tasting-note
  title: Writing a tasting note
  steps:
    - {icon: eye, title: Look, text: "Pale lemon."}
    - {icon: nose, title: Nose, text: "Pronounced aromas of grapefruit, gooseberry and cut grass."}
    - {icon: mouth, title: Palate, text: "Dry, high acidity, light body, medium finish."}
    - {icon: checkmark.seal, title: Conclusion, text: "Very good: balanced and intense. Drink now. (A Sauvignon Blanc.)"}
- id: food-wine
  title: What food does to wine
  steps:
    - {icon: arrow.down.circle, title: Tougher on wine, text: "Sweetness and umami (mushrooms, aged cheese, soy) make wine taste drier, more bitter and more acidic."}
    - {icon: flame, title: Chili heat, text: "Hotter with alcohol and tannin: pick off-dry, low-alcohol whites."}
    - {icon: arrow.up.circle, title: Kinder to wine, text: "Salt and acidity make wine taste softer, fruitier and less acidic."}
    - {icon: scalemass, title: Then match the weight, text: "Light dishes with light wines, rich dishes with rich wines."}
- id: faults
  title: Common wine faults
  steps:
    - {icon: exclamationmark.triangle, title: Cork taint (TCA), text: "Musty, wet cardboard; the fruit seems muted."}
    - {icon: circle.lefthalf.filled, title: Oxidation, text: "Brownish color, bruised apple, flat taste."}
    - {icon: thermometer.sun, title: Heat damage, text: "Cooked, jammy fruit; the cork may have pushed up."}
    - {icon: aqi.medium, title: Reduction, text: "Struck match or rotten egg; often fades with air."}
    - {icon: drop.triangle, title: Volatile acidity, text: "Vinegar or nail-polish remover when it is too high."}
- id: open-sparkling
  title: Opening sparkling wine safely
  steps:
    - {icon: snowflake, title: Chill well, text: "Cold wine holds its bubbles: 6–10 °C."}
    - {icon: hand.raised, title: Thumb on the cork, text: "Remove the foil and loosen the cage, keeping a thumb on top. Point it away from people."}
    - {icon: arrow.triangle.2.circlepath, title: Turn the bottle, text: "Hold the cork, twist the bottle, and ease it out with a sigh, not a pop."}
    - {icon: wineglass, title: Pour in two goes, text: "A little first, let the foam settle, then top up."}
- id: decanting
  title: Decanting an old red
  steps:
    - {icon: arrow.up, title: Stand it up, text: "A day before, so the sediment falls to the bottom."}
    - {icon: lightbulb, title: Light behind the neck, text: "A candle or phone light shows the sediment coming."}
    - {icon: arrow.down.right, title: Pour slowly, text: "In one steady movement, and stop when the sediment reaches the neck."}
    - {icon: wind, title: Young wines too, text: "A young, tannic red opens up after an hour or two in a decanter."}
- id: training
  title: How vines are trained
  steps:
    - {icon: tree, title: Bush vine (gobelet), text: "Free-standing, low to the ground: hot, dry places such as old Grenache."}
    - {icon: line.3.horizontal, title: Guyot, text: "One or two canes along a wire: Bordeaux, Burgundy, much of Europe."}
    - {icon: square.split.1x2, title: VSP, text: "Shoots trained upward between wires: a tidy wall of leaves, easy to work."}
    - {icon: square.grid.3x3.topleft.filled, title: Pergola, text: "A high roof of leaves: shade in hot places, room beneath in the Veneto and Alto Adige."}
- id: en-primeur
  title: Buying Bordeaux en primeur
  steps:
    - {icon: calendar, title: April after the harvest, text: "Merchants and critics taste the new wine from barrel."}
    - {icon: tag, title: Release, text: "Châteaux release part of the wine, tranche by tranche, at a set price."}
    - {icon: creditcard, title: Pay now, text: "Buyers pay while the wine is still ageing in barrel."}
    - {icon: shippingbox, title: Delivery, text: "About two years later, the bottles arrive."}
- id: deduction
  title: Tasting blind, clue by clue
  steps:
    - {icon: eye, title: Color, text: "Pale reds and light whites point to cool climates and thin-skinned grapes; deep color to warmth and thick skins."}
    - {icon: nose, title: Aromas, text: "Fruit ripeness (green to jammy), plus oak (vanilla, toast) and age (leather, mushroom, honey)."}
    - {icon: mouth, title: Structure, text: "High acid: cool place. High alcohol and soft acid: warm place. Firm tannin: Cabernet, Nebbiolo."}
    - {icon: checkmark.seal, title: Conclude, text: "Put the clues together: grape, climate, then region and age."}
- id: bordeaux-blend
  title: The five Bordeaux grapes
  steps:
    - {icon: shield, title: Cabernet Sauvignon, text: "Structure, blackcurrant and long life: the Left Bank on gravel."}
    - {icon: circle.fill, title: Merlot, text: "Plush plum and soft tannin; ripens early: the Right Bank on clay."}
    - {icon: leaf, title: Cabernet Franc, text: "Perfume, freshness and a leafy lift: key in Saint-Émilion."}
    - {icon: paintpalette, title: Petit Verdot, text: "A dash of color, spice and violet."}
    - {icon: drop, title: Malbec, text: "A small part today: now Argentina's star."}
- id: port-styles
  title: Port styles
  steps:
    - {icon: wineglass, title: Ruby, text: "Young and deep red with black fruit, aged in large vats."}
    - {icon: calendar, title: Late Bottled Vintage, text: "One year's wine, 4–6 years in wood, ready to drink."}
    - {icon: star, title: Vintage, text: "Only the best years; bottled young, it ages for decades in bottle."}
    - {icon: hourglass, title: Tawny, text: "Aged in small casks: amber, nutty, caramel. 10, 20, 30 and 40 years old."}
- id: lees-ageing
  title: What time on the lees gives Champagne
  steps:
    - {icon: circle.dotted, title: Dead yeast, text: "After the second fermentation the yeast dies and settles in the bottle."}
    - {icon: arrow.down.forward.and.arrow.up.backward, title: Autolysis, text: "Over months and years the yeast cells break down."}
    - {icon: birthday.cake, title: Flavors, text: "Bread, brioche, biscuit and toast."}
    - {icon: bubbles.and.sparkles, title: Texture, text: "A finer, creamier mousse. At least 15 months for non-vintage, 3 years for vintage."}
- id: families
  title: Three families of wine
  steps:
    - {icon: wineglass, title: Still, text: "No bubbles, about 8–15% alcohol: most of the wine in the world."}
    - {icon: bubbles.and.sparkles, title: Sparkling, text: "Carbon dioxide trapped in the wine: Champagne, Prosecco, Cava."}
    - {icon: flame, title: Fortified, text: "Grape spirit added, 15–22% alcohol: Port, Sherry, Madeira."}

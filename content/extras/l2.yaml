l2-vineyard:
  - learn: The growing season
    visual: "diagram:vine-cycle"
    body: |
      In the Northern Hemisphere: **budburst** in spring (March–April), **flowering** in early summer, **véraison** (grapes soften and change color) in midsummer, and **harvest** from September to October.

      Spring frost at budburst and rain at flowering are among the biggest risks to a crop.
  - learn: Sun, slope and water
    body: |
      South-facing slopes (north-facing in the Southern Hemisphere) catch more sun. Rivers and lakes reflect light and moderate temperature extremes.

      Poor, well-drained soils make vines struggle a little, giving smaller crops with more concentrated flavor.
  - choice: "What is 'véraison'?"
    options: ["When grapes soften and change color", "The first leaves appearing", "The grape harvest", "Pruning in winter"]
    a: "When grapes soften and change color"
    explain: "Véraison is when black grapes turn from green to purple and sugar starts to build, about 40 to 50 days before harvest. Growers often thin crops then to concentrate flavor in the remaining bunches."
  - tf: "Spring frost is a major risk around budburst."
    truth: true
    explain: "Young shoots are easily killed by frost; growers use wind machines, sprinklers or candles to protect them."
  - match: "Match the stage to its season (Northern Hemisphere)"
    pairs: [[Budburst, Spring], [Flowering, Early summer], [Véraison, Midsummer], [Harvest, Autumn]]
    explain: "The vine's yearly cycle drives a region's calendar: budburst in spring, flowering in late spring, véraison in late summer and harvest in autumn. Spring frost and autumn rain are the biggest risks."
  - choice: "Why are poor, well-drained soils often prized for vines?"
    options: ["Lower yields with more concentrated grapes", "They make vines grow faster", "They prevent all diseases", "They add sugar to the grapes"]
    a: "Lower yields with more concentrated grapes"
    explain: "Vines that struggle a little put their energy into fewer, more flavorful grapes. Fertile, wet soil makes leafy vines and diluted fruit, while poor, well-drained soils such as gravel, slate and chalk produce concentrated wine."
  - blank: "In the Northern Hemisphere, the best vineyard slopes usually face ___."
    answers: [south]
    options: [north, east only, downward, the sea always]
    explain: "South-facing slopes get the most sun in the Northern Hemisphere, helping grapes ripen in cool climates. In the Southern Hemisphere the best slopes face north."
l2-winery:
  - learn: Making red wine
    visual: "flow:red-making"
    body: |
      Black grapes are crushed and fermented **with their skins**. The skins give color, tannin and flavor. Winemakers punch down or pump over the cap of skins to extract them.

      After fermentation the wine is pressed off the skins, then usually aged before bottling.
  - learn: Oak or stainless steel?
    body: |
      **Stainless steel** keeps fruit pure and fresh. **Oak barrels** let in a little oxygen, soften tannins and, when new, add vanilla, toast and spice.

      Small new barrels give the most flavor; large old casks give texture with little oak taste.
  - choice: "Where does red wine get its color?"
    options: ["Fermenting with the skins", "Adding color after fermentation", "Ageing in oak", "Red grape juice"]
    a: "Fermenting with the skins"
    explain: "The juice of almost all black grapes is clear; color comes from contact with the skins during fermentation. The longer the contact, the darker and more tannic the wine."
  - tf: "Small new oak barrels add more oak flavor than large old ones."
    truth: true
    explain: "Small new barrels add more oak flavor than large old ones, because there is more wood surface per liter and fresh wood has more flavor compounds. After 4–5 years a barrel gives mostly gentle oxygen, not flavor."
  - choice: "What does 'punching down' do?"
    options: ["Pushes the skins back into the fermenting wine", "Removes the cork", "Adds sugar to the juice", "Filters the wine"]
    a: "Pushes the skins back into the fermenting wine"
    explain: "The skins float up as a cap; punching them down extracts color and tannin and keeps the cap wet. A gentle punch-down is used for delicate grapes like Pinot Noir, a firmer extraction for Cabernet."
  - match: "Match the choice to its effect"
    pairs: [[Stainless steel, Pure fresh fruit], [New oak, Vanilla and toast], [Lees ageing, Bready texture], [Malolactic conversion, Softer acidity]]
    explain: "Each winemaking decision leaves a mark on the final wine: stainless steel keeps freshness, oak adds spice and vanilla, lees add texture and malolactic fermentation adds creaminess."
  - blank: "After fermentation, red wine is separated from the skins by ___."
    answers: [pressing]
    options: [freezing, boiling, chaptalization, riddling]
    explain: "After fermentation, red wine is separated from the skins by pressing. The free-run wine drains first, and the darker, more tannic press wine can be blended back in for structure."
l2-more-whites:
  - learn: Grapes of the Atlantic
    visual: "map:spain:rias-baixas"
    body: |
      Cool, damp Atlantic coasts favor fresh, salty whites: **Albariño** in Rías Baixas (Spain), **Alvarinho** in Vinho Verde (Portugal) and **Melon de Bourgogne** in Muscadet (France).

      All three are classic partners for seafood.
  - learn: Rhône and Mediterranean whites
    body: |
      **Viognier**, **Marsanne** and **Roussanne** make rich, textured whites in the Rhône. Around the Mediterranean, **Vermentino** gives herbal, saline whites, and **Assyrtiko** from Santorini combines ripeness with striking acidity.
  - choice: "Albariño and Alvarinho are…"
    visual: "grape:albarino"
    options: ["The same grape in Spain and Portugal", "Two unrelated grapes", "A grape and a region", "Sweet wine styles"]
    a: "The same grape in Spain and Portugal"
    explain: "It is called Albariño in Rías Baixas and Alvarinho in Vinho Verde: the same grape on two sides of the Minho river. The Spanish side is usually a little richer and more textured."
  - match: "Match the grape to its homeland"
    pairs: [[Assyrtiko, Santorini], [Grüner Veltliner, Austria], [Melon de Bourgogne, Muscadet], [Torrontés, Argentina]]
    explain: "Each of these whites is closely tied to one place: Albariño to Galicia, Grüner Veltliner to Austria, Assyrtiko to Santorini and Melon de Bourgogne to Muscadet."
  - tf: "Grüner Veltliner often shows white pepper notes."
    visual: "grape:gruner-veltliner"
    truth: true
    explain: "White pepper, green apple and lentil notes are typical of Austrian Grüner Veltliner. The pepper comes from rotundone, the same compound as in black pepper, so Grüner is the white wine that smells like a pepper mill."
  - choice: "Which white grape keeps high acidity even on hot, volcanic Santorini?"
    visual: "map:greece:santorini"
    options: [Assyrtiko, Viognier, Chardonnay, Muscat]
    a: Assyrtiko
    explain: "Assyrtiko keeps its fresh acidity in a hot climate, even on volcanic Santorini. The vines are trained into low baskets (kouloura) to protect them from wind, and the ash soil spared them from phylloxera."
  - blank: "Muscadet is made from the ___ grape."
    visual: "map:france:muscadet"
    answers: ["Melon de Bourgogne"]
    options: [Chenin Blanc, Sauvignon Blanc, Chardonnay]
    explain: "Muscadet, near the mouth of the Loire, is made from Melon de Bourgogne. Wines labeled sur lie are aged on their lees for a creamier texture, and it is the classic partner of oysters."
l2-more-reds:
  - learn: Italy's great reds
    body: |
      **Sangiovese** is the grape of Chianti and Brunello di Montalcino: red cherry, herbs and high acidity. **Nebbiolo** makes Barolo and Barbaresco: pale color, rose and tar aromas, and big tannin.

      Both love food thanks to their acidity.
  - learn: Iberia's great reds
    body: |
      **Tempranillo** leads Rioja and Ribera del Duero, often aged in oak for vanilla and leather notes. **Touriga Nacional** is Portugal's star for Port and dry Douro reds, with violet and black fruit.
  - choice: "Which grape makes Barolo?"
    visual: "map:italy:barolo"
    options: [Nebbiolo, Sangiovese, Barbera, Dolcetto]
    a: Nebbiolo
    explain: "Barolo and Barbaresco are 100% Nebbiolo, from Piedmont. Barolo is the more powerful, Barbaresco the more elegant, and both age for decades."
  - tf: "Nebbiolo wines are usually deep, inky purple."
    visual: "grape:nebbiolo"
    truth: false
    explain: "Nebbiolo is surprisingly pale, often garnet, despite huge tannin and acidity. It shows why you can not judge a red's structure by its color alone."
  - match: "Match the wine to its main grape"
    pairs: [[Chianti, Sangiovese], [Rioja, Tempranillo], [Barbaresco, Nebbiolo], [Beaujolais, Gamay]]
    explain: "European wines are named after the place, so knowing the grape behind each is key: Chianti is Sangiovese, Barolo is Nebbiolo, Rioja is Tempranillo and Chinon is Cabernet Franc."
  - choice: "'Tar and roses' is a classic description of…"
    options: [Nebbiolo, Merlot, Grenache, Zinfandel]
    a: Nebbiolo
    explain: "Rose petal and tar (or liquorice) are Nebbiolo's signature aromas, found in Barolo and Barbaresco. Brick-orange edges and a gripping tannic finish complete the picture."
  - blank: "Brunello di Montalcino is made from ___."
    visual: "map:italy:montalcino"
    answers: [Sangiovese]
    options: [Nebbiolo, Merlot, Montepulciano]
    explain: "Brunello is the local name for the Sangiovese clone grown around Montalcino in Tuscany. The wine must age five years before release, two of them in oak."
l2-sparkling:
  - learn: Bubble methods
    visual: "flow:traditional-method"
    body: |
      **Traditional method**: second fermentation in the bottle, ageing on lees for toasty, fine-bubbled wines (Champagne, Cava, Crémant).

      **Tank method**: second fermentation in a sealed tank for fresh, fruity wines (Prosecco).
  - learn: How sweet is Brut?
    visual: "ladder:sparkling-sweetness"
    body: |
      Sparkling sweetness runs from **Brut Nature** (no added sugar) through **Extra Brut** and **Brut** (the most common, dry) to **Extra Dry**, **Dry**, **Demi-Sec** and **Doux** (sweet).

      Confusingly, Extra Dry is slightly sweeter than Brut.
  - choice: "Which wine is usually made by the tank method?"
    options: [Prosecco, Champagne, Cava, Crémant de Loire]
    a: Prosecco
    explain: "Prosecco's second fermentation happens in pressurized tanks, which keeps fresh pear and apple fruit. This gives a light, fruity style, unlike the toasty notes of bottle-fermented Champagne."
  - tf: "Extra Dry sparkling wine is drier than Brut."
    truth: false
    explain: "A historical quirk: Extra Dry has a little more sugar than Brut, because in the 19th century sparkling wines were much sweeter and Brut was created as a new, drier style."
  - match: "Match the sparkling wine to its country"
    pairs: [[Champagne, France], [Cava, Spain], [Prosecco, Italy], [Sekt, Germany]]
    explain: "Most wine countries have a sparkling tradition: Champagne in France, Cava in Spain, Prosecco and Franciacorta in Italy, Sekt in Germany and Cap Classique in South Africa."
  - choice: "Where does Champagne's toasty, bready character come from?"
    visual: "map:france:champagne"
    options: ["Ageing on the lees", "New oak barrels", "Adding toast to the tank", "Very ripe grapes"]
    a: "Ageing on the lees"
    explain: "Dead yeast cells break down over months or years of aging, a process called autolysis, giving brioche and biscuit notes. The longer on the lees, the toastier and creamier the wine."
  - blank: "Removing the yeast plug from the neck of the bottle is called ___."
    answers: [disgorgement]
    options: [riddling, dosage, tirage, pressing]
    explain: "Disgorgement: the neck is frozen, the cap removed, and the pressure pushes out the plug of dead yeast. The bottle is then topped up with dosage and corked."
l2-sweet-fortified:
  - learn: Three roads to sweetness
    body: |
      1. **Noble rot** (botrytis) shrivels grapes and concentrates sugar: Sauternes, Tokaji.
      2. **Freezing**: grapes picked frozen give Icewine/Eiswein.
      3. **Drying**: grapes dried after picking make Recioto and Vin Santo.

      Stopping fermentation early, as in Port, is a fourth route.
  - learn: Sherry styles
    body: |
      **Fino** and **Manzanilla** age under a layer of yeast called **flor**: pale, dry, salty, almond. **Oloroso** ages without flor, in contact with air: dark, nutty, dry. **Pedro Ximénez** is a dark, raisin-sweet dessert sherry.
  - choice: "What is 'flor' in sherry-making?"
    options: ["A layer of yeast on the wine", "A type of grape", "A sweet syrup", "The barrel cellar"]
    a: "A layer of yeast on the wine"
    explain: "Flor is a layer of yeast that grows on the surface of Fino and Manzanilla. It protects the wine from oxygen and gives a tangy, bready, almond character, which is why these wines are pale and dry."
  - match: "Match the sweet wine to how it's made"
    pairs: [[Sauternes, Noble rot], [Icewine, Frozen grapes], [Vin Santo, Dried grapes], [Port, Spirit added]]
    explain: "Different routes to sugar create very different sweet wines: noble rot (Sauternes), dried grapes (Vin Santo), frozen grapes (Icewine) and fortification (Port)."
  - tf: "Oloroso sherry ages under flor."
    truth: false
    explain: "Oloroso is fortified to about 17–18% alcohol, a strength where flor can not survive, so it ages oxidatively and darkens, with walnut and dried fruit flavors. Fino stays under flor and stays pale."
  - choice: "Which wine is fortified during fermentation, keeping natural sweetness?"
    options: [Port, Fino Sherry, Sauternes, Champagne]
    a: Port
    explain: "Port is fortified during fermentation: adding grape spirit stops the yeast and leaves natural grape sugar in the wine. Dry Sherry is fortified after fermentation instead, so it keeps no sugar."
  - blank: "Noble rot is caused by a fungus called ___."
    answers: [Botrytis]
    options: [Flor, Phylloxera, Oidium, Brettanomyces]
    explain: "Botrytis cinerea, the noble rot, shrivels grapes in the right conditions (damp mornings, sunny afternoons) and concentrates sugar and acid. In wet weather the same fungus becomes grey rot and ruins the crop."
l2-labels:
  - learn: Quality pyramids
    visual: "ladder:italy"
    body: |
      Most EU countries rank wines in a pyramid: **PDO** wines from tightly defined places with strict rules (AOC, DOC, DOCG, DO), **PGI** wines from wider areas with more freedom (IGP, IGT, Vino de la Tierra) and simple **wine** without a place.
  - learn: Ageing terms
    visual: "ladder:rioja-ageing"
    body: |
      Spanish and Italian labels often show ageing: **Crianza**, **Reserva** and **Gran Reserva** in Spain; **Riserva** in Italy. Each means a longer minimum time in barrel and bottle before release.
  - choice: "Which Spanish term means the longest minimum ageing?"
    options: [Gran Reserva, Crianza, Joven, Reserva]
    a: Gran Reserva
    explain: "For reds, Gran Reserva means at least five years of aging, with time in oak. Reserva is shorter and Crianza shorter still, so the term tells you how long the wine rested before release."
  - match: "Match the label term to its country"
    pairs: [[AOC, France], [DOCG, Italy], [DO, Spain], [Prädikatswein, Germany]]
    explain: "Each country has its own words for top-quality, place-based wines: AOC in France, DOCG in Italy, DOCa in Spain and Prädikat in Germany. The idea is the same: a defined place with rules on grapes and methods."
  - tf: "PGI wines have stricter rules than PDO wines."
    truth: false
    explain: "PDO is the stricter, more specific category, with a defined area, grapes and methods. PGI allows wider areas and more grapes, as with Italian IGT wines."
  - choice: "What does 'Riserva' on an Italian label tell you?"
    options: ["Longer ageing before release", "A sweet wine", "A sparkling wine", "Organic grapes"]
    a: "Longer ageing before release"
    explain: "Riserva wines meet a longer minimum aging period set by each DOC or DOCG. For Chianti Classico it is 24 months, and for Barolo Riserva 62 months."
  - blank: "In Germany, a dry Prädikatswein is labeled ___."
    visual: "map:germany"
    answers: [trocken]
    options: [süss, Spätlese, Eiswein]
    explain: "Trocken means dry; Spätlese and Auslese describe ripeness at harvest, not sweetness. A Prädikat wine can be dry, off-dry or sweet at any ripeness level, so look for Trocken."
l2-label-decoder:
  - learn: Château, Domaine, Bodega
    body: |
      The producer's name often starts with a word for estate: **Château** (Bordeaux), **Domaine** (Burgundy and elsewhere in France), **Bodega** (Spain), **Weingut** (Germany, Austria), **Quinta** (Portugal) and **Tenuta** (Italy).
  - learn: Burgundy's ladder
    body: |
      Burgundy labels climb a ladder: **Bourgogne** (regional), **village** (e.g. Gevrey-Chambertin), **Premier Cru** (a named vineyard plus the village) and **Grand Cru** (the vineyard name alone, e.g. Chambertin).
  - choice: "On a Burgundy label, which level shows only the vineyard name?"
    visual: "map:france:burgundy"
    options: [Grand Cru, Premier Cru, Village, Regional]
    a: Grand Cru
    explain: "Grand Crus are so famous they stand alone on the label: Montrachet, Chambertin, Romanée-Conti. A Premier Cru shows the village plus the vineyard, and a village wine only the village."
  - match: "Match the estate word to its country"
    pairs: [[Quinta, Portugal], [Bodega, Spain], [Weingut, Germany], [Tenuta, Italy]]
    explain: "Knowing these words helps you find the producer on any label: château and domaine in France, bodega in Spain, weingut in Germany, and tenuta or azienda in Italy."
  - tf: "'Mis en bouteille au château' means bottled at the estate."
    truth: true
    explain: "Estate bottling shows that the same property grew the grapes and bottled the wine, so control of quality runs from vine to bottle, a mark of fine estates in Bordeaux."
  - choice: "In Germany, which word tells you about ripeness at harvest?"
    visual: "map:germany"
    options: [Spätlese, Weingut, Trocken, Gutsabfüllung]
    a: Spätlese
    explain: "Kabinett, Spätlese and Auslese are Prädikat levels based on grape ripeness at harvest, not the sweetness of the finished wine. Ripeness rises from Kabinett to Spätlese to Auslese, then Beerenauslese and Trockenbeerenauslese."
  - blank: "In Rioja, a wine aged at least two years, one in oak, is labeled ___."
    visual: "map:spain:rioja"
    answers: [Crianza]
    options: [Joven, Gran Reserva, Cosecha]
    explain: "A red Rioja Crianza spends at least two years aging, with at least one in oak. Reserva needs three years with one in oak, and Gran Reserva five with two in oak."

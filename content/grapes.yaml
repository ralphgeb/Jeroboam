  acidity: 5
  tannin: 0
  alcohol: 3
  sweetness: 1
  aromas: [Grapefruit, Gooseberry, Grass, Green bell pepper, Asparagus, Passion fruit, Elderflower, Flint]
  cool: "Gooseberry, grass and flint; lean and mineral: Sancerre, Pouilly-Fumé."
  warm: "Passion fruit, melon and riper citrus: Marlborough, parts of Chile and South Africa."
  regions: [loire, sancerre, pouilly-fume, touraine, bordeaux, graves, pessac-leognan, marlborough, casablanca, elgin, constantia, adelaide-hills, steiermark]
  styles: "Usually unoaked and best young. In Bordeaux it is blended with Sémillon for dry whites (sometimes oaked) and for sweet Sauternes. Oaked California versions are called Fumé Blanc."
  food: [Goat cheese, Asparagus, Oysters, Green salads, Thai dishes]
  ageing: "Drink young, within 1–3 years. Oaked white Bordeaux can age longer."
  glass: lemon-green
  fact: "Sauvignon Blanc is a parent of Cabernet Sauvignon, after a chance crossing with Cabernet Franc in 17th-century Bordeaux."
  level: 1
- id: riesling
  name: Riesling
  berry: white
  pronounce: REES-ling
  origin: Rhine Valley, Germany
  summary: "Thrillingly high acidity and intense aromas of citrus, stone fruit and flowers. Made bone dry to lusciously sweet, and one of the longest-lived whites."
  body: 2
  acidity: 5
  tannin: 0
  alcohol: 2
  sweetness: 2
  aromas: [Lime, Green apple, Peach, Apricot, Blossom, Wet stones, Petrol, Honey]
  cool: "Green apple, lime and blossom; often off-dry with low alcohol: Mosel."
  warm: "Riper peach and citrus, drier and fuller: Alsace, Clare and Eden Valley (lime), Pfalz."
  regions: [germany, mosel, rheingau, pfalz, nahe, alsace, wachau, kamptal, kremstal, clare, eden-valley, great-southern, tasmania, marlborough, columbia-valley]
  styles: "Never oaked for flavor. Dry (Trocken, Grosses Gewächs), off-dry (Kabinett), sweet (Spätlese, Auslese) and noble-rot or ice wines (Beerenauslese, Trockenbeerenauslese, Eiswein)."
  food: [Spicy Asian food, Pork, Duck, Smoked fish, Sauerkraut]
  ageing: "Exceptional. Good examples evolve for decades, developing honey, toast and the famous petrol note."
  glass: lemon-green
  fact: "The petrol aroma in aged Riesling comes from a compound called TDN, which builds up with sun exposure and age."
  level: 1
- id: pinot-grigio

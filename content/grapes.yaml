- id: chardonnay
  name: Chardonnay
  berry: white
  pronounce: shar-doh-NAY
  origin: Burgundy, France
  summary: "The world's most versatile white grape. A blank canvas that shows its place and its winemaker: steely in Chablis, creamy and oaky in California, toasty in Champagne."
  body: 3
  acidity: 3
  tannin: 0
  alcohol: 3
  sweetness: 1
  aromas: [Green apple, Lemon, Peach, Pineapple, Butter, Vanilla, Toast, Flint]
  cool: "Green apple, lemon and wet stones with high acidity: Chablis, Champagne, Tasmania."
  warm: "Peach, pineapple and banana with fuller body; often oaked: California, Australia."
  regions: [burgundy, chablis, cote-de-beaune, maconnais, champagne, cote-des-blancs, napa-valley, carneros, sonoma-coast, russian-river, margaret-river, adelaide-hills, yarra-valley, casablanca, walker-bay, south-africa]
  styles: "From unoaked and crisp (Chablis, Mâcon) to rich, oaked and buttery with malolactic conversion. Also the backbone of Blanc de Blancs Champagne."
  food: [Roast chicken, Lobster, Creamy pasta, Scallops, Comté]
  ageing: "Most are best within 3–5 years. Top white Burgundy can develop for 10–20 years, gaining nutty, honeyed notes."
  glass: lemon
  fact: "Chardonnay is the result of a cross between Pinot Noir and the obscure Gouais Blanc, a grape medieval nobles tried to ban."
  level: 1
- id: sauvignon-blanc
  name: Sauvignon Blanc
  berry: white
  pronounce: SO-vin-yon BLONK
  origin: Loire Valley & Bordeaux, France
  summary: "Zesty, aromatic and instantly recognizable: high acidity with green, herbaceous aromas and citrus or tropical fruit."

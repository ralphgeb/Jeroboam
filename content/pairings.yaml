- {food: Sweetness, icon: birthday.cake, effect: "Sweet food makes wine taste **drier, more acidic, more bitter** and less fruity.", tip: "Pick a wine at least as sweet as the dish: Sauternes with crème brûlée, Moscato d'Asti with fruit tarts."}
- {food: Umami, icon: fork.knife, effect: "Umami (mushrooms, cured meat, aged cheese, soy) makes wine taste **more bitter, more acidic** and less sweet and fruity.", tip: "Choose fruity, low-tannin wines, or add salt or acid to the dish."}
- {food: Acidity, icon: circle.lefthalf.filled, effect: "Acidic food makes wine taste **less acidic**, and fruitier and sweeter.", tip: "Match high-acid dishes with high-acid wines: goat cheese with Sancerre, tomato pasta with Chianti."}
- {food: Salt, icon: sparkles, effect: "Salty food makes wine taste **less bitter and less acidic**, and fuller.", tip: "A friendly partner: oysters with Muscadet or Chablis, salty cheese with Port."}
- {food: Chili heat, icon: flame, effect: "Chili makes wine taste **more bitter, more alcoholic and more acidic**, and increases the burning sensation.", tip: "Choose off-dry, low-alcohol, low-tannin whites: Riesling Kabinett, Gewürztraminer."}
- {food: Fat & protein, icon: fish, effect: "Fat and protein **soften tannin** and coat the palate.", tip: "Steak with Cabernet Sauvignon or Barolo: the meat tames the wine's grip."}
- {food: Bitterness, icon: leaf, effect: "Bitter food (radicchio, dark chocolate, grilled char) adds to the **bitterness** of tannic wines.", tip: "Choose low-tannin wines with ripe fruit."}
- {food: Weight & intensity, icon: scalemass, effect: "Delicate dishes are overwhelmed by powerful wines, and vice versa.", tip: "Match light with light (sole and Pinot Grigio) and rich with rich (lamb tagine and Châteauneuf-du-Pape)."}
- {food: Regional pairing, icon: map, effect: "Food and wine that grew up together usually work together.", tip: "Bistecca with Chianti, choucroute with Alsace Riesling, Sherry with jamón and tapas."}

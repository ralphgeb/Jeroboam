- title: "Deep dive: the Burgundy pyramid"
  icon: triangle
  cards:
    - learn: Four levels
      visual: "photo:burgundy-cote"
      body: |
        Burgundy ranks **land**, not producers:

        1. **Grand Cru** (about 1% of wine): named vineyards only, such as *Chambertin*, *Montrachet*, *Corton*.
        2. **Premier Cru** (about 10%): village + vineyard, *Gevrey-Chambertin 1er Cru Clos Saint-Jacques*.
        3. **Village** (about 37%): *Meursault*, *Vosne-Romanée*.
        4. **Regional** (about half): *Bourgogne*, *Mâcon-Villages*.
    - learn: Climats and clos
      visual: "photo:burgundy-cote"
      body: |
        A named vineyard plot is a **climat**; there are over 1,200, listed by UNESCO since 2015. A **clos** is a vineyard enclosed by a stone wall, often built by medieval monks.

        Because of Napoleonic inheritance laws, one vineyard is usually split between **many owners**: Clos de Vougeot's 50 hectares have around 80.
    - learn: Domaine or négociant
      visual: "photo:winery-cellar-bottles"
      body: |
        A **domaine** grows and bottles its own grapes. A **négociant** (merchant house such as Louis Jadot, Joseph Drouhin, Bouchard) buys grapes or wine and bottles under its name.

        So the same vineyard name can appear on dozens of different labels: the producer matters as much as the plot.
    - learn: How red Burgundy is made
      visual: "photo:grape-must"
      body: |
        Pinot Noir is thin-skinned and delicate. Winemakers often do a **cold soak** before fermentation for color, use gentle **punch-downs**, and may keep some **whole bunches** for perfume.

        It ages 12–18 months in French oak *pièces* (228 L barrels); the share of new oak rises with the quality level.
    - learn: The Burgundy bottle
      visual: "photo:bottle-shapes"
      body: |
        The Burgundy bottle has **sloping shoulders** and a wider body, the shape used worldwide for Pinot Noir and Chardonnay (and in the Rhône for Syrah).
    - choice: "Which is the top level of the Burgundy hierarchy?"
      options: [Grand Cru, Premier Cru, Village, Bourgogne]
      a: Grand Cru
      explain: "Grand Cru is the top level of the Burgundy hierarchy: the wines carry only the vineyard name, like Romanée-Conti or Le Montrachet. Below it come Premier Cru, village and regional wines, a pyramid based on place."
    - choice: "What is a 'clos'?"
      options: ["A walled vineyard", "A type of barrel", "A wine merchant", "A cellar"]
      a: "A walled vineyard"
      explain: "A clos is a vineyard enclosed by a wall, usually built by monks centuries ago. Clos de Vougeot and Clos de Tart are famous examples, and some walls are still standing."
    - tf: "In Burgundy, one vineyard is often shared by many owners."
      truth: true
      explain: "Inheritance laws split plots over generations, so one famous vineyard can have dozens of owners, some with just a few rows. The producer therefore matters as much as the vineyard."
    - match: "Match the label to its level"
      pairs: [[Le Chambertin, Grand Cru], [Volnay 1er Cru Caillerets, Premier Cru], [Pommard, Village], [Bourgogne Rouge, Regional]]
      explain: "More specific place means higher level: Bourgogne is regional, a village name is next, then a Premier Cru vineyard, then a Grand Cru. Reading the label from the bottom of the pyramid up tells you the quality tier."
- title: "Deep dive: Chablis and Beaujolais"
  icon: leaf
  cards:
    - learn: Chablis on Kimmeridgian clay
      visual: "map:france:chablis"
      body: |
        Chablis is cool and isolated, nearer to Champagne than to Beaune. Its best slopes sit on **Kimmeridgian** marl full of tiny fossilized oyster shells.

        Levels: Petit Chablis, Chablis, Chablis Premier Cru, and **seven Grands Crus** on one south-west-facing hill above the town (Les Clos, Vaudésir, Blanchot…). Most is unoaked; some Grands Crus use old oak.
    - learn: Beaujolais and carbonic maceration
      visual: "map:france:beaujolais"
      body: |
        **Gamay** on granite hills south of Mâcon. For juicy, fruity styles, whole bunches are sealed in tanks full of carbon dioxide: fermentation starts **inside each berry** (**carbonic maceration**), giving banana, bubblegum and kirsch notes and low tannin.

        **Beaujolais Nouveau** is released on the third Thursday of November. The **ten crus** (Morgon, Moulin-à-Vent, Fleurie…) are deeper and can age.
    - choice: "What makes Chablis' best soils special?"
      options: ["Kimmeridgian marl with fossil oyster shells", "Volcanic basalt", "Red iron-rich clay", "Sand dunes"]
      a: "Kimmeridgian marl with fossil oyster shells"
      explain: "Chablis' best soils are Kimmeridgian limestone, packed with fossilized oyster shells from a Jurassic sea. The soil is linked with Chablis' steely, saline character and its affinity with oysters."
    - choice: "What is carbonic maceration?"
      options: ["Fermentation inside whole uncrushed berries", "Adding bubbles to wine", "Ageing in charred barrels", "Freezing the grapes"]
      a: "Fermentation inside whole uncrushed berries"
      explain: "In carbonic maceration, whole bunches sit in a CO₂-filled tank and enzymes start fermenting each berry from the inside. The result is a soft, fruity, low-tannin wine with banana and bubblegum notes, typical of Beaujolais."
    - tf: "Chablis has seven Grand Cru vineyards, all on one hillside."
      truth: true
      explain: "Chablis has seven Grand Cru vineyards, all on one hillside that faces south-west across the Serein river from the town. The slope catches afternoon sun, so the grapes ripen better than elsewhere in Chablis."

- title: "History: monks, dukes and heirs"
  icon: hourglass
  cards:
    - learn: A thousand years of plots
      visual: "map:france"
      body: |
        Burgundy's vineyards were shaped by the Church. From the 10th century, the **Benedictines of Cluny** and then the **Cistercians of Cîteaux** (founded 1098) were given vineyards by nobles hoping for salvation.

        The monks noticed that wines from neighboring plots tasted different, and named and walled them: the **Clos de Vougeot**, **Clos de Tart**, **Romanée**. These named plots, the **climats**, were listed by UNESCO in 2015.
    - learn: The dukes and their Pinot
      body: |
        The **Valois Dukes of Burgundy** were among Europe's richest rulers in the 1300s–1400s and used wine as diplomacy. In **1395**, Duke **Philip the Bold** banned the "disloyal" **Gamay** grape from the Côte d'Or, keeping it for Pinot Noir, which is why Gamay moved south to Beaujolais.
    - learn: Revolution and the tiny plots
      body: |
        In **1789** the Revolution seized Church land and sold it in lots. Then **Napoleon's inheritance law** required land to be shared equally among all children. Over generations, vineyards were split again and again.

        That is why **Clos de Vougeot** (50 ha) has more than **80 owners**, why one grower may own just a few rows of a Grand Cru, and why **négociants** who buy and blend grapes from many owners became so important. From the 1920s, growers such as the Marquis d'Angerville pushed for **domaine bottling**: the grower's own wine under their own name.
    - choice: "Who banned Gamay from the Côte d'Or in 1395?"
      options: [Philip the Bold, Napoleon, Louis XIV, The Cistercian monks]
      a: Philip the Bold
      explain: "The Duke of Burgundy called Gamay 'disloyal' and kept the Côte d'Or for Pinot Noir; Gamay found its home in Beaujolais."
    - choice: "Why are Burgundy's vineyards split among so many owners?"
      options: [The Revolution sold Church land and inheritance law divided it among heirs, The monks sold small plots to raise money, Phylloxera destroyed the large estates, The AOC rules require small plots]
      a: The Revolution sold Church land and inheritance law divided it among heirs
      explain: "Napoleonic inheritance law split each estate equally among the children, generation after generation, so vineyards got cut into tiny parcels. That is how Clos de Vougeot ended up with more than 80 owners."
    - tf: "Burgundy's climats are a UNESCO World Heritage site."
      truth: true
      explain: "In 2015 UNESCO listed the climats of Burgundy, the named vineyard plots mapped by monks and growers over a thousand years."

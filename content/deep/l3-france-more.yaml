- title: "Deep dive: the Rhône, north and south"
  icon: sun.max
  cards:
    - learn: "Northern Rhône: Syrah on granite"
      visual: "photo:rhone-hermitage"
      body: |
        A narrow valley of steep **granite** terraces. **Syrah** is the only black grape, giving black pepper, blackberry, olive and violet.

        - **Côte-Rôtie**: may co-ferment up to 20% **Viognier** for perfume.
        - **Hermitage**: one south-facing hill, the most powerful and long-lived.
        - **Cornas**: 100% Syrah, wild and tannic. **Crozes-Hermitage** and **Saint-Joseph**: larger, more affordable.
        - **Condrieu**: 100% Viognier white, apricot and blossom.
    - learn: "Southern Rhône: the GSM blend"
      visual: "photo:chateauneuf-galets"
      body: |
        A wide, sunny plain swept by the cold **mistral** wind. Reds are blends led by **Grenache**, with **Syrah** (color, pepper) and **Mourvèdre** (structure, meaty depth): **GSM**.

        **Châteauneuf-du-Pape** allows 13 varieties; its vineyards are covered in big rounded stones, the **galets roulés**. The papal coat of arms is embossed on many bottles. Neighbors: **Gigondas**, **Vacqueyras**, **Tavel** (rosé only), and great-value **Côtes du Rhône**.
    - choice: "What is the only black grape of the northern Rhône?"
      options: [Syrah, Grenache, Mourvèdre, Pinot Noir]
      a: Syrah
      explain: "Syrah is the only black grape of the northern Rhône (Hermitage, Côte-Rôtie, Cornas), while the south is dominated by Grenache-led blends. Know the north and south split."
    - choice: "What does GSM stand for?"
      options: ["Grenache, Syrah, Mourvèdre", "Gamay, Sauvignon, Merlot", "Grenache, Sangiovese, Malbec", "Garnacha, Sémillon, Muscat"]
      a: "Grenache, Syrah, Mourvèdre"
      explain: "GSM is Grenache, Syrah and Mourvèdre: the classic southern Rhône blend, copied in Australia's McLaren Vale and Barossa. Grenache provides fruit, Syrah spice and color, Mourvèdre structure."
    - tf: "Côte-Rôtie may include some white Viognier in its red wine."
      truth: true
      explain: "Co-fermenting a little Viognier with Syrah in Côte-Rôtie lifts the aroma and stabilizes color. Up to 20% is allowed, though most producers use far less."
    - match: "Match the appellation to its wine"
      pairs: [[Condrieu, Viognier white], [Tavel, Rosé], [Cornas, Pure Syrah red], [Châteauneuf-du-Pape, Grenache-led blend]]
      explain: "Rhône appellations each have a signature: Hermitage and Côte-Rôtie are Syrah, Condrieu is Viognier, Châteauneuf-du-Pape is a blend and Tavel is rosé."
- title: "Deep dive: Loire, Alsace and Champagne houses"
  icon: map
  cards:
    - learn: "The Loire: four grapes, one river"
      visual: "photo:loire-sancerre"
      body: |
        From the Atlantic inland: **Muscadet** (Melon, sur lie), **Anjou-Saumur** (Chenin Blanc, Cabernet Franc, sweet Coteaux du Layon), **Touraine** (Vouvray Chenin, Chinon Cabernet Franc), and the **Centre** (**Sancerre** and **Pouilly-Fumé**, Sauvignon Blanc).

        Chenin Blanc can be bone dry, sparkling, or lusciously sweet, sometimes from the same village.
    - learn: "Alsace: French wines, German grapes"
      visual: "photo:grape-riesling"
      body: |
        Sheltered by the Vosges mountains, Alsace is one of France's **driest** regions. Wines are labeled by **grape**, unusual for France: Riesling, Gewurztraminer, Pinot Gris and Muscat are the four "noble" ones, with 51 **Grands Crus**.

        Wines come in the tall, slender **flûte** bottle. *Vendanges Tardives* (late harvest) and *Sélection de Grains Nobles* (botrytis) are the sweet styles. Most wines skip new oak and many skip malolactic conversion to keep acidity.
    - learn: Champagne's great houses
      visual: "photo:winery-cellar-bottles"
      body: |
        Big houses (*grandes marques*) aim for a consistent **non-vintage** style year after year by blending many villages and **reserve wines** from older years.

        Prestige *cuvées* are their flagships: Dom Pérignon (Moët), Cristal (Roederer), La Grande Dame (Veuve Clicquot). Krug and Bollinger ferment in oak; Ruinart is known for Chardonnay.
    - choice: "How are Alsace wines usually labeled?"
      options: ["By grape variety", "By château name only", "By village only", "By color only"]
      a: "By grape variety"
      explain: "Alsace is the main French region that puts the grape front and center on the label. That reflects its German heritage, and the wines come in tall flûte bottles."
    - choice: "Which Loire grape makes Vouvray?"
      options: [Chenin Blanc, Sauvignon Blanc, Melon, Chardonnay]
      a: Chenin Blanc
      explain: "Vouvray is made from Chenin Blanc and can be sec, demi-sec, moelleux or sparkling. Chenin's high acidity balances any sweetness, so the wines age very well."
    - tf: "Reserve wines help Champagne houses keep a consistent non-vintage style."
      truth: true
      explain: "Reserve wines, older wines kept from earlier years, are blended in to smooth out differences between years. That is how a house keeps a consistent non-vintage style."

- title: "History: popes, kings and widows"
  icon: hourglass
  cards:
    - learn: The Rhône and the popes
      visual: "map:france"
      body: |
        The **northern Rhône**'s terraces at **Hermitage** and **Côte-Rôtie** were planted under the Romans; in the 1700s–1800s Hermitage was so prized that Bordeaux merchants added it to their best wines ("hermitagé").

        In the south, the **popes** moved to **Avignon** in **1309**. Pope John XXII built a summer castle nearby: **Châteauneuf-du-Pape**, "the pope's new castle". In the 1920s its growers, led by **Baron Le Roy**, wrote the rules that became the model for France's **AOC** system (1935).
    - learn: The Loire, garden of kings
      visual: "map:france"
      body: |
        The Loire was the playground of French kings, whose **châteaux** line the river. Its wines traveled easily by boat to Paris and to the Dutch, who loved the sweet Chenin Blanc of **Anjou** and **Vouvray**.

        **Sancerre** was mostly a red-wine and goat-cheese village until phylloxera; it was replanted with **Sauvignon Blanc**, which became world-famous only in the 1960s–70s through Paris bistros.
    - learn: Champagne's inventors
      visual: "map:france"
      body: |
        Kings of France were crowned at **Reims** cathedral, and the region's still wines were served at court. Cold winters stopped fermentation, which restarted in spring: early Champagne was fizzy by **accident**. The monk **Dom Pérignon** (1638–1715) worked to make better, clearer wine, but he did not invent the bubbles.

        Stronger English glass bottles let the fizz survive. In **1816** the widow **Barbe-Nicole Clicquot** invented **riddling**, removing the yeast to make clear sparkling wine. In **1911**, growers rioted against merchants buying grapes from outside the region, which led to Champagne's strict boundaries.
    - learn: Alsace, between two countries
      visual: "map:france:alsace"
      body: |
        **Alsace** changed hands between France and Germany four times between 1871 and 1945. Under German rule (1871–1918) its vineyards were pushed toward cheap bulk wine; afterwards growers rebuilt on quality.

        That history explains the **German-sounding** names, the tall **flûte** bottles, and why Alsace labels its wines by **grape**, unlike the rest of France.
    - choice: "What does 'Châteauneuf-du-Pape' mean?"
      options: [The pope's new castle, The pope's vineyard, The new church, The castle on the hill]
      a: The pope's new castle
      explain: "The popes lived in Avignon from 1309, and John XXII built a summer castle at Châteauneuf, the new castle of the Pope. The papal crest is embossed on the bottles."
    - choice: "Who invented riddling, making clear sparkling wine possible?"
      options: [Barbe-Nicole Clicquot, Dom Pérignon, Napoleon, Baron Le Roy]
      a: Barbe-Nicole Clicquot
      explain: "The widow Clicquot's riddling table (around 1816) slowly moved the yeast into the neck so it could be removed."
    - tf: "Dom Pérignon invented Champagne's bubbles."
      truth: false
      explain: "Bubbles came from fermentation restarting in spring. Dom Pérignon improved the wine, its blending and its clarity."
    - choice: "Why do Alsace wines have German-sounding names?"
      options: [Alsace changed hands between France and Germany several times, The grapes all come from Austria, German monks planted every vineyard, It is a German appellation]
      a: Alsace changed hands between France and Germany several times
      explain: "Between 1871 and 1945 Alsace switched between Germany and France four times, so many family names and wine words are German. That is also why Alsace labels by grape, like Germany."

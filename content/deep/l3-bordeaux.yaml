- title: "Deep dive: inside a Bordeaux château"
  icon: building.columns
  cards:
    - learn: The blend
      visual: "photo:bordeaux-chateau"
      body: |
        Bordeaux is a **blend** country. Five black grapes are allowed: **Cabernet Sauvignon** (structure, blackcurrant, age-worthiness), **Merlot** (plush plum, ripens early), **Cabernet Franc** (perfume, freshness), **Petit Verdot** (color, spice, a splash only) and **Malbec**. **Carmenère** is permitted but rare.

        Blending is insurance: if one grape suffers from spring frost or autumn rain, the others carry the vintage.
    - learn: Grand vin and second wine
      visual: "photo:winery-sorting"
      body: |
        Each château makes its **grand vin** from the best plots and barrels. Lots that don't make the cut go into a **second wine**: Carruades de Lafite, Pavillon Rouge de Château Margaux, Les Forts de Latour.

        Top grands vins spend **18–24 months** in barrels, often **mostly new French oak**, and are racked every few months to clear the sediment.
    - learn: En primeur
      visual: "photo:barrel-cellar"
      body: |
        Every spring, merchants and critics taste the new vintage from barrel. Châteaux then release a part of the wine **en primeur**: buyers pay now and receive bottles about two years later.

        Wine goes from château to *courtier* (broker) to *négociant* (merchant) to the world: the system known as **la Place de Bordeaux**.
    - learn: The Bordeaux bottle
      visual: "photo:bottle-shapes"
      body: |
        The straight-sided bottle with **high shoulders** is the Bordeaux shape, copied worldwide for Cabernet and Merlot. The shoulders are said to catch sediment when pouring.

        Large formats age more slowly; Bordeaux names them differently from Champagne: a **Double Magnum** holds 3 L and an **Impériale** 6 L.
    - learn: Dry whites and clairet
      visual: "photo:saint-emilion"
      body: |
        White Bordeaux blends **Sauvignon Blanc** (zest, grass) and **Sémillon** (wax, body, ageing), sometimes with Muscadelle. Simple Entre-Deux-Mers is fresh and unoaked; Pessac-Léognan whites are barrel-fermented and age for decades.

        **Bordeaux clairet** is a deep rosé from a short maceration: the ancestor of the English word *claret*.
    - choice: "What is a 'second wine' in Bordeaux?"
      options: ["Wine made from lots not chosen for the grand vin", "A wine from the second harvest", "A cheaper wine from another region", "A wine aged a second year"]
      a: "Wine made from lots not chosen for the grand vin"
      explain: "A second wine is made from younger vines or lesser barrels of a top château, for example Pavillon Rouge de Château Margaux. It gives a taste of the house style at a lower price and is ready to drink earlier."
    - choice: "Which grape gives Bordeaux blends their backbone and long ageing?"
      options: [Cabernet Sauvignon, Merlot, Cabernet Franc, Malbec]
      a: Cabernet Sauvignon
      explain: "Cabernet Sauvignon gives Bordeaux blends their backbone and long aging: its thick skins give firm tannin and blackcurrant fruit, especially on Left Bank gravel. Merlot adds softness, and Cabernet Franc adds perfume."
    - tf: "En primeur means buying wine before it is bottled."
      truth: true
      explain: "En primeur means buying wine before it is bottled: buyers pay while the wine is still in barrel and receive it two years later. It can offer savings in good vintages, but prices can fall, so it is a gamble."
    - match: "Match the Bordeaux grape to its role"
      pairs: [[Cabernet Sauvignon, Tannin and structure], [Merlot, Plush body], [Cabernet Franc, Perfume], [Petit Verdot, Color and spice]]
      explain: "Each grape plays a part: Cabernet Sauvignon gives structure, Merlot gives plush fruit, Cabernet Franc adds perfume and Petit Verdot adds color and spice. The blend changes every vintage with the weather."
    - blank: "The English call red Bordeaux ___."
      answers: [claret]
      options: [hock, sack, tawny]
      explain: "The English call red Bordeaux claret, from the French clairet, the pale reds once shipped to England. Bordeaux was English for three centuries, so claret is one of the oldest wine words in the language."
- title: "Deep dive: vintages and ageing"
  icon: clock
  cards:
    - learn: Why vintages matter here
      visual: "photo:grape-merlot"
      body: |
        Bordeaux sits on the Atlantic: some years are warm and dry, others wet and cool. A great **vintage** needs a warm summer, a dry September and no rain at harvest.

        Recent stars include **2005, 2009, 2010, 2015, 2016, 2019, 2020** and **2022**. In cooler years, Merlot on the Right Bank often does better than late-ripening Cabernet.
    - learn: How claret ages
      visual: "photo:winery-cellar-bottles"
      body: |
        Young top Bordeaux is **dark, tannic and oaky**: blackcurrant, cedar and vanilla.

        After 10–20 years, tannins soften and **tertiary** notes appear: **cedar, cigar box, leather, forest floor, dried fruit**. The color fades from purple to **garnet** with a brick rim.
    - learn: Decanting
      visual: "photo:sommelier"
      body: |
        Young claret benefits from **decanting** for air; old claret is decanted gently to leave its **sediment** behind. Stand the bottle upright a day before, then pour slowly over a light until the sediment reaches the neck.
    - choice: "What does an aged Bordeaux typically smell of?"
      options: ["Cedar, cigar box and leather", "Banana and bubblegum", "Lychee and rose", "Fresh grass and gooseberry"]
      a: "Cedar, cigar box and leather"
      explain: "An aged Bordeaux smells of cedar, tobacco, leather, forest floor and dried fruit. These tertiary notes come from years in bottle, and are the reason old Bordeaux is so prized."
    - choice: "In a cool, rainy Bordeaux vintage, which grape often fares better?"
      options: [Merlot, Cabernet Sauvignon, Petit Verdot, Syrah]
      a: Merlot
      explain: "Merlot ripens earlier than Cabernet, so in a cool, rainy vintage it can be picked before the autumn rain. That is why Right Bank wines often do better in wet years, and Left Bank in hot, dry ones."
    - tf: "Old red wine is decanted partly to separate it from its sediment."
      truth: true
      explain: "Tannins and pigments drop out as a fine deposit over the years, so old red wine throws sediment. Decanting separates the clear wine from it, so you don't pour a gritty glass."

- title: "History: how Bordeaux was built"
  icon: hourglass
  cards:
    - learn: Roman port, English market
      visual: "map:france"
      body: |
        The Romans planted vines at **Burdigala** in the 1st century AD. But Bordeaux's fortune came from **trade**: after **1152**, when Eleanor of Aquitaine married the future Henry II of England, Bordeaux shipped its light red **clairet** to London for three hundred years. The English still call red Bordeaux **claret**.

        When the English left in **1453**, Bordeaux kept its sea trade with Britain, the Netherlands and northern Europe.
    - learn: Draining the Médoc
      body: |
        Until the 1600s, the Médoc was marsh. **Dutch** engineers dug drainage channels and revealed **gravel ridges** along the Gironde. On that warm, free-draining gravel, Cabernet Sauvignon could finally ripen.

        Rich families of Bordeaux's Parliament built estates there. **Haut-Brion** was sold by name in London by **1663**; Lafite, Latour and Margaux soon followed: the birth of the **château** as a brand.
    - learn: Merchants, 1855 and beyond
      body: |
        Bordeaux's **négociants** (merchants), many of them British, Irish, Dutch and German families, bought wine young, aged and sold it. Their price lists became the **1855 classification**.

        Phylloxera, two world wars and the 1930s depression hit hard. The modern boom began with **Émile Peynaud**'s scientific winemaking in the 1950s–60s and Robert Parker's praise of the **1982** vintage, which turned the Grands Crus into global luxury goods.
    - choice: "Why do the British call red Bordeaux 'claret'?"
      options: [From the light red 'clairet' shipped to England after 1152, Because it is always clear in color, From a château called Claret, From the Latin word for wine]
      a: From the light red 'clairet' shipped to England after 1152
      explain: "Bordeaux belonged to the English crown for three centuries, and its pale red clairet was London's everyday wine."
    - choice: "What did the Dutch do for Bordeaux in the 1600s?"
      options: [Drained the Médoc marshes, Invented the Bordeaux bottle, Created the 1855 classification, Planted Merlot on the Right Bank]
      a: Drained the Médoc marshes
      explain: "Drainage exposed the gravel ridges where Cabernet Sauvignon ripens; the Médoc's great estates followed."
    - tf: "Château Haut-Brion was already sold by name in London in the 1660s."
      truth: true
      explain: "The diarist Samuel Pepys wrote of drinking 'Ho Bryan' in 1663: one of the first wines sold under its estate's name."

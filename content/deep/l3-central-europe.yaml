- title: "Deep dive: German Riesling decoded"
  icon: textformat
  cards:
    - learn: Prädikat levels
      visual: "photo:mosel-slope"
      body: |
        German quality wine is graded by **grape ripeness at harvest**, not by sweetness in the glass:

        **Kabinett** → **Spätlese** (late harvest) → **Auslese** (selected bunches) → **Beerenauslese** (selected berries, usually botrytized) → **Trockenbeerenauslese** (dried botrytized berries) and **Eiswein**.

        Kabinett and Spätlese are often off-dry; **Trocken** on a label means dry.
    - learn: VDP and Grosses Gewächs
      body: |
        The VDP growers' association uses a Burgundy-style pyramid: **Gutswein**, **Ortswein** (village), **Erste Lage** (premier cru) and **Grosse Lage** (grand cru). A dry wine from a Grosse Lage is a **Grosses Gewächs** (GG), shown by "GG" on the bottle.
    - learn: Regions and bottles
      visual: "photo:mosel-slope"
      body: |
        - **Mosel**: steep slate, light, racy, low alcohol.
        - **Rheingau**: south-facing slopes on the Rhine, fuller and drier.
        - **Pfalz**: warmest, rich dry Riesling and Spätburgunder (Pinot Noir).
        - **Nahe**, **Rheinhessen**, **Franken** (Silvaner in the flat *Bocksbeutel* bottle).

        Most German wine comes in the tall **flûte** bottle: brown glass traditionally for the Rhine, green for the Mosel.
    - choice: "What do German Prädikat levels measure?"
      options: ["Grape ripeness at harvest", "Sweetness of the finished wine", "Years in oak", "Alcohol level"]
      a: "Grape ripeness at harvest"
      explain: "German Prädikat levels measure grape ripeness at harvest, from Kabinett up to Trockenbeerenauslese. A Spätlese can be dry or sweet, so check the label for the word trocken."
    - choice: "What does 'GG' on a German bottle mean?"
      options: ["A dry wine from a top vineyard", "A sparkling wine", "A sweet late harvest", "A blend of grapes"]
      a: "A dry wine from a top vineyard"
      explain: "GG stands for Grosses Gewächs: a dry wine from a VDP Grosse Lage, a top vineyard. It is Germany's equivalent of a Grand Cru dry wine."
    - match: "Put the Prädikat levels in order with their meaning"
      pairs: [[Kabinett, Lightest], [Spätlese, Late harvest], [Auslese, Selected bunches], [Trockenbeerenauslese, Dried botrytized berries]]
      explain: "Each step up means riper, rarer grapes: Kabinett, Spätlese, Auslese, Beerenauslese, Trockenbeerenauslese. The higher levels are often sweet, and only the sweetest need botrytis."
- title: "Deep dive: Austria, Hungary and Greece"
  icon: mountain.2
  cards:
    - learn: Austria
      visual: "photo:wachau"
      body: |
        **Grüner Veltliner** (white pepper, citrus) and **Riesling** shine on the Danube terraces of the **Wachau**, **Kremstal** and **Kamptal**. The Wachau grades dry wines as **Steinfeder**, **Federspiel** and **Smaragd** (richest).

        **Blaufränkisch** and **Zweigelt** make spicy reds in Burgenland; around Lake **Neusiedl**, mists bring noble-rot sweet wines.
    - learn: Hungary
      visual: "photo:tokaj"
      body: |
        Beyond Tokaji: dry **Furmint** is now a serious white; **Eger** makes the red blend *Egri Bikavér* ("Bull's Blood"); **Villány** in the warm south grows Cabernet Franc and Bordeaux blends.
    - learn: Greece
      visual: "photo:santorini-kouloura"
      body: |
        - **Santorini**: **Assyrtiko** on volcanic ash; vines trained into low baskets (*kouloura*) to shelter grapes from wind. Sweet **Vinsanto** from sun-dried grapes.
        - **Naoussa**: **Xinomavro**, tannic and tomato-scented, Greece's "Barolo".
        - **Nemea**: soft, fruity **Agiorgitiko**.
    - choice: "What is the richest dry wine category in the Wachau?"
      options: [Smaragd, Federspiel, Steinfeder, Kabinett]
      a: Smaragd
      explain: "Smaragd, named after the emerald lizard sunning itself on the terraces, is the Wachau's richest dry category. It is full-bodied and often 13% alcohol or more."
    - choice: "Why are Santorini vines trained into baskets?"
      options: ["To protect grapes from strong winds and sun", "To make picking faster", "To keep goats away", "For decoration"]
      a: "To protect grapes from strong winds and sun"
      explain: "Santorini's strong winds would shred the vines, so they are trained into low baskets called kouloura that shelter the bunches inside the coiled vine. Volcanic ash soil also spared the island from phylloxera."
    - tf: "Egri Bikavér is a sweet white wine."
      truth: false
      explain: "Egri Bikavér, Bull's Blood of Eger, is a red blend, not a sweet white. Legend says the defenders of Eger castle drank the wine in 1552 and fought like bulls."

- title: "History: emperors' wines"
  icon: hourglass
  cards:
    - learn: Tokaji, wine of kings
      visual: "map:hungary"
      body: |
        In **Tokaj**, Hungary, noble rot was understood by the **1600s**; by legend a harvest delayed by Turkish raids led to the first Aszú. In **1730** the vineyards were classified, more than a century before Bordeaux's 1855 list.

        Louis XIV called it "**the wine of kings, the king of wines**". Communism (1949–1989) turned Tokaj into a state farm; investment from France and Spain after 1990 revived it.
    - learn: Germany's late harvest
      visual: "map:germany"
      body: |
        The Romans planted the **Mosel**, and monasteries such as **Kloster Eberbach** made the Rheingau famous. In **1775**, at **Schloss Johannisberg**, the messenger carrying permission to start the harvest was late; the grapes rotted, the wine was wonderful, and **Spätlese** ("late harvest") was born.

        In the 1800s, top Rieslings cost more than First Growth Bordeaux. Wars, then cheap sweet exports such as Liebfraumilch, hurt its name; today's dry **Grosses Gewächs** wines have rebuilt it.
    - learn: Austria's clean start
      visual: "map:austria"
      body: |
        In **1985** a few Austrian brokers were caught sweetening wine with **diethylene glycol**. Exports collapsed overnight. Austria responded with some of the strictest wine laws in the world.

        A new generation focused on dry **Grüner Veltliner** and **Riesling** from the **Wachau** and Kamptal, and Austrian wine is now admired for its purity.
    - choice: "What happened at Schloss Johannisberg in 1775?"
      options: [A late messenger delayed the harvest and Spätlese was born, The first Sekt was made, Phylloxera arrived in Germany, The Mosel was classified]
      a: A late messenger delayed the harvest and Spätlese was born
      explain: "The overripe, partly botrytized grapes made exceptional wine: the start of Germany's late-harvest tradition."
    - tf: "Tokaj's vineyards were classified in 1730, before Bordeaux's 1855 classification."
      truth: true
      explain: "Tokaj's vineyards were classified in 1730, well before Bordeaux's 1855 classification. That makes it one of the oldest classifications in the world, and shows how highly its sweet wines were prized."
    - choice: "What did the 1985 scandal lead to in Austria?"
      options: [Very strict wine laws and a focus on quality, A ban on Grüner Veltliner, The end of Austrian wine exports forever, The creation of Tokaji]
      a: Very strict wine laws and a focus on quality
      explain: "After the 1985 glycol scandal, when some producers added antifreeze to make wine seem sweeter, Austria rebuilt its reputation on dry, pure, carefully controlled wines with strict quality laws."

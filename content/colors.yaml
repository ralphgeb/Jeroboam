- {id: c-brown, chart: true, name: Brown, family: white, hex: "#7A4419", rim: "#B07A44", note: "Very old or deliberately oxidized.", examples: "Oloroso, Pedro Ximénez"}
- {id: c-pale-salmon, chart: true, name: Pale salmon, family: rose, hex: "#F7CDBE", rim: "#FBE6DD", note: "Delicate, dry, Provence style.", examples: "Provence rosé, White Zinfandel"}
- {id: c-salmon, chart: true, name: Salmon, family: rose, hex: "#F4A88F", rim: "#F9D1C2", note: "Classic dry rosé.", examples: "Sangiovese rosé, Pinot Noir rosé"}
- {id: c-copper, chart: true, name: Copper, family: rose, hex: "#EE9465", rim: "#F6C4A6", note: "Skin-contact or Pinot Gris rosé.", examples: "Pinot Gris ramato, Tibouren"}
- {id: c-pale-pink, chart: true, name: Pale pink, family: rose, hex: "#F6C1CB", rim: "#FBE2E7", note: "Light, fresh rosé.", examples: "Mourvèdre rosé"}
- {id: c-pink, chart: true, name: Pink, family: rose, hex: "#EE8DA0", rim: "#F7C6D0", note: "Fruity, vivid rosé.", examples: "Grenache rosé, Navarra rosado"}
- {id: c-deep-pink, chart: true, name: Deep pink, family: rose, hex: "#E04C72", rim: "#EF97AE", note: "Full, deeply colored rosé.", examples: "Tavel, Cerasuolo"}
- {id: c-pale-ruby, chart: true, name: Pale ruby, family: red, hex: "#B8263F", rim: "#DC7584", note: "Thin-skinned, light reds.", examples: "Pinot Noir, Gamay"}
- {id: c-medium-ruby, chart: true, name: Medium ruby, family: red, hex: "#911A31", rim: "#C9566A", note: "The everyday red.", examples: "Tempranillo, GSM blends"}
- {id: c-deep-ruby, chart: true, name: Deep ruby, family: red, hex: "#5E0F24", rim: "#9C3248", note: "Thick-skinned, structured reds.", examples: "Merlot, Cabernet Sauvignon, Tannat"}
- {id: c-pale-purple, chart: true, name: Pale purple, family: red, hex: "#A0275C", rim: "#D06B96", note: "Very young, fruity reds.", examples: "Beaujolais Nouveau, Valpolicella"}
- {id: c-medium-purple, chart: true, name: Medium purple, family: red, hex: "#6D1A4A", rim: "#A84F84", note: "Young, intense reds.", examples: "Malbec, Syrah, Teroldego"}
- {id: c-deep-purple, chart: true, name: Deep purple, family: red, hex: "#3A0C2C", rim: "#743062", note: "Inky, dark-skinned reds.", examples: "Alicante Bouschet, Pinotage"}
- {id: c-pale-garnet, chart: true, name: Pale garnet, family: red, hex: "#B8402F", rim: "#DD8270", note: "Light reds that age quickly.", examples: "Nebbiolo"}
- {id: c-medium-garnet, chart: true, name: Medium garnet, family: red, hex: "#8E2A22", rim: "#C66A58", note: "Developing reds.", examples: "Sangiovese, aged reds"}
- {id: c-deep-garnet, chart: true, name: Deep garnet, family: red, hex: "#5C1A17", rim: "#9A4B3C", note: "Powerful, aged reds.", examples: "Aged Amarone, Barolo"}

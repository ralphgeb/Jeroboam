title: Italy
summary: "Piedmont, Tuscany, the North East and the South."
icon: map
lessons:
  - title: Piedmont
    cards:
      - learn: The Langhe
        visual: "map:piedmont"
        body: |
          Fog-wrapped hills around **Alba**. Continental climate; best sites face south.

          - **Barolo**: Nebbiolo, minimum 38 months' ageing (18 in wood). Powerful, structured.
          - **Barbaresco**: Nebbiolo, 26 months. Often more elegant.
          - **Barbera d'Asti** and **Dolcetto d'Alba**: everyday reds.
          - **Moscato d'Asti**: gently sparkling and sweet. **Gavi**: crisp Cortese.
      - learn: Barolo's communes
        body: |
          Barolo is five main villages, and each speaks differently:

          - **La Morra** and **Barolo**: softer Tortonian marl, perfumed, elegant, earlier-drinking wines.
          - **Serralunga d'Alba**: older, compact Helvetian soils, the most powerful and structured Barolo, needing 15 years or more.
          - **Castiglione Falletto** and **Monforte d'Alba**: in between, with firm structure and depth.
      - choice: "What is the minimum ageing for Barolo?"
        options: ["38 months", "12 months", "6 months", "10 years"]
        a: "38 months"
        explain: "Barolo must age at least 38 months, including 18 months in wood. Riserva requires 62 months. Barolo is released later than almost any other red, since Nebbiolo's tannins need time."
      - choice: "Which Piedmont grape is deeply colored with high acidity but low tannin?"
        options: [Barbera, Nebbiolo, Dolcetto, Cortese]
        a: Barbera
        explain: "Barbera has deep color, high acidity and low tannin: its juicy acidity and soft tannin make it a perfect food wine. Piedmont's Barbera d'Alba and d'Asti are everyday favorites."
      - tf: "Barbaresco is made from Sangiovese."
        truth: false
        explain: "Barbaresco, like Barolo, is 100% Nebbiolo, not Sangiovese. It is grown in a smaller, warmer zone near Alba, so it tends to be a little more elegant and earlier-maturing."
        visual: "map:piedmont:barbaresco"
      - blank: "Gavi is a crisp white wine from the ___ grape."
        answers: [Cortese]
        options: [Arneis, Garganega, Glera]
        explain: "Gavi is a crisp white made from the Cortese grape: lemon, green apple and almond, a classic with pesto from nearby Liguria. The best Gavi di Gavi is a DOCG."
  - title: Tuscany
    cards:
      - learn: Sangiovese country
        visual: "map:tuscany"
        body: |
          - **Chianti Classico**: the historic heart (black rooster symbol), ≥80% Sangiovese. Annata → Riserva → **Gran Selezione**.
          - **Brunello di Montalcino**: 100% Sangiovese, released five years after harvest.
          - **Vino Nobile di Montepulciano**: Sangiovese (Prugnolo Gentile).
          - **Bolgheri**: coastal Super Tuscans from Bordeaux varieties.
      - choice: "Brunello di Montalcino is made from…"
        options: ["100% Sangiovese", "Cabernet and Merlot", "Montepulciano", "Nebbiolo"]
        a: "100% Sangiovese"
        visual: "map:tuscany:montalcino"
        explain: "Brunello is the local name for a Sangiovese clone (Sangiovese Grosso). Warm, dry Montalcino gives power and longevity, and the wine has to age five years before release."
      - choice: "What is a Super Tuscan?"
        options: ["A Tuscan wine made outside traditional rules", "The oldest Chianti", "A sparkling wine", "A sweet Vin Santo"]
        a: "A Tuscan wine made outside traditional rules"
        explain: "Starting with Sassicaia and Tignanello in the 1970s, often with Cabernet or Merlot, first released as table wine."
      - tf: "Vino Nobile di Montepulciano is made from the Montepulciano grape."
        truth: false
        explain: "Vino Nobile di Montepulciano is Sangiovese from the town of Montepulciano in Tuscany. The Montepulciano grape is grown in Abruzzo, which is a classic exam trap."
      - match: "Match the Tuscan wine to its place"
        pairs: [[Sassicaia, Bolgheri], [Brunello, Montalcino], [Gran Selezione, Chianti Classico]]
        explain: "Three of Tuscany's great names: Chianti Classico between Florence and Siena, Brunello di Montalcino in the south and Bolgheri on the coast. Each is a different expression of Sangiovese or Bordeaux grapes."
  - title: The North East
    cards:
      - learn: Veneto and beyond
        visual: "map:italy:veneto,friuli,trentino-alto-adige"
        body: |
          - **Valpolicella** (Corvina): light Valpolicella, **Ripasso**, dry **Amarone** and sweet **Recioto** from dried grapes (appassimento).
          - **Soave** (Garganega). **Prosecco** (Glera).
          - **Friuli**: fine whites and orange wines. **Alto Adige**: Alpine aromatic whites.
      - choice: "How is Amarone made?"
        options: ["From grapes dried for months before fermentation", "From frozen grapes", "By the traditional method", "With added grape spirit"]
        a: "From grapes dried for months before fermentation"
        explain: "Amarone is made by appassimento: grapes are dried for months, which concentrates sugar. Fermenting to dryness gives a powerful wine of about 15–16% abv with raisin and cherry flavors."
      - tf: "Ripasso is Valpolicella refermented on leftover Amarone skins."
        truth: true
        explain: "Ripasso is Valpolicella refermented on leftover Amarone skins. It adds body, alcohol and dried-fruit flavor, which is why it is called baby Amarone."
      - blank: "Soave is made mainly from the ___ grape."
        answers: [Garganega]
        options: [Glera, Corvina, Trebbiano]
        explain: "Soave is made mainly from Garganega, grown on volcanic and limestone hills east of Verona. Good Soave Classico is crisp, with almond and white peach notes."
      - choice: "Which Italian region is known for skin-contact orange wines?"
        options: [Friuli, Puglia, Tuscany, Sicily]
        a: Friuli
        explain: "Pioneers near the Slovenian border revived long skin maceration for white grapes such as Ribolla Gialla."
  - title: The South & islands
    cards:
      - learn: Volcanoes and sunshine
        visual: "map:italy:campania,basilicata,puglia,sicily"
        body: |
          - **Campania**: Taurasi (Aglianico), Fiano di Avellino, Greco di Tufo.
          - **Basilicata**: Aglianico del Vulture.
          - **Puglia**: Primitivo and Negroamaro.
          - **Sicily**: Nero d'Avola, and elegant Etna wines (Nerello Mascalese, Carricante) from volcanic slopes.
          - **Sardinia**: Cannonau (Grenache) and Vermentino.
      - choice: "Taurasi is made from…"
        options: [Aglianico, Nero d'Avola, Primitivo, Nebbiolo]
        a: Aglianico
        explain: "Taurasi, from Campania, is made from Aglianico and is often called the Barolo of the South, high in tannin and acidity. It needs years to soften and can age for decades."
      - tf: "Cannonau, from Sardinia, is the same grape as Grenache."
        truth: true
        explain: "Cannonau, from Sardinia, is the same grape as Grenache. Sardinia has a long tradition of the grape, possibly as old as Spain's, and the island has one of the highest numbers of centenarians in the world."
      - choice: "Why are Mount Etna's wines fresher than much of Sicily's?"
        options: ["High-altitude volcanic slopes", "Northern latitude", "Heavy rainfall", "Machine harvesting"]
        a: "High-altitude volcanic slopes"
        explain: "Mount Etna's vineyards climb above 1,000 m, giving cool nights and elegant wines. The black volcanic soils and old vines of Nerello Mascalese make reds compared to Burgundy."
      - match: "Match the southern grape to its region"
        pairs: [[Primitivo, Puglia], [Fiano, Campania], [Nero d'Avola, Sicily]]
        explain: "Three of southern Italy's most important grapes: Aglianico in Campania and Basilicata, Nero d'Avola in Sicily and Primitivo in Puglia. Each gives a bold, sunny red."
  - title: Going further
    cards:
      - learn: Super Tuscans
        visual: "photo:tuscany-chianti"
        body: 'In the 1970s, producers like Sassicaia and Tignanello broke DOC rules, using Cabernet Sauvignon and French oak. Sold as simple table wine, they became famous as **Super Tuscans**, and Bolgheri later got its own DOC.
      
          '
      - learn: The Veneto
        visual: "photo:grape-must"
        body: '**Valpolicella** blends Corvina with other local grapes. **Amarone** is made from grapes dried for months (appassimento), giving rich, high-alcohol, dry reds. **Ripasso** passes young Valpolicella over Amarone skins for extra body.
      
          '
      - choice: What is 'appassimento'?
        options:
        - Drying grapes before fermentation
        - Ageing in clay jars
        - A type of sparkling wine
        - Blending white and red
        a: Drying grapes before fermentation
        explain: "Appassimento is drying grapes: it concentrates sugar and flavor, and it is how Amarone and Recioto are made. Grapes are dried for months on racks or in lofts."
      - match: Match the wine to its region
        pairs:
        - - Amarone
          - Veneto
        - - Barolo
          - Piedmont
        - - Brunello di Montalcino
          - Tuscany
        - - Etna Rosso
          - Sicily
        explain: "Italy's twenty regions each have their own grapes and wines: Piedmont for Nebbiolo, Tuscany for Sangiovese, Veneto for Corvina, Campania for Aglianico. Matching them is a core Italian skill."
      - tf: Super Tuscans often include Cabernet Sauvignon or Merlot.
        truth: true
        explain: "International grapes are what made Super Tuscans break the old rules: from the 1970s Cabernet Sauvignon and Merlot were blended outside the DOC rules. The wines were labeled humble vino da tavola, but became icons."
      - choice: Which grape is the backbone of Valpolicella and Amarone?
        options:
        - Corvina
        - Nebbiolo
        - Aglianico
        - Primitivo
        a: Corvina
        explain: "Corvina is the backbone of Valpolicella and Amarone, giving sour cherry and almond notes. Its thick skins let it dry well without rotting, so it suits appassimento."
      - blank: Sassicaia comes from the coastal Tuscan zone of ___.
        answers:
        - Bolgheri
        options:
        - Chianti
        - Montalcino
        - Montepulciano
        - Maremma Sud
        explain: "Sassicaia comes from Bolgheri, on the Tuscan coast, which became famous for Bordeaux-style blends. Sassicaia, first made in 1968, was the first Super Tuscan, and got its own DOC in 1994."

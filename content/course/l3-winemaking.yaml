title: Winemaking in depth
summary: "Before, during and after fermentation: the choices that define style."
icon: flask
lessons:
  - title: Before fermentation
    cards:
      - learn: Preparing the must
        visual: "photo:winery-sorting"
        body: |
          - **Sorting**: removing rotten or unripe fruit.
          - **Destemming and crushing**, or keeping whole bunches.
          - **SO₂**: added to protect against oxygen and bacteria.
          - **Must adjustments**: in cool places, **chaptalization** (adding sugar to raise alcohol); in hot places, **acidification**.
          - **Cold soak**: macerating black grapes before fermentation for color and fruit.
      - choice: "What is chaptalization?"
        options: ["Adding sugar to the must to raise alcohol", "Adding acid in hot climates", "Removing stems", "Stirring the lees"]
        a: "Adding sugar to the must to raise alcohol"
        explain: "Named after Jean-Antoine Chaptal. It is allowed in cooler regions such as Burgundy and Germany (with limits) and banned in many warm regions."
      - tf: "Acidification is most common in hot regions."
        truth: true
        explain: "Grapes from hot climates lose acidity as they ripen, so winemakers add tartaric acid to restore balance."
      - choice: "Why is sulfur dioxide (SO₂) used in winemaking?"
        options: ["As an antioxidant and antimicrobial", "To add bubbles", "To sweeten the wine", "To add oak flavor"]
        a: "As an antioxidant and antimicrobial"
        explain: "Small amounts of sulfur dioxide protect wine from oxidation and spoilage. Almost all wines contain some, including natural wines in tiny amounts, and it has been used since Roman times."
      - blank: "Soaking black grapes before fermentation at low temperature is called a cold ___."
        answers: [soak]
        options: [press, stabilization, fining]
        explain: "A cold soak is soaking black grapes before fermentation at low temperature. It is popular for Pinot Noir to extract color and fruit before alcohol forms, as alcohol would extract harsher tannins."
  - title: Fermentation choices
    cards:
      - learn: Extraction methods
        visual: "flow:carbonic"
        body: |
          - **Punch down** (pigeage) and **pump over** (remontage) control extraction.
          - **Whole-bunch** fermentation adds fragrance, spice and structure.
          - **Carbonic maceration** gives soft, fruity reds with kirsch and banana.
          - **Fermentation temperature**: cooler for fruit, warmer for extraction.
          - **Vessel**: steel, oak, concrete or clay (amphora, qvevri).
      - choice: "Carbonic maceration is most associated with…"
        options: [Beaujolais, Barolo, Sauternes, Champagne]
        a: Beaujolais
        explain: "Carbonic maceration is most associated with Beaujolais: whole bunches in a CO₂-filled vessel give juicy, low-tannin wine with banana and bubblegum notes. Fermentation starts inside each berry."
      - tf: "Pigeage means punching the cap down into the wine."
        truth: true
        explain: "Pigeage means punching the cap down into the wine. It is traditional in Burgundy, sometimes even done by foot, and it extracts color and tannin gently."
      - choice: "Which vessel has been used for winemaking in Georgia for about 8,000 years?"
        options: [Qvevri, Barrique, Stainless steel, Concrete egg]
        a: Qvevri
        explain: "Large egg-shaped clay jars buried underground. Georgian qvevri winemaking is on UNESCO's intangible heritage list."
      - blank: "Fermenting with stems attached is called whole-___ fermentation."
        answers: [bunch]
        options: [berry, vine, cluster-free]
        explain: "Fermenting with stems attached is called whole-bunch fermentation. It is popular for Pinot Noir and Syrah, adding aromatic lift and tannin. The stems must be ripe, or they give a green taste."
  - title: After fermentation
    cards:
      - learn: Finishing the wine
        body: |
          - **Maturation**: in steel (fresh), old oak (gentle oxygen) or new oak (flavor).
          - **Blending**: varieties, vineyards, barrels.
          - **Clarification**: racking, **fining** (bentonite, egg white) and **filtration**.
          - **Stabilization**: cold stabilization prevents harmless tartrate crystals.
          - **Closure**: natural cork, screwcap, synthetic or glass.
      - choice: "What does fining do?"
        options: ["Removes haze-causing particles", "Adds bubbles", "Raises alcohol", "Adds tannin"]
        a: "Removes haze-causing particles"
        explain: "Agents like bentonite clay or egg white bind to particles, which settle out. Note: egg white and milk proteins mean some wines are not vegan."
      - tf: "Tartrate crystals in a bottle are a serious fault."
        truth: false
        explain: "Tartrates, also called wine diamonds, are harmless crystals of tartaric acid. Cold stabilization prevents them for cosmetic reasons, so they are not a fault."
      - choice: "Which closure best eliminates the risk of cork taint?"
        options: [Screwcap, Natural cork, Agglomerated cork, Wax seal]
        a: Screwcap
        explain: "Screwcaps eliminate the risk of cork taint, and they keep aromatic whites fresh. They are standard in New Zealand and Australia, and increasingly used for Riesling in Europe."
      - match: "Match the vessel to its effect"
        pairs: [[Stainless steel, Fresh fruit], [New oak, Vanilla and toast], [Old oak, Gentle oxygen]]
        explain: "The vessel is one of the winemaker's biggest stylistic choices: stainless steel keeps freshness, oak adds flavor and gentle oxygen, concrete gives texture without flavor, and amphora gives earthy character."
  - title: Going further
    cards:
      - learn: Whole bunch and carbonic
        visual: flow:carbonic
        body: '**Carbonic maceration** ferments whole, uncrushed grapes inside a CO₂-filled tank. The result is soft, very fruity, low-tannin red with notes of banana, bubblegum and kirsch: classic Beaujolais Nouveau.
      
          '
      - learn: Fining, filtering, sulfur
        visual: "photo:winery-lab"
        body: 'Before bottling, wines are often **fined** (agents bind haze-causing particles) and **filtered**. A little **sulfur dioxide** protects against oxidation and microbes.
      
      
          Some producers skip these steps for "natural" wines, accepting more risk and variation.
      
          '
      - choice: Banana and bubblegum notes in a light red suggest…
        options:
        - Carbonic maceration
        - Long oak ageing
        - Botrytis
        - Fortification
        a: Carbonic maceration
        explain: "Whole-berry fermentation creates fruity esters, typical of Beaujolais Nouveau: banana and bubblegum in a light red are a sign of carbonic maceration."
      - tf: Sulfur dioxide protects wine from oxidation.
        truth: true
        explain: "SO₂ is an antioxidant and antimicrobial used in nearly all wines in small amounts. It protects color and freshness, and it is also used to clean barrels."
      - match: Match the technique to its result
        pairs:
        - - Carbonic maceration
          - Soft fruity reds
        - - Bâtonnage
          - Creamier texture
        - - Cold soak
          - Deeper color
        - - Fortification
          - Higher alcohol
        explain: "Each technique targets one part of the finished wine: cold soak for color, malolactic for softness, lees stirring for texture, and fining for clarity."
      - choice: What is 'bâtonnage'?
        options:
        - Stirring the lees
        - Punching down the cap
        - Adding sugar before fermentation
        - Toasting a barrel
        a: Stirring the lees
        explain: "Bâtonnage is stirring dead yeast (lees) back into the wine. It adds body and a creamy, bready character, and is common in white Burgundy and Champagne base wines."
      - blank: Adding sugar to the must to raise alcohol is called ___.
        answers:
        - chaptalization
        options:
        - acidification
        - fining
        - riddling
        - malolactic
        explain: "Chaptalization, adding sugar to the must to raise alcohol, is allowed in some cool regions, such as Burgundy and Germany, where grapes struggle to ripen. It increases alcohol, not sweetness, and is banned in warm regions."

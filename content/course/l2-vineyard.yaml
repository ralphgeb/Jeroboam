title: In the vineyard
summary: "The vine's year, climate and weather, and what terroir really means."
icon: leaf
lessons:
  - title: The vine and its year
    cards:
      - learn: A year in the vineyard
        visual: "diagram:vine-cycle"
        body: |
          A grapevine follows the same cycle every year:

          - **Budburst**: green shoots emerge in spring.
          - **Flowering & fruit set**: tiny flowers become berries.
          - **Véraison**: berries soften and change color.
          - **Harvest**: in autumn, when sugar, acid and flavor are in balance: **September and October** in the Northern Hemisphere, **March and April** in the Southern.
          - **Dormancy**: the vine rests in winter and is pruned.
      - learn: What a grape needs
        body: |
          Vines need **sunlight** (to make sugar), **warmth** (to ripen), **water** and **nutrients**. Most quality vineyards lie between **30° and 50°** latitude in both hemispheres.
        visual: "diagram:wine-belt"
      - choice: "What is véraison?"
        options: ["When grapes change color and start to ripen", "When the vine flowers", "When the grapes are picked", "Winter pruning"]
        a: "When grapes change color and start to ripen"
        explain: "At véraison black grapes turn from green to purple, white grapes become translucent, and sugar starts to build fast."
      - choice: "Most of the world's vineyards lie between which latitudes?"
        options: ["30° and 50°", "0° and 20°", "50° and 70°", "10° and 30°"]
        a: "30° and 50°"
        visual: "diagram:wine-belt"
        explain: "Closer to the equator it is too hot (no winter rest); closer to the poles it is too cold to ripen grapes."
      - blank: "In the Northern Hemisphere, harvest usually happens in September and ___."
        answers: [October]
        options: [March, June, January]
        explain: "In the Northern Hemisphere, harvest usually happens in September and October, though warm regions start in August. In the Southern Hemisphere the seasons flip: harvest falls around February to April."
      - match: "Put each stage with its season (Northern Hemisphere)"
        pairs: [[Budburst, Spring], [Véraison, Summer], [Harvest, Autumn], [Dormancy, Winter]]
        explain: "The vine's year: budburst in spring, flowering in late spring, fruit set in early summer, véraison in late summer, harvest in autumn, and dormancy in winter. This cycle drives the whole calendar of a wine region."
  - title: Climate & weather
    cards:
      - learn: Cool vs warm climates
        visual: "diagram:climate"
        body: |
          **Climate** is a region's long-term average; **weather** is what happens in a given year.

          - **Cool climates**: higher acidity, lower alcohol, lighter body, green and citrus fruit (or red fruit in reds).
          - **Warm climates**: lower acidity, higher alcohol, fuller body, stone, tropical and black fruit.
      - learn: Natural air conditioning
        visual: "photo:loire-sancerre"
        body: |
          Warm regions can still make fresh wines thanks to:

          - **Altitude**: temperatures drop about 0.6 °C every 100 m.
          - **Ocean currents and fog**: California's Pacific fog, Chile's Humboldt Current.
          - **Large rivers and lakes**, which moderate temperatures.
      - choice: "A cool-climate wine typically has…"
        options: ["Higher acidity and lower alcohol", "Lower acidity and higher alcohol", "More tannin and sugar", "Black fruit and jammy flavors"]
        a: "Higher acidity and lower alcohol"
        explain: "Less heat means less sugar (so less alcohol) and more acid retained in the grapes. Cool-climate wines tend to be lighter, crisper and more aromatic, such as Chablis or Mosel Riesling."
      - tf: "Weather explains why the same wine can vary from vintage to vintage."
        truth: true
        explain: "A cold spring, a hot summer or autumn rain can change a vintage. That is why vintages matter most in marginal climates."
      - choice: "How do high-altitude vineyards in hot countries keep wines fresh?"
        options: ["Cooler temperatures at altitude", "More rainfall", "Less sunlight", "Richer soils"]
        a: "Cooler temperatures at altitude"
        explain: "High-altitude vineyards stay cooler: Argentina's Mendoza vineyards sit at 800–1,500 m, where cool nights preserve acidity and color, even though days are hot. Every 100 m of altitude cools it by about 0.6 °C."
        visual: "map:argentina:uco-valley"
      - blank: "Warm-climate Chardonnay tastes of tropical fruit; cool-climate Chardonnay tastes of green ___ and citrus."
        visual: "grape:chardonnay"
        answers: [apple]
        options: [pepper, olive, banana]
        explain: "The same grape can taste very different depending on how much warmth it receives: cool-climate Chardonnay shows green apple and citrus, while warm-climate Chardonnay tastes of peach and tropical fruit."
  - title: Terroir
    cards:
      - learn: A sense of place
        visual: "map:france"
        body: |
          **Terroir** is everything about a site: soil, slope, aspect, altitude, climate and water. In Burgundy, neighboring vineyards a few meters apart can make very different wines.
      - learn: Slopes, soil and water
        visual: "photo:douro-terraces"
        body: |
          - **Slopes** facing the sun (south in the north, north in the south) get more heat.
          - **Well-drained soils** (gravel, slate, chalk) stress vines gently, giving smaller, more concentrated berries.
          - **Stony soils** store heat and release it at night.
          - Too much water gives big, diluted grapes.
      - choice: "In the Northern Hemisphere, which slope direction receives the most sun?"
        options: [South-facing, North-facing, East only, It makes no difference]
        a: South-facing
        explain: "South-facing slopes catch more direct sunlight, which is vital in cool regions like the Mosel and Burgundy."
      - tf: "Terroir includes soil, slope and local climate."
        truth: true
        explain: "Terroir is the whole natural environment of a vineyard: soil, slope, aspect and climate, and many add the human traditions of a place. It is the reason the same grape tastes different from one hillside to the next."
      - choice: "Why are well-drained gravel soils prized in the Médoc?"
        options: ["They drain water and store heat", "They are rich in nutrients", "They keep vines very wet", "They block sunlight"]
        a: "They drain water and store heat"
        visual: "map:france:haut-medoc"
        explain: "Gravel warms up and drains quickly, which helps late-ripening Cabernet Sauvignon ripen fully and keeps the vine's roots from sitting in water. That is why the best Médoc châteaux sit on the gravel mounds beside the Gironde."
      - blank: "The Mosel's steep slate slopes absorb and reflect ___ onto the vines."
        answers: [heat]
        options: [rain, fog, shade]
        explain: "The Mosel's steep slate slopes absorb and reflect heat onto the vines. In such a northerly region, every bit of warmth counts, so the best vineyards face south, along the river."
        visual: "map:germany:mosel"
  - title: Going further
    cards:
      - learn: The growing season
        visual: diagram:vine-cycle
        body: 'In the Northern Hemisphere: **budburst** in spring (March–April), **flowering** in early summer, **véraison** (grapes soften and change color) in midsummer, and **harvest** from September to October.
      
      
          Spring frost at budburst and rain at flowering are among the biggest risks to a crop.
      
          '
      - learn: Sun, slope and water
        visual: "photo:vineyard-autumn"
        body: 'South-facing slopes (north-facing in the Southern Hemisphere) catch more sun. Rivers and lakes reflect light and moderate temperature extremes.
      
      
          Poor, well-drained soils make vines struggle a little, giving smaller crops with more concentrated flavor.
      
          '
      - choice: What is 'véraison'?
        options:
        - When grapes soften and change color
        - The first leaves appearing
        - The grape harvest
        - Pruning in winter
        a: When grapes soften and change color
        explain: "Véraison is when black grapes turn from green to purple and sugar starts to build, about 40 to 50 days before harvest. Growers often thin crops then, to concentrate flavor in the remaining bunches."
      - tf: Spring frost is a major risk around budburst.
        truth: true
        explain: Young shoots are easily killed by frost; growers use wind machines, sprinklers or candles to protect them.
      - match: Match the stage to its season (Northern Hemisphere)
        pairs:
        - - Budburst
          - Spring
        - - Flowering
          - Early summer
        - - Véraison
          - Midsummer
        - - Harvest
          - Autumn
        explain: "The vine's yearly cycle drives the whole calendar of a wine region: budburst in spring, flowering in late spring, véraison in late summer and harvest in autumn. Frost in spring and rain at harvest are the biggest risks."
      - choice: Why are poor, well-drained soils often prized for vines?
        options:
        - Lower yields with more concentrated grapes
        - They make vines grow faster
        - They prevent all diseases
        - They add sugar to the grapes
        a: Lower yields with more concentrated grapes
        explain: "Vines that struggle a little put their energy into fewer, more flavorful grapes. Rich, fertile soil makes leafy vines and diluted fruit, while poor, well-drained soils such as gravel or slate stress the vine in a good way."
      - blank: In the Northern Hemisphere, the best vineyard slopes usually face ___.
        answers:
        - south
        options:
        - north
        - east only
        - downward
        - the sea always
        explain: "In the Northern Hemisphere, south-facing slopes get the most sun, helping grapes ripen in cool climates. In the Southern Hemisphere, it is the reverse: north-facing slopes get the most sun."

title: Rhône, Loire, Alsace & Champagne
summary: "France beyond Bordeaux and Burgundy, in depth."
icon: map
lessons:
  - title: Northern vs Southern Rhône
    cards:
      - learn: Two different worlds
        visual: "map:france"
        body: |
          - **Northern Rhône**: moderate continental climate, steep **granite** terraces, **Syrah** alone (sometimes with a little white grape co-fermented). Côte-Rôtie, Hermitage, Cornas, Saint-Joseph, Crozes-Hermitage, plus Viognier in Condrieu.
          - **Southern Rhône**: Mediterranean heat, the **Mistral** wind, **Grenache**-led blends. Châteauneuf-du-Pape, Gigondas, Vacqueyras, Côtes du Rhône, Tavel rosé.
      - choice: "What is the Mistral?"
        options: ["A cold, dry wind in the Southern Rhône", "A grape variety", "A type of oak", "A sparkling style"]
        a: "A cold, dry wind in the Southern Rhône"
        explain: "The Mistral is a cold, strong wind that blows down the Rhône Valley. It reduces disease pressure and can damage vines, so many old vines are trained as low bush vines, which resist it."
      - choice: "Which Northern Rhône appellation may include Viognier co-fermented with Syrah?"
        options: [Côte-Rôtie, Cornas, Châteauneuf-du-Pape, Tavel]
        a: Côte-Rôtie
        visual: "map:france:cote-rotie"
        explain: "Côte-Rôtie may include up to 20% Viognier co-fermented with Syrah, adding perfume and stabilizing color, though most producers use far less. The effect is a floral lift to the Syrah's dark fruit."
      - tf: "Châteauneuf-du-Pape's galets roulés are large stones that store and radiate heat."
        truth: true
        explain: "Châteauneuf-du-Pape's galets roulés, rounded quartzite pebbles, cover many vineyards. They store heat by day and release it at night, helping Grenache ripen."
        visual: "map:france:chateauneuf-du-pape"
      - match: "Match the appellation to its style"
        pairs: [[Hermitage, Syrah], [Condrieu, Viognier], [Tavel, Rosé], [Gigondas, Grenache blend]]
        explain: "North for single varietals, south for blends and rosé: Hermitage and Côte-Rôtie are Syrah, Condrieu is Viognier, Châteauneuf is a blend, and Tavel is rosé. Place tells you the style."
  - title: The Loire in depth
    cards:
      - learn: Four sections
        visual: "map:france"
        body: |
          - **Pays Nantais**: Muscadet (Melon de Bourgogne), maritime.
          - **Anjou-Saumur**: Chenin (dry Savennières, sweet Coteaux du Layon), Cabernet Franc, sparkling Saumur.
          - **Touraine**: Vouvray, Montlouis, Chinon, Bourgueil.
          - **Central Vineyards**: Sancerre and Pouilly-Fumé (Sauvignon Blanc).
      - choice: "Which Loire sub-region is closest to the Atlantic?"
        options: [Pays Nantais, Central Vineyards, Touraine, Anjou]
        a: Pays Nantais
        explain: "The Pays Nantais, around Nantes, is closest to the Atlantic. Its maritime climate suits Muscadet, made from Melon de Bourgogne, a crisp wine that is perfect with oysters."
      - choice: "Coteaux du Layon is known for…"
        options: ["Sweet Chenin Blanc", "Red Cabernet Franc", "Dry Sauvignon Blanc", "Rosé"]
        a: "Sweet Chenin Blanc"
        explain: "Coteaux du Layon is known for sweet Chenin Blanc. Autumn mists along the Layon river encourage noble rot, and Quarts de Chaume and Bonnezeaux are the top crus."
      - tf: "Sancerre and Pouilly-Fumé face each other across the Loire."
        truth: true
        explain: "Sancerre is on the west bank and Pouilly-sur-Loire on the east, facing each other across the river. Both are Sauvignon Blanc, but Sancerre is on limestone and flint (silex) soils and tends to be crisper."
        visual: "map:france:sancerre,pouilly-fume"
      - blank: "Pouilly-___ is a Loire Sauvignon Blanc; Pouilly-Fuissé is a Burgundy Chardonnay."
        answers: [Fumé]
        options: [Fuissé, Blanc, Gris]
        explain: "Pouilly-Fumé is a Loire Sauvignon Blanc; Pouilly-Fuissé is a Burgundy Chardonnay. The name Fumé refers to the smoky, flinty note from the soil, and it is a classic exam trap."
  - title: Alsace
    cards:
      - learn: Sheltered and dry
        visual: "map:france:alsace"
        body: |
          The **Vosges mountains** cast a rain shadow, making Alsace one of France's driest, sunniest regions. Wines are labeled by grape: **Riesling, Gewurztraminer, Pinot Gris, Muscat** (the four 'noble' grapes for Grand Cru), plus Pinot Blanc and Pinot Noir.

          Special sweet styles: **Vendanges Tardives** (late harvest) and **Sélection de Grains Nobles** (botrytis).
      - choice: "Why is Alsace so dry and sunny for its latitude?"
        options: ["The Vosges mountains create a rain shadow", "It is near the Mediterranean", "It is at high altitude", "Warm ocean currents"]
        a: "The Vosges mountains create a rain shadow"
        explain: "Alsace is dry and sunny for its latitude because the Vosges mountains block westerly rain, leaving the eastern foothills dry. It is one of the driest regions in France, which suits grapes like Riesling."
      - tf: "Alsace wines are usually labeled by grape variety."
        truth: true
        explain: "Unusually for France, the grape name is front and center in Alsace, and the wine comes in tall flûte bottles. This reflects the region's German history, and a Grand Cru label then adds the vineyard."
      - choice: "Sélection de Grains Nobles means…"
        options: ["Botrytized sweet wine", "Dry Grand Cru", "Sparkling wine", "Rosé"]
        a: "Botrytized sweet wine"
        explain: "Sélection de Grains Nobles is made from individually selected noble-rot berries, rich and luscious. It is rarer and sweeter than Vendange Tardive, which is simply a late harvest."
      - match: "Match the Alsace grape to its style"
        pairs: [[Gewurztraminer, Lychee and rose], [Riesling, Dry and steely], [Pinot Gris, Rich and smoky]]
        explain: "Muscat in Alsace is usually dry and grapey, Gewurztraminer is rich and lychee-scented, Riesling is dry and mineral, and Pinot Gris is full and smoky. Alsace is where all four noble grapes shine."
  - title: Champagne in depth
    cards:
      - learn: Assemblage and house style
        visual: "map:france"
        body: |
          Champagne is about **blending** (assemblage): grapes, villages and **reserve wines** from older vintages create a consistent non-vintage house style.

          Villages are rated: **17 Grand Cru** and **42 Premier Cru**. Growers' own Champagnes ('grower Champagne') bear **RM** on the label; big houses use **NM**.
      - learn: Sweetness ladder
        visual: "diagram:sweetness"
        body: |
          From driest: **Brut Nature** (0–3 g/L), **Extra Brut**, **Brut** (under 12), **Extra Dry**, **Sec**, **Demi-Sec**, **Doux** (over 50).
      - choice: "What do reserve wines give non-vintage Champagne?"
        options: ["Consistency and complexity across years", "More bubbles", "Pink color", "Higher acidity only"]
        a: "Consistency and complexity across years"
        explain: "Reserve wines, older wines from previous years, are blended in to smooth out vintage variation and add depth. It lets a house keep a consistent style each year, which is the art of non-vintage Champagne."
      - choice: "Which is the driest sweetness term?"
        options: [Brut Nature, Brut, Extra Dry, Demi-Sec]
        a: Brut Nature
        explain: "Brut Nature is the driest: no sugar added at dosage, 0–3 g/L. Extra Brut has up to 6 g/L, and Brut up to 12."
      - tf: "'RM' on a Champagne label means the grower made the wine from their own grapes."
        truth: true
        explain: "RM means Récoltant-Manipulant: a grower who makes Champagne from their own grapes. NM (Négociant-Manipulant) is a house that buys grapes, so RM wines can show more of a single place."
      - blank: "Champagne has ___ Grand Cru villages."
        answers: ["17"]
        options: ["33", "7", "42"]
        explain: "Champagne has 17 Grand Cru villages, including Aÿ, Bouzy, Cramant, Avize and Le Mesnil-sur-Oger. The Grand Cru rating applies to the village, not to individual vineyards."
  - title: Going further
    cards:
      - learn: Champagne houses and growers
        visual: "photo:champagne-vineyards"
        body: 'Big **houses** (négociants) buy grapes from many villages and blend for a consistent house style. **Grower Champagnes** come from a single estate''s own vines, showing their village''s character. Look for "RM" (récoltant-manipulant) on the label.
      
          '
      - learn: The Loire's many faces
        visual: "photo:grape-chenin"
        body: 'From the Atlantic inland: **Muscadet** (Melon), **Anjou-Saumur** (Chenin Blanc, Cabernet Franc), **Touraine** (Vouvray Chenin, Chinon Cabernet Franc) and the **Centre** (Sancerre and Pouilly-Fumé Sauvignon Blanc).
      
          '
      - choice: What does 'RM' on a Champagne label mean?
        options:
        - A grower making wine from their own grapes
        - A large house blend
        - A rosé Champagne
        - A vintage Champagne
        a: A grower making wine from their own grapes
        explain: "Récoltant-Manipulant: the same family grows, makes and bottles the wine. These grower Champagnes are often more distinct and cheaper than the big houses."
      - match: Match the Loire wine to its grape
        pairs:
        - - Vouvray
          - Chenin Blanc
        - - Chinon
          - Cabernet Franc
        - - Sancerre
          - Sauvignon Blanc
        - - Muscadet
          - Melon de Bourgogne
        explain: "The Loire grows mostly single varieties, each in its own district: Sauvignon Blanc in Sancerre, Chenin Blanc in Vouvray, Cabernet Franc in Chinon, and Melon de Bourgogne in Muscadet."
      - tf: Alsace wines are usually labeled with the grape variety.
        truth: true
        explain: "Unusually for France, Alsace names the grape: Riesling, Gewurztraminer, Pinot Gris. Most other French regions name the place, so Alsace is a bridge between Old and New World labeling."
      - choice: Which southern French region is known for Grenache-based Banyuls and Côtes du Roussillon?
        options:
        - Roussillon
        - Alsace
        - Jura
        - Savoie
        a: Roussillon
        explain: "Roussillon, next to the Pyrenees, makes powerful Grenache-based reds and sweet fortified wines such as Banyuls and Maury. The fortified wines are made like Port, but with Grenache."
      - blank: Jura's oxidative 'yellow wine' is called vin ___.
        answers:
        - jaune
        options:
        - doux
        - santo
        - gris
        - rouge
        explain: "Vin jaune ages under a veil of yeast for over six years in barrel, like a French cousin of Fino sherry. It is bottled in a special 62 cl bottle called a clavelin, and the best known is Château-Chalon."

title: Tasting in depth
summary: "Structured assessment, quality, readiness and faults: thinking like a sommelier."
icon: checkmark.seal
lessons:
  - title: The structured approach
    cards:
      - learn: Measuring precisely
        visual: "photo:wine-pour"
        body: |
          At an advanced level, each structural element gets a precise scale:

          - Acidity, tannin, body and finish: **low, medium−, medium, medium+, high**.
          - Alcohol: low (under 11%), medium, high (14%+).
          - Tannin also has a **nature**: ripe or unripe, fine-grained or coarse.

          Precise structure narrows down grape and origin much faster than aromas alone.
      - learn: Development
        visual: "wheel"
        body: |
          - **Youthful**: only primary (and secondary) aromas.
          - **Developing**: tertiary notes appear alongside fresh fruit.
          - **Fully developed**: mostly tertiary aromas.
          - **Tired**: fruit fading, drying out.
      - choice: "A wine showing fresh fruit with some leather and earth is…"
        options: [Developing, Youthful, Tired, Faulty]
        a: Developing
        explain: "Tertiary notes (leather, earth, mushroom) alongside primary fruit mean the wine is on its way to maturity. Primary aromas come from the grape, secondary from winemaking, and tertiary from age."
      - choice: "High acidity, high tannin, pale garnet, tar and roses suggests…"
        options: [Nebbiolo, Merlot, Grenache, Gamay]
        a: Nebbiolo
        explain: "High acidity, high tannin, pale garnet and tar and roses suggest Nebbiolo. Its unusual mix of pale color and fierce structure is a giveaway, so look for it in Barolo and Barbaresco."
      - tf: "Unripe tannins tend to feel green, coarse and astringent."
        truth: true
        explain: "Unripe tannins tend to feel green, coarse and astringent. Ripe tannins feel fine-grained and silky, so tannin texture is a clue to grape ripeness and winemaking."
      - blank: "Alcohol above about ___% is described as high."
        answers: ["14"]
        options: ["10", "8", "11"]
        explain: "Alcohol above about 14% is described as high. Below 11% is low, and 11–13.9% is medium. High alcohol shows as warmth and weight on the finish."
  - title: Quality & readiness
    cards:
      - learn: BLIC in practice
        visual: "flow:blic"
        body: |
          - **Balance**: fruit vs acid vs tannin vs alcohol vs sweetness.
          - **Length**: medium+ or long for good wine.
          - **Intensity**: pronounced aromas and flavors.
          - **Complexity**: many layers: primary, secondary, tertiary.

          Then decide readiness: **too young**, **can drink now but has potential**, **drink now**, or **too old**.
      - choice: "A wine with intense fruit, high tannin and high acidity that is still very primary is probably…"
        options: ["Too young / has ageing potential", "Too old", "Faulty", "Ready and at its peak"]
        a: "Too young / has ageing potential"
        explain: "Concentrated fruit plus structure is what allows a wine to improve with age: a wine with intense fruit, high tannin and high acidity, still very primary, is probably young and needs time. Fruit will fade slowly, while tannin and acid preserve it."
      - tf: "A short finish is a sign of outstanding quality."
        truth: false
        explain: "Great wines have long, complex finishes, so a short finish is a sign of a simple wine. Length is one of the four BLIC markers."
      - match: "Match each BLIC element to its question"
        pairs: [[Balance, "Does anything stick out?"], [Length, "How long does it last?"], [Intensity, "How powerful are the flavors?"], [Complexity, "How many layers are there?"]]
        explain: "Four simple questions behind every professional quality call: Is it balanced? How long is the finish? How intense are the aromas and flavors? Is it complex? A wine that answers well to all four is high quality."
      - choice: "Which wine is most likely to improve with bottle age?"
        options: ["Grand Cru Burgundy", "Beaujolais Nouveau", "Pinot Grigio", "Prosecco"]
        a: "Grand Cru Burgundy"
        explain: "Concentration, acidity and structure let a wine evolve for decades; the others are made to drink young. A tannic, high-acid, concentrated red like Barolo or Bordeaux has more to give with time."
  - title: Faults
    cards:
      - learn: When wine goes wrong
        visual: "photo:winery-lab"
        body: |
          - **TCA (cork taint)**: musty, damp cardboard, muted fruit.
          - **Oxidation**: brownish, flat, bruised apple.
          - **Reduction**: struck match, rotten egg, rubber; sometimes fixed by aeration.
          - **Brettanomyces**: barnyard, sticking plaster, sweaty saddle.
          - **Volatile acidity (VA)**: vinegar, nail-varnish remover.
          - **Heat damage**: cooked, stewed fruit.
      - choice: "A wine smelling of nail-varnish remover and vinegar has…"
        options: [Volatile acidity, Cork taint, Reduction, Brettanomyces]
        a: Volatile acidity
        explain: "Nail-varnish remover and vinegar smells come from acetic acid and ethyl acetate, usually from bacteria and oxygen exposure. The wine is spoiled, and it will not improve."
      - choice: "Struck-match or rotten-egg aromas indicate…"
        options: [Reduction, Oxidation, Cork taint, Heat damage]
        a: Reduction
        explain: "Sulfur compounds form when wine lacks oxygen during winemaking. Mild cases blow off with swirling or decanting."
      - tf: "Brettanomyces can give barnyard and sticking-plaster aromas."
        truth: true
        explain: "Brettanomyces can give barnyard and sticking-plaster aromas. A little can add complexity for some drinkers, but a lot strips the fruit, and the smell can be considered a fault."
      - match: "Match the fault to its smell"
        pairs: [[TCA, Damp cardboard], [Oxidation, Bruised apple], [Brettanomyces, Barnyard], [Reduction, Struck match]]
        explain: "Recognizing faults is part of every sommelier's training: cork taint smells of damp cardboard, oxidation of bruised apple and sherry, volatile acidity of vinegar, and Brett of barnyard."
  - title: Going further
    cards:
      - learn: Assessing readiness
        visual: "photo:decanter"
        body: 'Ask: is the wine **too young** (tight, primary fruit, firm tannin), **ready** (fruit and developing notes in balance), or **past its best** (fading fruit, drying tannin)?
      
      
          Long-lived wines need the structure to age: acidity, tannin or sugar, plus concentrated fruit.
      
          '
      - learn: Deductive tasting
        visual: "flow:deduction"
        body: 'Blind tasters reason from clues. High acid and light color suggest a cool climate. Deep color, ripe black fruit and high alcohol suggest warmth. Vanilla and toast suggest new oak; leather and earth suggest age.
      
          '
      - choice: Which wine is most likely from a cool climate?
        options:
        - Pale, high acidity, citrus fruit
        - Deep, high alcohol, jammy fruit
        - Low acidity, tropical fruit
        - Dark, raisined, very ripe
        a: Pale, high acidity, citrus fruit
        explain: "Cool climates keep acidity and give leaner, fresher fruit with lower alcohol. A tart, light-bodied wine with green apple or red cherry points to a cool place like Chablis, Mosel or the Loire."
      - match: Match the clue to what it suggests
        pairs:
        - - Vanilla and toast
          - New oak
        - - Leather and earth
          - Bottle age
        - - Jammy fruit
          - Warm climate
        - - Green bell pepper
          - Unripe Cabernet
        explain: "Each clue narrows down the grape, place and winemaking: pale color suggests thin skins, pepper suggests Syrah, buttery notes suggest malolactic fermentation. Collect clues and then decide."
      - tf: Wines with high acidity or tannin often age well.
        truth: true
        explain: "Structure protects a wine while its fruit slowly evolves. Acidity and tannin act like preservatives, which is why the Mosel Riesling and Barolo can last for decades."
      - choice: A red tastes of dried fruit, leather and has drying tannin. It is probably…
        options:
        - Past its best
        - Too young
        - Unoaked
        - Carbonic
        a: Past its best
        explain: "Fading fruit and drying tannin are signs a wine has passed its peak. When the fruit has faded, the tannin and acidity are left behind, and the wine tastes thin and hard."
      - blank: Concentration of flavor, balance, length and complexity together judge a wine's ___.
        answers:
        - quality
        options:
        - vintage
        - price
        - color
        - sweetness
        explain: "Balance, length, intensity and complexity (BLIC) together judge a wine's quality. Using the same four factors for every wine lets you compare them objectively."

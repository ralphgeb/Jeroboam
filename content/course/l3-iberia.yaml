title: Spain & Portugal
summary: "Rioja and Ribera, Spain's diverse regions, and Portugal from Vinho Verde to the Douro."
icon: sun.max
lessons:
  - title: Rioja & Ribera del Duero
    cards:
      - learn: Rioja
        visual: "map:spain:rioja"
        body: |
          Along the **Ebro**, sheltered by mountains. Three zones: cooler **Rioja Alta** and **Rioja Alavesa**, warmer **Rioja Oriental**.

          **Tempranillo** leads, with Garnacha, Graciano and Mazuelo (Carignan). Traditional producers age long in American oak; modern ones use French oak, riper fruit and single vineyards.
      - learn: Ribera del Duero
        visual: "map:spain:ribera-del-duero"
        body: |
          A high plateau (about 750–850 m) along the Duero. Hot days and very cold nights produce deep, powerful **Tinto Fino** (Tempranillo). Vega Sicilia and Pingus are icons.
      - choice: "Which Rioja zone is the warmest?"
        options: [Rioja Oriental, Rioja Alta, Rioja Alavesa, All are equal]
        a: Rioja Oriental
        explain: "Rioja Baja is the warmest zone, lower and more Mediterranean, so it suits Garnacha. Rioja Alta and Alavesa are cooler and higher and make the finer, more acidic Tempranillo."
      - tf: "Ribera del Duero's vineyards are at high altitude, giving cold nights."
        truth: true
        explain: "Ribera del Duero's vineyards are at high altitude (about 800 m), giving cold nights. Frost is a risk, but the big difference between day and night keeps acidity and color in the Tempranillo (Tinto Fino)."
      - choice: "Mazuelo, used in Rioja, is better known as…"
        options: [Carignan, Grenache, Merlot, Mourvèdre]
        a: Carignan
        explain: "Mazuelo is Cariñena (Carignan) in other places. It adds acidity, color and tannin to Rioja blends, and is the same grape that makes old-vine wines in Priorat."
      - blank: "A red Rioja Reserva must age at least ___ years, one in oak."
        answers: ["three"]
        options: ["five", "one", "ten"]
        explain: "A red Rioja Reserva must age at least three years, one in oak. Crianza needs two years (one in oak); Gran Reserva needs five (two in oak). The label tells you how long it spent in cask and bottle."
  - title: Spain's other stars
    cards:
      - learn: From Galicia to Andalucía
        visual: "map:spain"
        body: |
          - **Rías Baixas**: Albariño. **Rueda**: Verdejo. **Bierzo**: Mencía.
          - **Priorat**: old-vine Garnacha and Cariñena on llicorella slate.
          - **Penedès**: Cava (Macabeo, Xarel·lo, Parellada).
          - **La Mancha**: the huge central plain. **Jumilla**: Monastrell.
          - **Jerez**: Sherry.
      - choice: "Priorat's famous slate soil is called…"
        options: [Llicorella, Albariza, Terra rossa, Galets]
        a: Llicorella
        visual: "map:spain:priorat"
        explain: "Dark, crumbly slate that forces roots deep and gives low yields of intense wine. Albariza is the white chalk of Jerez."
      - match: "Match the Spanish region to its signature grape"
        pairs: [[Rueda, Verdejo], [Bierzo, Mencía], [Jumilla, Monastrell], [Rías Baixas, Albariño]]
        explain: "Spain is far more than Tempranillo: Albariño in Rías Baixas, Verdejo in Rueda, Garnacha in Priorat, Mencía in Bierzo. Each region leans on a local hero grape."
      - tf: "Albariza is the chalky white soil of the Sherry region."
        truth: true
        explain: "Albariza, the chalky white soil of the Sherry region around Jerez, holds winter rain like a sponge and bakes into a hard crust in summer. That water keeps Palomino vines alive through the dry summers."
      - choice: "Which grapes make Cava?"
        options: ["Macabeo, Xarel·lo and Parellada", "Palomino and PX", "Albariño and Verdejo", "Glera and Chardonnay"]
        a: "Macabeo, Xarel·lo and Parellada"
        explain: "Cava is made from Macabeo, Xarel·lo and Parellada, with Chardonnay and Pinot Noir also permitted. The local trio gives a lemony, earthy, rounder style than Champagne."
  - title: Portugal
    cards:
      - learn: The Douro and beyond
        visual: "map:portugal"
        body: |
          - **Vinho Verde**: rainy north-west; fresh, light whites, Alvarinho at its best.
          - **Douro**: hot schist terraces; Port and powerful dry reds from Touriga Nacional, Touriga Franca and Tinta Roriz.
          - **Dão**: granite plateau, elegant reds. **Bairrada**: Baga.
          - **Alentejo**: hot plains; ripe reds; cork forests.
      - choice: "The Douro's vineyards grow on…"
        options: ["Steep schist terraces", "Flat sandy plains", "Chalk hills", "Volcanic islands"]
        a: "Steep schist terraces"
        visual: "map:portugal:douro"
        explain: "The Douro's vineyards grow on schist, which breaks into layers that let vine roots dig deep for water in the hot, dry summers. Steep terraces were cut by hand, and they are now a UNESCO World Heritage Site."
      - tf: "Portugal is the world's largest producer of cork."
        truth: true
        explain: "Portugal is the world's largest producer of cork, mostly from cork oak forests in the Alentejo. The bark is harvested every nine years without felling the tree."
      - choice: "Which grape is considered Portugal's finest black variety?"
        options: [Touriga Nacional, Baga, Tempranillo, Castelão]
        a: Touriga Nacional
        explain: "Touriga Nacional is considered Portugal's finest black grape: deep, floral and structured. It is key to both Port and Douro reds, and also grows well in Dão."
      - blank: "LBV Port stands for Late Bottled ___."
        answers: [Vintage]
        options: [Valley, Variety, Velvet]
        explain: "LBV Port stands for Late Bottled Vintage: a single-vintage Port aged 4–6 years in wood, ready to drink sooner than Vintage Port. It is a better-value alternative that doesn't need decanting in many cases."
  - title: Going further
    cards:
      - learn: Rioja's subregions
        visual: "photo:grape-tempranillo"
        body: 'Rioja has three parts: **Rioja Alta** (cooler, elegant), **Rioja Alavesa** (limestone, finesse) and **Rioja Oriental** (warmer, Garnacha-rich). Traditional producers age in American oak; modern ones favor French oak and riper fruit.
      
          '
      - learn: Port styles
        visual: "photo:port-lodge"
        body: '**Ruby** and **Vintage** Port age mostly in bottle and stay deep red with black fruit. **Tawny** ages in small casks, turning amber with nutty, caramel notes; 10, 20, 30 and 40 Year Old labels give an average age.
      
          '
      - choice: Which Port style ages in small casks and turns amber?
        options:
        - Tawny
        - Ruby
        - Vintage
        - White Port
        a: Tawny
        explain: "Tawny Port ages in small casks, where oxygen through the wood turns it amber and gives nutty, caramel flavors. Ruby Port is kept in tanks and bottle, so it remains red and fruity."
      - match: Match the Spanish region to its signature grape
        pairs:
        - - Ribera del Duero
          - Tempranillo
        - - Rías Baixas
          - Albariño
        - - Priorat
          - Garnacha
        - - Jerez
          - Palomino
        explain: "Spain's regions each lean on a local hero grape: Tempranillo in Rioja, Garnacha in Priorat, Albariño in Rías Baixas, Palomino in Jerez. Learning the pairs is key to blind tasting Spain."
      - tf: American oak gives stronger coconut and vanilla notes than French oak.
        truth: true
        explain: "American oak gives stronger coconut and vanilla notes than French oak, because it has more lactones. That is why traditional Rioja often smells of vanilla and coconut, while modern Riojas use more French oak."
      - choice: What does '20 Year Old' on a Tawny Port mean?
        options:
        - A blend with an average age of about 20 years
        - Every drop is exactly 20 years old
        - The vines are 20 years old
        - It must be drunk within 20 years
        a: A blend with an average age of about 20 years
        explain: "A 20 Year Old Tawny is a blend of casks that tastes like the stated age, not a wine that spent exactly 20 years in wood. The stated ages are 10, 20, 30 and 40."
      - blank: Priorat's dark slate and quartz soil is called ___.
        answers:
        - llicorella
        options:
        - albariza
        - galestro
        - schist only
        - terra rossa
        explain: "Llicorella, Priorat's dark slate and quartz soil, forces vine roots deep and gives the wines their mineral intensity. The steep terraces and old Garnacha and Cariñena vines yield tiny crops."

title: Bordeaux
summary: "Left Bank, Right Bank, the 1855 Classification and Sauternes."
icon: building.columns
lessons:
  - title: The Left Bank
    cards:
      - learn: Gravel and Cabernet
        visual: "map:france:medoc,haut-medoc,pessac-leognan,graves"
        body: |
          West of the Gironde estuary and the Garonne river lie the **Médoc** and **Graves**. Deep **gravel** banks drain well and store heat, ideal for late-ripening **Cabernet Sauvignon**, which leads the blends.

          The Haut-Médoc holds four famous communes, north to south: **Saint-Estèphe**, **Pauillac**, **Saint-Julien** and **Margaux**. In the Graves, the top area, **Pessac-Léognan**, makes both great reds (Haut-Brion) and fine oaked dry whites.
      - learn: The communes
        visual: "map:france:saint-estephe,pauillac,saint-julien,margaux"
        body: |
          - **Saint-Estèphe**: more clay, firmer, more rustic.
          - **Pauillac**: powerful; three First Growths.
          - **Saint-Julien**: balanced and consistent.
          - **Margaux**: perfumed and silky.
      - choice: "Which commune is home to three First Growths: Lafite, Latour and Mouton?"
        options: [Pauillac, Margaux, Saint-Julien, Saint-Estèphe]
        a: Pauillac
        visual: "map:france:pauillac"
        explain: "Pauillac is the heart of the Médoc's greatest Cabernet. The other First Growths are Château Margaux and Haut-Brion (Pessac-Léognan)."
      - choice: "Which is the northernmost of the four famous Haut-Médoc communes?"
        options: [Saint-Estèphe, Margaux, Pauillac, Saint-Julien]
        a: Saint-Estèphe
        explain: "From north to south the four famous Haut-Médoc communes are Saint-Estèphe, Pauillac, Saint-Julien and Margaux. Pauillac, in the middle, holds three of the five First Growths (Lafite, Latour and Mouton), so it is the most powerful, long-lived Cabernet."
      - tf: "Merlot is the dominant grape in most top Left Bank blends."
        visual: "grape:merlot"
        truth: false
        explain: "On the Left Bank, Cabernet Sauvignon usually leads the blend, thanks to the gravel soils. Merlot dominates on the Right Bank (Pomerol and Saint-Émilion), where clay and limestone suit it better."
      - choice: "Which Left Bank area makes both top reds and fine oaked dry whites?"
        options: [Pessac-Léognan, Pauillac, Saint-Émilion, Médoc]
        a: Pessac-Léognan
        visual: "map:france:pessac-leognan"
        explain: "Pessac-Léognan, on the southern edge of Bordeaux city, makes both top reds and fine oaked dry whites from Sauvignon Blanc and Sémillon. Haut-Brion and Domaine de Chevalier are the benchmarks, and it is the only place where reds and whites are both classified."
  - title: The Right Bank & beyond
    cards:
      - learn: Clay, limestone and Merlot
        visual: "map:france:saint-emilion,pomerol,fronsac,castillon"
        body: |
          East of the Dordogne, cooler **clay and limestone** soils suit early-ripening **Merlot**, blended with **Cabernet Franc**.

          - **Saint-Émilion**: a limestone plateau and slopes around a medieval town.
          - **Pomerol**: a small clay-and-gravel plateau; Pétrus and Le Pin.
          - Satellites: Fronsac, Castillon, Bourg, Blaye.
      - learn: Entre-Deux-Mers
        visual: "map:france:entre-deux-mers"
        body: |
          Between the Garonne and Dordogne lies **Entre-Deux-Mers** ("between two seas": the two tidal rivers), best known for fresh, dry whites from Sauvignon Blanc and Sémillon. Much of the region's generic Bordeaux AOC red comes from here too.
      - choice: "Which grape partners Merlot on the Right Bank?"
        options: [Cabernet Franc, Syrah, Malbec, Petit Verdot]
        a: Cabernet Franc
        explain: "Cabernet Franc adds fragrance and structure to Merlot on the Right Bank. Château Cheval Blanc in Saint-Émilion is famously rich in Cabernet Franc, which ripens well on its gravelly soils."
      - tf: "Pomerol has an official classification of its châteaux."
        visual: "map:france:pomerol"
        truth: false
        explain: "Pomerol has no official classification, yet Pétrus and Le Pin are among the most expensive wines in the world. Tiny estates and a proven track record of clay-grown Merlot let reputation, not a ranking, set the price."
      - blank: "'Entre-Deux-Mers' means between two ___."
        answers: [seas]
        options: [rivers, hills, châteaux]
        explain: "Entre-Deux-Mers means between two seas, though the seas are really the tidal Garonne and Dordogne rivers. The area makes fresh, dry whites mainly from Sauvignon Blanc, and good-value reds sold as Bordeaux."
      - match: "Match the soil to the grape it favors"
        pairs: [[Gravel, Cabernet Sauvignon], [Clay, Merlot]]
        explain: "Warm, free-draining gravel helps late-ripening Cabernet Sauvignon, while cool, water-retentive clay suits early-ripening Merlot. In a wet year clay keeps Merlot hydrated, and in a hot year gravel protects Cabernet, so many châteaux plant both."
  - title: Classifications & sweet Bordeaux
    cards:
      - learn: 1855 and after
        visual: "photo:winery-cellar-bottles"
        body: |
          For the Paris Exposition of **1855**, Médoc châteaux (plus Haut-Brion) were ranked from **First** to **Fifth Growth**, based on price. Only one change has ever been made: **Mouton Rothschild** was promoted to First Growth in **1973**.

          Sauternes was classified too, with **Château d'Yquem** alone as *Premier Cru Supérieur*. Saint-Émilion's classification is revised roughly every ten years.
      - learn: Sauternes
        visual: "map:france:sauternes"
        body: |
          Cool morning mists from the little **Ciron** river meet the warmer Garonne, encouraging **noble rot** on Sémillon and Sauvignon Blanc. Pickers make several passes, choosing only botrytized berries.
      - choice: "Which château was promoted to First Growth in 1973?"
        options: [Mouton Rothschild, Lafite Rothschild, Pétrus, Cheval Blanc]
        a: Mouton Rothschild
        explain: "Château Mouton Rothschild was promoted from Second to First Growth in 1973, the only change ever made to the 1855 red classification. Baron Philippe de Rothschild campaigned for it for decades, and his motto changed from 'First I cannot be, second I deign not to be' to 'First I am, second I was'."
      - choice: "What was the 1855 Classification based on?"
        options: [Market price, Soil analysis, Blind tasting, Vineyard size]
        a: Market price
        explain: "In 1855, for the Paris Exposition, brokers ranked the châteaux by the prices their wines fetched at the time. Price then stood for quality and reputation, and the ranking has hardly changed since, though it is a ranking of estates, not of today's wine quality."
      - tf: "Château d'Yquem holds the unique rank of Premier Cru Supérieur in Sauternes."
        truth: true
        explain: "Château d'Yquem holds the unique rank of Premier Cru Supérieur in Sauternes, placed above all other Sauternes in 1855. Its wine is picked berry by berry in several passes, and in poor years nothing is released."
      - blank: "Mists from the cool ___ river help noble rot develop in Sauternes."
        answers: [Ciron]
        options: [Loire, Dordogne, Rhône]
        explain: "The cool Ciron river meets the warmer Garonne, and that contrast creates the autumn morning fog that botrytis needs. The sunny afternoons then dry the grapes so the rot concentrates them instead of spoiling them."
  - title: Going further
    cards:
      - learn: The 1855 Classification
        visual: "photo:bordeaux-chateau"
        body: 'In 1855, Médoc châteaux (plus Haut-Brion in Graves) were ranked into five growths by price. **First Growths**: Lafite, Latour, Margaux, Haut-Brion, and since 1973, Mouton Rothschild.
      
      
          Sauternes was classified at the same time, with Yquem alone at the top.
      
          '
      - learn: Bordeaux's dry whites and sweet wines
        visual: "photo:botrytis"
        body: 'Sauvignon Blanc and Sémillon make crisp whites in Entre-Deux-Mers and serious oaked whites in Pessac-Léognan. In **Sauternes** and **Barsac**, autumn mists from the Ciron river bring noble rot for rich, honeyed sweet wines.
      
          '
      - choice: Which château became a First Growth in 1973?
        options:
        - Mouton Rothschild
        - Latour
        - Margaux
        - Pétrus
        a: Mouton Rothschild
        explain: "Château Mouton Rothschild became a First Growth in 1973: the only change ever made to the 1855 red classification. The other four First Growths are Lafite, Latour, Margaux and Haut-Brion."
      - tf: Pomerol has an official classification like the Médoc.
        visual: "map:france:medoc"
        truth: false
        explain: "Pomerol has no classification, unlike the Médoc and Sauternes, though Pétrus and Le Pin are among the world's most expensive wines. Its tiny estates, nearly all Merlot on clay, rely on reputation."
      - match: Match the appellation to its main grape
        pairs:
        - - Pauillac
          - Cabernet Sauvignon
        - - Pomerol
          - Merlot
        - - Sauternes
          - Sémillon
        - - Entre-Deux-Mers
          - Sauvignon Blanc
        explain: "Left Bank appellations lean Cabernet Sauvignon, Right Bank ones lean Merlot, and the sweet wines of Sauternes lean on Sémillon. The grape tells you the blend and, roughly, the style."
      - choice: What brings noble rot to Sauternes?
        options:
        - Autumn mists from the Ciron river
        - Sea breezes
        - Late frosts
        - Very dry summers
        a: Autumn mists from the Ciron river
        explain: "Misty mornings and sunny afternoons are perfect for botrytis: the damp spreads the fungus, and the sun then dries the grapes so it concentrates, not rots. Not every year works, which is one reason Sauternes is expensive."
      - blank: Château ___ is the only Graves estate in the 1855 classification.
        visual: "map:france:graves"
        answers:
        - Haut-Brion
        options:
        - Pape Clément
        - Pétrus
        - Cheval Blanc
        - Yquem
        explain: "Château Haut-Brion, the only Graves estate in the 1855 classification, was so famous that it was included alongside the Médoc. It is also the oldest of the First Growths, with a fame going back to the 17th century, even in London."

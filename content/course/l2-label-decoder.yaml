title: Label decoder
summary: "Read any bottle: how France, Germany, Italy, Spain, Portugal and the New World label their wines."
icon: tag
lessons:
  - title: Bordeaux & Burgundy labels
    cards:
      - learn: Château first, place second
        visual: "label:bordeaux"
        body: |
          A Bordeaux label names the **château** (the estate), the **appellation** and often a **classification** such as *Grand Cru Classé en 1855*. There's no grape on the front: it's a blend.
      - learn: In Burgundy, the vineyard is king
        visual: "label:burgundy"
        body: |
          Burgundy's hierarchy shows in the name: **Bourgogne** (regional) → **village** (Gevrey-Chambertin) → **Premier Cru** (village + vineyard) → **Grand Cru** (the vineyard alone, e.g. *Chambertin*).
      - choice: "On a Bordeaux label, 'Mis en bouteille au château' means…"
        options: ["Bottled at the estate", "Made from old vines", "Aged in new oak", "A second wine"]
        a: "Bottled at the estate"
        visual: "label:bordeaux"
        explain: "Estate bottling means the wine was made and bottled where the grapes were grown."
      - choice: "Which Burgundy label shows a Grand Cru?"
        options: ["Chambertin", "Gevrey-Chambertin", "Gevrey-Chambertin 1er Cru", "Bourgogne Rouge"]
        a: "Chambertin"
        explain: "Grand Crus appear on their own name. The village name alone (Gevrey-Chambertin) is village level."
      - tf: "Red Burgundy labels usually state 'Pinot Noir' on the front."
        truth: false
        explain: "Place, not grape: red Burgundy is understood to be Pinot Noir, and white is Chardonnay."
      - match: "Match the Burgundy label to its level"
        pairs: [["Bourgogne", Regional], ["Volnay", Village], ["Volnay 1er Cru Clos des Chênes", Premier Cru], ["Le Montrachet", Grand Cru]]
        explain: "The more precise the place, the higher the level."
  - title: Champagne & Alsace labels
    cards:
      - learn: Champagne codes
        visual: "label:champagne"
        body: |
          Look for the **house**, the **style** (Blanc de Blancs, Rosé), the **sweetness** (Brut, Extra Brut…) and the tiny **maker code**: **NM** (a house buying grapes), **RM** (a grower making their own), **CM** (a co-operative).
      - learn: Alsace names the grape
        visual: "label:alsace"
        body: |
          Unusually for France, Alsace puts the **grape** first. *Grand Cru* plus a vineyard name marks the 51 best sites; *Vendanges Tardives* and *Sélection de Grains Nobles* signal sweet wines.
      - choice: "What does 'RM' on a Champagne label tell you?"
        options: ["A grower made it from their own grapes", "It's a rosé", "It's a vintage wine", "It's extra dry"]
        a: "A grower made it from their own grapes"
        explain: "Récoltant-Manipulant: 'grower Champagne'."
      - blank: "On a Champagne label, ___ ___ means it was made only from Chardonnay."
        answers: [Blanc, "de Blancs"]
        options: [Noir, "de Noirs", Brut]
        explain: "'White from whites'. Blanc de Noirs is white wine from black grapes."
      - tf: "Alsace wines are usually labeled with the grape variety."
        truth: true
        explain: "Riesling, Gewurztraminer, Pinot Gris and Muscat are the classic four."
  - title: Germany, Italy, Spain & Port
    cards:
      - learn: German labels
        visual: "label:germany"
        body: |
          Expect a lot of information: **region**, **village + vineyard** (*Wehlener Sonnenuhr*), **grape** and the **Prädikat** ripeness level (Kabinett, Spätlese, Auslese…). **Trocken** means dry.
      - learn: Italy and Spain
        visual: "label:spain"
        body: |
          - **Italy**: denomination (Chianti Classico, Barolo), category **DOCG/DOC/IGT**, and ageing terms (*Riserva*, *Gran Selezione*).
          - **Spain**: region (Rioja) and the ageing ladder **Joven → Crianza → Reserva → Gran Reserva**. *Cosecha* = vintage.
      - learn: Port
        visual: "label:port"
        body: |
          The style is everything: **Ruby**, **LBV**, **Vintage**, or **Tawny** with an age (10, 20, 30, 40 years).
      - choice: "On 'Wehlener Sonnenuhr', what is Sonnenuhr?"
        options: ["The vineyard", "The grape", "The producer", "The sweetness level"]
        a: "The vineyard"
        visual: "label:germany"
        explain: "Wehlen is the village (adding -er), Sonnenuhr ('sundial') the vineyard."
      - choice: "Which Spanish term means the longest ageing?"
        options: ["Gran Reserva", "Crianza", "Joven", "Cosecha"]
        a: "Gran Reserva"
        explain: "Red Rioja Gran Reserva: at least five years, two in oak. Cosecha just means vintage."
      - match: "Match the label word to its meaning"
        pairs: [[Trocken, Dry], [Cosecha, Vintage], [Imbottigliato all'origine, Estate bottled], [Bodega, Winery]]
        explain: "A small vocabulary unlocks most European labels."
      - tf: "A '20 Years Old Tawny' Port is made only from wine harvested exactly 20 years ago."
        truth: false
        explain: "It's an indication of age: a blend whose character matches about 20 years in cask."
  - title: New World labels
    cards:
      - learn: Brand, grape, place
        visual: "label:napa"
        body: |
          New World labels lead with the **brand** and the **grape**, then the region: an **AVA** in the USA, a **GI** in Australia, **WO** in South Africa.

          In the USA, a named grape means ≥75% of it, a named AVA ≥85% of grapes from there, a vintage ≥95% from that year.
      - learn: Words without legal meaning
        visual: "label:australia"
        body: |
          "Reserve", "Old Vine" and "Special Selection" usually have **no legal definition** in the New World. They're the producer's own promise.
      - choice: "On a US label, a named AVA means at least what share of grapes came from there?"
        options: ["85%", "50%", "75%", "100%"]
        a: "85%"
        explain: "For a named grape the US minimum is 75%; for an AVA, 85%."
      - tf: "'Reserve' on a Californian wine is a legally defined quality level."
        truth: false
        explain: "It's a producer term. In Spain and Italy, Reserva/Riserva *are* legally defined."
      - choice: "What does GI stand for on an Australian label?"
        options: ["Geographical Indication", "Grape Identity", "Grand Imperial", "Guaranteed Import"]
        a: "Geographical Indication"
        visual: "label:australia"
        explain: "Australia's system of zones, regions and subregions."
  - title: Going further
    cards:
      - learn: Château, Domaine, Bodega
        visual: "photo:bordeaux-chateau"
        body: 'The producer''s name often starts with a word for estate: **Château** (Bordeaux), **Domaine** (Burgundy and elsewhere in France), **Bodega** (Spain), **Weingut** (Germany, Austria), **Quinta** (Portugal) and **Tenuta** (Italy).
      
          '
      - learn: Burgundy's ladder
        visual: "photo:burgundy-cote"
        body: 'Burgundy labels climb a ladder: **Bourgogne** (regional), **village** (e.g. Gevrey-Chambertin), **Premier Cru** (a named vineyard plus the village) and **Grand Cru** (the vineyard name alone, e.g. Chambertin).
      
          '
      - choice: On a Burgundy label, which level shows only the vineyard name?
        options:
        - Grand Cru
        - Premier Cru
        - Village
        - Regional
        a: Grand Cru
        explain: 'Grand Crus are so famous they stand alone: Montrachet, Chambertin, Romanée-Conti.'
      - match: Match the estate word to its country
        pairs:
        - - Quinta
          - Portugal
        - - Bodega
          - Spain
        - - Weingut
          - Germany
        - - Tenuta
          - Italy
        explain: Knowing these words helps you find the producer on any label.
      - tf: '''Mis en bouteille au château'' means bottled at the estate.'
        truth: true
        explain: Estate bottling shows the same property grew the grapes and bottled the wine.
      - choice: In Germany, which word tells you about ripeness at harvest?
        options:
        - Spätlese
        - Weingut
        - Trocken
        - Gutsabfüllung
        a: Spätlese
        explain: Kabinett, Spätlese and Auslese are Prädikat levels based on grape ripeness.
      - blank: In Rioja, a wine aged at least two years, one in oak, is labeled ___.
        answers:
        - Crianza
        options:
        - Joven
        - Gran Reserva
        - Cosecha
        explain: Crianza red Rioja spends at least two years ageing, with at least one in oak.

title: Germany, Austria, Hungary & Greece
summary: "Prädikat levels, Austrian classics, Tokaji and Greece's revival."
icon: mountain.2
lessons:
  - title: Germany
    cards:
      - learn: Ripeness levels
        visual: "map:germany"
        body: |
          German **Prädikatswein** is classified by grape sugar at harvest:

          - **Kabinett**: light, often off-dry.
          - **Spätlese**: late harvest, riper.
          - **Auslese**: selected bunches.
          - **Beerenauslese (BA)**: selected berries, often botrytized.
          - **Eiswein**: frozen grapes.
          - **Trockenbeerenauslese (TBA)**: shriveled botrytized berries.

          A ripeness level is not a sweetness level: a Spätlese can be **trocken** (dry).
      - choice: "Which Prädikat is made from individually picked shriveled, botrytized berries?"
        options: [Trockenbeerenauslese, Kabinett, Spätlese, Auslese]
        a: Trockenbeerenauslese
        explain: "Trockenbeerenauslese (TBA) is made from individually picked, shriveled, botrytized berries. It is one of the world's rarest and sweetest wines, sometimes with under 6% alcohol, and can age for a century."
      - tf: "A Spätlese is always sweet."
        truth: false
        explain: "Spätlese means late harvest: a ripeness level, not a sweetness level. It can be fermented dry (Spätlese trocken), which gives a ripe, full-bodied dry wine."
      - choice: "Which region is famous for delicate, low-alcohol Riesling on steep slate?"
        options: [Mosel, Pfalz, Baden, Franken]
        a: Mosel
        visual: "map:germany:mosel"
        explain: "The Mosel is famous for delicate, low-alcohol Riesling on steep slate slopes. The blue and red slate slopes are among the steepest in the world, and the river reflects light and holds heat."
      - match: "Match the German region to its specialty"
        pairs: [[Franken, Silvaner in Bocksbeutel], [Baden, Spätburgunder], [Rheingau, Classic Riesling]]
        explain: "Germany's regions have specialties: Mosel for delicate Riesling, Rheingau for richer Riesling, Pfalz for full-bodied wines, and Baden, Germany's warmest region, for the Pinot family (Spätburgunder, Grauburgunder)."
  - title: Austria
    cards:
      - learn: Precision and purity
        visual: "map:austria"
        body: |
          - **Niederösterreich**: Wachau, Kremstal, Kamptal: Grüner Veltliner and Riesling.
          - **Wachau** ripeness categories: **Steinfeder** (light), **Federspiel**, **Smaragd** (richest).
          - **Burgenland**: Blaufränkisch, Zweigelt and sweet wines around Lake Neusiedl.
          - **Steiermark**: Sauvignon Blanc.

          **DAC** (*Districtus Austriae Controllatus*) labels show typical regional styles.
      - choice: "In the Wachau, the ripest dry style is called…"
        visual: "map:austria:wachau"
        options: [Smaragd, Steinfeder, Federspiel, Kabinett]
        a: Smaragd
        explain: "Smaragd, named after an emerald-green lizard that basks on the warm terraces, is the Wachau's ripest dry style. It is full-bodied and often 13% alcohol or more, above Steinfeder and Federspiel."
      - tf: "Lake Neusiedl's humidity helps produce botrytized sweet wines."
        truth: true
        explain: "Lake Neusiedl is shallow and warm, and the morning mists from it encourage noble rot. The Burgenland region makes top sweet wines such as Ausbruch and Trockenbeerenauslese."
        visual: "map:austria:neusiedlersee"
      - choice: "Austria's most planted red grape is…"
        visual: "map:austria"
        options: [Zweigelt, Blaufränkisch, Pinot Noir, Merlot]
        a: Zweigelt
        explain: "Austria's most planted red grape is Zweigelt, a 1922 cross of St. Laurent and Blaufränkisch. It makes juicy, cherry-fruited reds, while Blaufränkisch makes the more serious ones."
      - blank: "DAC stands for Districtus Austriae ___."
        answers: [Controllatus]
        options: [Classicus, Communis, Certus]
        explain: "DAC stands for Districtus Austriae Controllatus. It marks wines typical of their region, such as Weinviertel DAC for peppery Grüner Veltliner, and is Austria's equivalent of the French AOC."
  - title: Tokaj & Greece
    cards:
      - learn: Tokaji
        visual: "map:hungary:tokaj"
        body: |
          In north-east **Hungary**, volcanic hills and river mists favor noble rot on **Furmint** and Hárslevelű.

          - **Tokaji Aszú**: aszú berries macerated in base wine; at least 120 g/L sugar.
          - **Eszencia**: the free-run syrup of aszú berries; can be 500+ g/L sugar and as low as 3% alcohol.
          - Increasingly fine **dry Furmint**.
      - learn: Greece
        visual: "map:greece"
        body: |
          - **Assyrtiko** (Santorini): mineral, high-acid white from basket-trained, ungrafted vines.
          - **Xinomavro** (Naoussa): tannic, high-acid red.
          - **Agiorgitiko** (Nemea): soft, plummy red.
      - choice: "Tokaji's main grape is…"
        options: [Furmint, Riesling, Assyrtiko, Grüner Veltliner]
        a: Furmint
        explain: "Tokaji's main grape is Furmint: high acidity, smoky minerality and a strong affinity for botrytis. That acidity keeps the sweet Aszú wines lively and lets them age for generations."
      - tf: "Santorini's vines are grafted onto American rootstock."
        truth: false
        explain: "Phylloxera cannot survive in Santorini's volcanic sand, so vines grow on their own roots, some very old."
        visual: "map:greece:santorini"
      - choice: "Which Greek grape is often compared to Nebbiolo?"
        options: [Xinomavro, Agiorgitiko, Assyrtiko, Moschofilero]
        a: Xinomavro
        explain: "Xinomavro, from northern Greece, is often compared to Nebbiolo: pale, high in tannin and acidity, with tomato, olive and red fruit. Naoussa is its most famous appellation."
      - blank: "Tokaji ___ is the rare syrup of aszú berries, one of the sweetest wines on earth."
        answers: [Eszencia]
        options: [Szamorodni, Furmint, Aszú]
        explain: "Tokaji Eszencia is the rare syrup of aszú berries that drips by its own weight, one of the sweetest wines on earth. It ferments for years and reaches only a few percent alcohol, and is traditionally used as a medicine."
  - title: Going further
    cards:
      - learn: German Riesling styles
        visual: "map:germany:mosel,rheingau,pfalz"
        body: 'German Riesling ranges from bone-dry **Grosses Gewächs** to sweet **Beerenauslese** and **Trockenbeerenauslese**. The **Mosel** gives light, delicate, often off-dry wines on steep slate; the **Pfalz** and **Rheingau** give fuller, drier styles.
      
          '
      - learn: Tokaji Aszú
        visual: "photo:tokaj"
        body: 'In Hungary''s **Tokaj**, botrytized aszú berries are soaked in base wine or must. The result is one of the world''s great sweet wines, with apricot, orange peel and honey, kept fresh by Furmint''s acidity.
      
          '
      - choice: Which German region is famous for steep slate slopes along a winding river?
        options:
        - Mosel
        - Pfalz
        - Baden
        - Franken
        a: Mosel
        explain: "The Mosel's slate slopes along its winding river are among the steepest vineyards in the world. The slate stores heat, which helps ripen Riesling in a cool climate."
      - match: Match the wine to its main grape
        pairs:
        - - Tokaji Aszú
          - Furmint
        - - Wachau Smaragd
          - Grüner Veltliner
        - - Blaufränkisch Mittelburgenland
          - Blaufränkisch
        - - Mosel Kabinett
          - Riesling
        explain: "Central Europe's classics rely on local stars: Riesling in the Mosel, Grüner Veltliner in the Wachau, Furmint in Tokaj and Blaufränkisch in Burgenland. Learning the grape for each place helps a lot."
      - tf: Trockenbeerenauslese is a dry wine.
        truth: false
        explain: "Despite trocken in the name, TBA is made from shriveled botrytized berries and is intensely sweet. Trockenbeeren means dried berries, not dry wine, which is a classic trap."
      - choice: In the Wachau, what is 'Smaragd'?
        visual: "map:austria:wachau"
        options:
        - The ripest, fullest dry category
        - A sweet wine
        - A sparkling wine
        - A type of soil
        a: The ripest, fullest dry category
        explain: "Steinfeder, Federspiel and Smaragd rank the Wachau's dry whites by ripeness: Smaragd is the ripest and richest. The names come from a grass, a falconry term and a lizard."
      - blank: Hungary's most famous sweet wine comes from ___.
        answers:
        - Tokaj
        options:
        - Eger
        - Villány
        - Szekszárd
        - Somló
        explain: "Hungary's most famous sweet wine comes from Tokaj, the world's first classified wine region, in 1730. Its Aszú wines are measured in puttonyos, the baskets of botrytized berries added to the base wine."

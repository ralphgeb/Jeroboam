title: The New World
summary: "USA, Chile and Argentina, Australia, New Zealand and South Africa."
icon: globe.americas
lessons:
  - title: California, Oregon & Washington
    cards:
      - learn: The West Coast
        visual: "map:california"
        body: |
          - **California**: Mediterranean climate cooled by Pacific fog. Napa (Cabernet), Sonoma (Pinot, Chardonnay, Zinfandel), the Central Coast (Pinot in the Santa Rita Hills, Rhône varieties in Paso Robles), Lodi (old-vine Zinfandel).
          - **Oregon**: cool, wet Willamette Valley; Pinot Noir and Pinot Gris.
          - **Washington**: dry, irrigated Columbia Valley east of the Cascades; Cabernet, Merlot, Syrah, Riesling.
      - learn: Napa up close
        visual: "map:napa-sonoma:napa-valley,oakville,rutherford,stags-leap"
        body: |
          Napa is cooler in the south (Carneros, near San Pablo Bay) and hotter up-valley toward Calistoga. Famous AVAs include Oakville, Rutherford and Stags Leap District, plus mountain AVAs like Howell Mountain.
      - choice: "Why does Washington's Columbia Valley need irrigation?"
        options: ["It lies in the rain shadow of the Cascades", "It is too cold", "The soils hold too much water", "It is on the coast"]
        a: "It lies in the rain shadow of the Cascades"
        explain: "Eastern Washington is semi-desert, receiving less than 200 mm of rain a year, so vineyards need irrigation. The Columbia river and its tributaries supply water, and the dry climate means little rot or disease."
      - choice: "Which Oregon region is famous for Pinot Noir?"
        options: [Willamette Valley, Columbia Valley, Lodi, Paso Robles]
        a: Willamette Valley
        visual: "map:pacific-northwest:willamette"
        explain: "The Willamette Valley is famous for Pinot Noir. Its cool, cloudy climate echoes Burgundy, and it is the same latitude as Burgundy, about 45° north."
      - tf: "Carneros, in the south of Napa and Sonoma, is cooled by San Pablo Bay."
        truth: true
        explain: "Carneros, in the south of Napa and Sonoma, is cooled by San Pablo Bay. Wind and fog from the bay make it ideal for Pinot Noir, Chardonnay and sparkling wine, not Cabernet."
        visual: "map:napa-sonoma:carneros"
      - blank: "The 1976 Judgment of ___ put Napa Valley on the world map."
        answers: [Paris]
        options: [London, Napa, Bordeaux]
        explain: "Stag's Leap Wine Cellars Cabernet and Chateau Montelena Chardonnay beat top French wines in a blind tasting."
  - title: Chile & Argentina
    cards:
      - learn: "Chile: between ocean and Andes"
        visual: "map:chile"
        body: |
          A narrow strip cooled by the **Humboldt Current** and Andean air. **Maipo** for Cabernet, **Colchagua** for Carmenère, **Casablanca** and Leyda for cool whites and Pinot Noir. Chile is phylloxera-free.
      - learn: "Argentina: wine in the high desert"
        visual: "map:argentina"
        body: |
          High-altitude desert at the foot of the Andes. **Mendoza** and the **Uco Valley** for Malbec; **Salta** (Cafayate) for Torrontés at up to 3,000 m.
      - choice: "Why can Argentina make fresh wines despite intense sun?"
        options: ["Very high altitude and cold nights", "Coastal fog", "High rainfall", "Northern latitude"]
        a: "Very high altitude and cold nights"
        explain: "Altitude gives a big difference between day and night, preserving acidity, and the thin air means strong UV, which builds thick skins and deep color. That is why high-altitude Malbec is so dark and fresh."
      - choice: "Which Chilean valley is known for cool-climate Sauvignon Blanc?"
        options: [Casablanca, Maipo, Colchagua, Maule]
        a: Casablanca
        visual: "map:chile:casablanca"
        explain: "Casablanca Valley is known for cool-climate Sauvignon Blanc and Chardonnay. Morning fog from the Pacific keeps it cool, so the wines are fresh and aromatic."
      - tf: "Argentina's vineyards are irrigated with Andean snowmelt."
        truth: true
        explain: "Argentina's vineyards are irrigated with Andean snowmelt, since rainfall in Mendoza is only about 200 mm a year. Channels built by the Huarpe people centuries ago still feed the vines."
      - match: "Match the region to its signature"
        pairs: [[Salta, Torrontés], [Uco Valley, High-altitude Malbec], [Colchagua, Carmenère], [Maipo, Cabernet Sauvignon]]
        explain: "Four classic South American pairings: Malbec in Mendoza, Torrontés in Salta, Carmenère in Colchagua, and Sauvignon Blanc in Casablanca. Each place is matched to its grape."
  - title: Australia & New Zealand
    cards:
      - learn: Australia
        visual: "map:australia"
        body: |
          - **Barossa** & **McLaren Vale**: rich Shiraz, Grenache.
          - **Clare** & **Eden Valley**: dry, lime-scented Riesling.
          - **Coonawarra**: Cabernet on terra rossa.
          - **Margaret River**: Cabernet, Chardonnay.
          - **Yarra Valley**, **Tasmania**: Pinot, Chardonnay, sparkling.
          - **Hunter Valley**: Sémillon.
      - learn: New Zealand
        visual: "map:new-zealand"
        body: |
          A cool maritime country. **Marlborough** Sauvignon Blanc (intense passion fruit and herbs); **Central Otago** and **Martinborough** Pinot Noir; **Hawke's Bay** Bordeaux blends and Syrah from the **Gimblett Gravels**.
      - choice: "Coonawarra's famous red soil is called…"
        options: [Terra rossa, Albariza, Llicorella, Kimmeridgian]
        a: Terra rossa
        visual: "map:south-australia:coonawarra"
        explain: "Terra rossa is Coonawarra's famous red soil: a thin strip of red clay over limestone, about 15 km long, ideal for Cabernet. The limestone drains well and keeps the vines in balance."
      - choice: "Which New Zealand region is the world's most southerly major wine region?"
        options: [Central Otago, Marlborough, Hawke's Bay, Gisborne]
        a: Central Otago
        visual: "map:new-zealand:central-otago"
        explain: "Central Otago is the world's most southerly major wine region. Its continental climate, the only one in New Zealand, makes ripe, intense Pinot Noir, with hot days and very cold nights."
      - tf: "Clare Valley is known for sweet, oaky Riesling."
        truth: false
        explain: "Clare and Eden Valley Rieslings are bone dry, lime-scented and unoaked, and age to toast and kerosene. They are not sweet or oaky, which makes the statement false."
      - blank: "Hawke's Bay's Gimblett ___ are stony soils prized for Syrah and Bordeaux blends."
        answers: [Gravels]
        options: [Slopes, Clays, Sands]
        explain: "Hawke's Bay's Gimblett Gravels are former riverbed stones that drain well and store heat. They are prized for Syrah and Bordeaux blends, and a protected zone grows only on these stones."
  - title: South Africa
    cards:
      - learn: The Cape
        visual: "map:south-africa"
        body: |
          Mediterranean climate cooled by the **Benguela Current** and the south-easterly **Cape Doctor** wind.

          - **Stellenbosch**: Cabernet, Bordeaux blends, Pinotage.
          - **Swartland**: old-vine Chenin and Rhône blends.
          - **Constantia**, **Elgin**, **Walker Bay**: cool-climate whites and Pinot.
          - **Cap Classique**: traditional-method sparkling.
      - choice: "What is the 'Cape Doctor'?"
        options: ["A strong south-easterly wind", "A grape disease", "A winemaking technique", "A wine award"]
        a: "A strong south-easterly wind"
        explain: "The Cape Doctor is the strong south-east wind that blows across the Cape. It cools vineyards and blows away disease, so many Cape vines need little spraying."
      - choice: "Which region led South Africa's old-vine Chenin revival?"
        options: [Swartland, Constantia, Elgin, Robertson]
        a: Swartland
        visual: "map:south-africa:swartland"
        explain: "The Swartland led South Africa's old-vine Chenin revival: dry-farmed bush vines in a hot, dry region, championed by a new wave of winemakers. Some of the vines are over 50 years old."
      - tf: "Vin de Constance is a historic sweet wine once loved by Napoleon."
        truth: true
        explain: "Vin de Constance, a sweet Muscat wine from Constantia since the 1700s, was loved by Napoleon, and was revived in the 1980s. It was once served at the courts of Europe."
      - blank: "South African traditional-method sparkling wine is called Cap ___."
        answers: [Classique]
        options: [Crémant, Cava, Brut]
        explain: "South African traditional-method sparkling wine is called Cap Classique. It is usually Chardonnay and Pinot Noir, with lees aging like Champagne, and is often excellent value."
  - title: Going further
    cards:
      - learn: Cool spots in warm countries
        visual: "photo:marlborough"
        body: 'New World producers chase cool sites for elegance: **Adelaide Hills** and **Tasmania** in Australia, **Casablanca** and **San Antonio** in Chile, **Sonoma Coast** in California and **Central Otago** in New Zealand.
      
          '
      - learn: Signature styles
        visual: "photo:grape-malbec"
        body: '**Marlborough Sauvignon Blanc**: passion fruit and cut grass. **Barossa Shiraz**: rich black fruit and chocolate. **Mendoza Malbec**: plum and violet. **Napa Cabernet**: ripe cassis and polished tannin. **Stellenbosch Chenin**: ripe stone fruit and honey.
      
          '
      - choice: Which region makes intense, passion-fruit Sauvignon Blanc?
        options:
        - Marlborough
        - Barossa Valley
        - Napa Valley
        - Mendoza
        a: Marlborough
        explain: "Marlborough makes intense, passion-fruit Sauvignon Blanc: bright sun, cool nights and a long season give a pungent style. Cloudy Bay put it on the map in the 1980s."
      - match: Match the region to its signature grape
        pairs:
        - - Barossa Valley
          - Shiraz
        - - Mendoza
          - Malbec
        - - Central Otago
          - Pinot Noir
        - - Napa Valley
          - Cabernet Sauvignon
        explain: "Each region built its fame on one grape: Marlborough for Sauvignon Blanc, Barossa for Shiraz, Mendoza for Malbec, Stellenbosch for Cabernet. Matching them helps in blind tasting."
      - tf: Chile's Casablanca Valley is cooled by the Pacific Ocean.
        truth: true
        explain: "Chile's Casablanca Valley is cooled by the Pacific Ocean. Morning fog and sea breezes make Casablanca ideal for Sauvignon Blanc and Chardonnay, and it was planted from the 1980s."
      - choice: Why are Mendoza's vineyards good for Malbec despite the desert?
        options:
        - High altitude and snowmelt irrigation
        - Constant rain
        - Volcanic islands
        - Ocean fog
        a: High altitude and snowmelt irrigation
        explain: "Vineyards up to 1,500 m give cool nights, and Andes snowmelt provides water. That combination, with intense sun, gives Mendoza's Malbec its deep color and ripe fruit while keeping some freshness."
      - blank: Pinotage is a South African cross of Pinot Noir and ___.
        answers:
        - Cinsault
        options:
        - Syrah
        - Merlot
        - Chenin Blanc
        explain: "Pinotage is a South African cross of Pinot Noir and Cinsault, created in 1925. Cinsault was then called Hermitage in South Africa, hence the name Pinotage."

country:
  name: Croatia
  summary: "A long coast and a continental interior with 130 native grapes: Istria's Malvazija, the Dalmatian Plavac Mali (a close cousin of Zinfandel) and Slavonian oak for the world."
  grapes: [chardonnay, riesling, zinfandel, merlot, pinot-noir, sauvignon-blanc]
  local: [Plavac Mali, Malvazija Istarska, Graševina, Pošip, Grk, Babić, Teran, Debit, Crljenak Kaštelanski]
  climate: "Mediterranean on the Adriatic coast and islands; cooler continental in the north and east."
  styles: "Dry, fresh whites (Malvazija, Pošip, Graševina), rich reds from Plavac Mali and the island of Vis, and sweet wines such as Prošek."
  classification: "Four wine regions (Slavonia & Croatian Danube, Plateau, Istria & Kvarner, Dalmatia) split into sub-regions and about 66 appellations."
  history: "Greeks planted vines on Adriatic islands in the 4th century BC. DNA tests in 2001 showed that Zinfandel in California is the same grape as Crljenak Kaštelanski from Dalmatia, and Plavac Mali is its offspring."
  facts:
    - "Dingač on the Pelješac peninsula was the first protected wine region in Yugoslavia (1961)."
    - "Slavonian oak from Croatia's eastern forests is prized for barrels worldwide."

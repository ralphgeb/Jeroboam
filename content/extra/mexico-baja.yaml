country:
  name: Baja California
  summary: "Mexico's best-known wine region: a Mediterranean-like peninsula with a thriving food and wine scene around the Valle de Guadalupe, 90 minutes south of San Diego. It makes about 70–90% of Mexican wine."
  grapes: [cabernet-sauvignon, merlot, tempranillo, nebbiolo, grenache, syrah, sauvignon-blanc, chardonnay, mourvedre, zinfandel]
  local: [Chenin Blanc, Barbera, Mission, Palomino]
  climate: "Mediterranean: dry, sunny summers and cool nights from the Pacific, with winter rain."
  styles: "Bold Cabernet-based blends and Rhône or Italian varieties, with fresh whites such as Sauvignon Blanc and Chenin."
  classification: "No national appellation system yet; wineries label by valley: Valle de Guadalupe, Valle de Santo Tomás, Ojos Negros, San Vicente and Tecate."
  history: "Spanish Dominican missionaries planted Mission grapes in the 1700s, and Russian Molokan settlers brought winemaking to Guadalupe in the early 20th century."
  facts:
    - "Baja California is the oldest and biggest wine region in Mexico by far."
    - "Valle de Guadalupe has more than 150 wineries within about 30 km."

country:
  name: Switzerland
  summary: "Small, steep and mostly drunk at home: Swiss wine hardly leaves the country. Mountain terraces make crisp Chasselas, lively Pinot Noir and rare local grapes such as Petite Arvine and Cornalin."
  grapes: [pinot-noir, gamay, merlot, chardonnay, sauvignon-blanc, syrah, riesling, pinot-grigio]
  local: [Chasselas, Petite Arvine, Cornalin, Humagne Rouge, Humagne Blanche, Heida, Amigne, Räuschling, Completer, Garanoir, Gamaret]
  climate: "Alpine to continental, with sunny, sheltered slopes by lakes and in the high Alpine valleys."
  styles: "Light, mineral white Chasselas (Fendant), Pinot Noir and Gamay blends such as Dôle, and Merlot from Ticino."
  classification: "Swiss AOCs follow cantons and districts: Valais, Vaud, Genève, Ticino and others, with Grand Cru in Vaud and Valais."
  history: "The Romans planted vines on the shores of Lake Geneva; medieval monks built the terraces of Lavaux, now a UNESCO World Heritage site."
  facts:
    - "Chasselas (known as Fendant in Valais) is the most planted white grape and shows the soil of each place very clearly."
    - "Only about 2% of Swiss wine is exported."

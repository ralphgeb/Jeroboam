    local: [Chasselas, Petite Arvine, Cornalin, Humagne Rouge, Amigne, Heida]
    summary: "The biggest and driest wine canton, in the upper Rhône valley between high Alps. Terraced vineyards up to 1,100 m, with the most varied grapes in the country."
    climate: "Very dry and sunny, one of the driest places in Switzerland."
    soil: "Schist, limestone, gravel and moraine."

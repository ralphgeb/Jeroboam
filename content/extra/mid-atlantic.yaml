country:
  name: Virginia & the Mid-Atlantic
  summary: "Thomas Jefferson's dream: Virginia, Maryland, Pennsylvania, New Jersey and West Virginia make elegant Viognier, Cabernet Franc, Petit Verdot and Chardonnay in a warm, humid climate."
  grapes: [viognier, cabernet-franc, chardonnay, merlot, petit-verdot, riesling]
  local: [Norton, Chambourcin, Vidal Blanc, Traminette, Seyval Blanc]
  climate: "Warm, humid summers and cold winters. Rain at harvest is the main risk, so growers pick well-drained slopes."
  styles: "Viognier (Virginia's signature white), Bordeaux-style reds led by Cabernet Franc, Chardonnay, sparkling wine and sweet Riesling."
  classification: "American Viticultural Areas (AVAs) such as Monticello, Shenandoah Valley, Lehigh Valley and Outer Coastal Plain."
  history: "Jefferson planted European vines at Monticello in the 1770s but they died of disease; modern Virginia wine took off in the 1970s. The native grape Norton is called Virginia's grape."
  facts:
    - "Virginia has more than 300 wineries, a leading wine state on the East Coast."
    - "Viognier was chosen as Virginia's official state grape in 2011."

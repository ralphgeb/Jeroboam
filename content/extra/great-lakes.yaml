  local: [Vidal Blanc, Chambourcin, Marquette, Frontenac, La Crescent, Norton, Catawba, Concord]
  climate: "Cold winters and warm summers, softened by the huge lakes whose water releases heat in autumn and delays spring."
  styles: "Dry and off-dry Riesling, ice wine, sparkling wine, and Norton, a native grape with deep colour."
  classification: "American Viticultural Areas (AVAs) such as Leelanau Peninsula, Old Mission Peninsula, Lake Erie and Ohio River Valley."
  facts:
    - "The Leelanau and Old Mission peninsulas in Michigan sit on the 45th parallel, the same latitude as Bordeaux and the Piedmont."

country:
  name: Mexico
  summary: "The oldest wine country in the Americas: Hernán Cortés ordered vines planted in 1524, and Casa Madero in Parras (1597) is the oldest winery in the Americas. Today the high plateau and the north produce a growing quality wine scene."
  grapes: [cabernet-sauvignon, merlot, tempranillo, chardonnay, malbec, syrah, grenache, sangiovese, nebbiolo]
  local: [Mission, Chenin Blanc, Viognier]
  climate: "High plateau, dry and sunny, with cool nights at 1,500 to 2,000 m."
  styles: "Bold, ripe reds, fresh whites and growing sparkling wine, from the same latitude as the Canaries."
  classification: "No national appellation system: wineries label by valley (Valle de Parras, Querétaro, Guanajuato, Zacatecas…). The Valle de Guadalupe is on its own map (Baja California)."
  facts:
    - "In 1699 the Spanish crown banned wine production in the New World to protect Spanish exports; missions kept making sacramental wine."
    - "Querétaro is Mexico's second-biggest wine area, with a big sparkling wine tradition near Tequisquiapan."

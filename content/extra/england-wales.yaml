country:
  name: England & Wales
  summary: "The world's fastest-growing cool-climate wine country, led by sparkling wine from chalk soils that run under the English Channel to Champagne."
  grapes: [chardonnay, pinot-noir, meunier, pinot-blanc, riesling, cabernet-franc]
  local: [Bacchus, Ortega, Seyval Blanc, Solaris, Pinot Meunier, Rondo, Reichensteiner]
  climate: "Cool and maritime. Warmer summers than a generation ago have made ripening more reliable, but spring frost and wet summers are the main risks."
  styles: "Traditional-method sparkling wine from Chardonnay, Pinot Noir and Pinot Meunier (the Champagne grapes), plus aromatic still whites such as Bacchus."
  classification: "Protected designations of origin (PDO): Sussex, Darnibbles, Essex, Cornwall, Hampshire (as English Sparkling), plus 'English Wine' and 'Welsh Wine' as national categories."
  history: "The Romans planted vines here, and monks kept some going in the Middle Ages. The modern industry began in Hampshire in the 1950s; in 2018 vineyards covered more than 3,000 hectares."
  facts:
    - "Ground in Kent, Sussex and Hampshire is the same Cretaceous chalk as Champagne, about 150 km away across the Channel."
    - "Many Champagne houses, such as Taittinger, have planted vineyards in England."

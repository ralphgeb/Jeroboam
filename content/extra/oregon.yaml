country:
  name: Oregon & Washington
  summary: 'The Pacific Northwest: Oregon''s cool, green Willamette Valley is the New World''s Pinot Noir capital, while Washington''s desert vineyards make bold Cabernet, Merlot, Syrah and Riesling.'
  grapes:
  - pinot-noir
  - chardonnay
  - pinot-grigio
  - riesling
  - cabernet-sauvignon
  - merlot
  - syrah
  - tempranillo
  local: []
  climate: West of the Cascade Mountains the climate is cool and rainy; east of them it is a hot, dry desert irrigated by the Columbia and Snake rivers.
  styles: Burgundian Pinot Noir and Chardonnay from Oregon; ripe, structured Bordeaux and Rhône reds and aromatic Riesling from Washington.
  classification: American Viticultural Areas (AVAs) such as Willamette Valley (with nine sub-AVAs), Southern Oregon, Columbia Gorge, Columbia Valley, Yakima Valley and Walla Walla Valley.
  facts:
  - Oregon and Washington together grow about 5% of US wine; Washington is second to California.
  - Walla Walla Valley is one of the few AVAs that straddle two states.
  - The Missoula Floods 15,000 years ago spread rich soil across the Willamette and Columbia valleys.
regions:
- id: willamette-valley
  name: Willamette Valley
  ava:
  - Willamette Valley
  grapes:
  - pinot-noir
  - chardonnay
  - pinot-grigio
  - riesling
  - pinot-blanc
  summary: 'Oregon''s heart and the home of New World Pinot Noir: about 150 miles of valley south of Portland, sheltered from the Pacific by the Coast Range. Nine sub-AVAs sit inside it.'
  soil: 'Three main soils: ancient volcanic Jory (Dundee Hills), marine sediment (Yamhill-Carlton, Eola-Amity) and wind-blown loess (Chehalem, Ribbon Ridge).'
  climate: Cool, wet winters and dry, mild summers with long autumns. Ripening is slow, so wines keep their freshness.
  styles: Elegant, red-fruited Pinot Noir, crisp Pinot Gris and cool-climate Chardonnay; also traditional-method sparkling wine.
  facts:
  - Willamette is pronounced 'wil-AM-it', rhyming with 'dammit'.
  - Oregon's rule for a varietal label is 90% (75% for Cabernet), stricter than most of the US.
  - The valley sits near the 45th parallel, the same latitude as Bordeaux and Piedmont.
  history: David Lett of Eyrie Vineyards planted the first Pinot Noir here in 1965. His 1975 South Block Pinot placed in the top ten at a 1979 Paris tasting and put Oregon on the world map.

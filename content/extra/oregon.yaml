- id: columbia-valley-ava
  name: Columbia Valley
  ava:
  - Columbia Valley
  grapes:
  - cabernet-sauvignon
  - merlot
  - syrah
  - riesling
  - chardonnay
  - cabernet-franc
  summary: Washington's giant AVA (about a third of the state, 11 million acres) covering almost all of its wine grapes. Desert-dry, irrigated by the Columbia and Snake rivers, with cool nights and long
    sunshine.
  soil: Wind-blown loess, ancient flood sediment from the Missoula Floods, and basalt.
  climate: Very dry (6 to 8 inches of rain), hot summers, cold winters; irrigated.
  styles: Bold Cabernet, Merlot and Syrah, plus crisp Riesling and Chardonnay.
  facts:
  - Washington is the second largest wine producer in the US.
  - Most Washington vines are grown on their own roots, as sandy desert soils and cold winters limit phylloxera.
  history: Chateau Ste. Michelle was founded in 1967; the AVA was recognized in 1984.

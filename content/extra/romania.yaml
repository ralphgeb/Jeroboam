country:
  name: Romania
  summary: "The fifth-largest wine producer in Europe, with 2,000 years of vines, wide hills from the Carpathians to the Black Sea and native grapes such as Fetească."
  grapes: [merlot, cabernet-sauvignon, pinot-noir, sauvignon-blanc, chardonnay, riesling, muscat, pinot-grigio, gewurztraminer]
  local: [Fetească Albă, Fetească Regală, Fetească Neagră, Tămâioasă Românească, Grasă de Cotnari, Busuioacă, Crâmpoșie]
  climate: "Temperate continental, with warm summers and cold winters; the Carpathian arc and the Black Sea shape the climate."
  styles: "Fruity, off-dry whites and increasing quality in dry reds; Fetească Neagră is the leading red native."
  classification: "Eight wine regions and 40+ DOCs (denumire de origine controlată), such as Cotnari, Dealu Mare and Murfatlar."
  history: "The Greeks planted vines on the Black Sea coast in the 7th century BC; the Dacians already made wine. Cotnari was famous in medieval Moldavia as the wine of kings."
  facts:
    - "Romania has the second-largest vineyard area of any EU country after France."
    - "The Murfatlar region on the Black Sea is known for its sweet, late-harvest wines."

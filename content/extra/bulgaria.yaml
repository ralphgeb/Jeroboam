country:
  name: Bulgaria
  summary: "An old wine land of the Thracians, with a Soviet-era export boom and a revival of native grapes: Mavrud, Melnik, Gamza and Rubin, plus excellent international varieties."
  grapes: [cabernet-sauvignon, merlot, chardonnay, syrah, pinot-noir, muscat, riesling]
  local: [Mavrud, Melnik, Gamza, Rubin, Pamid, Dimiat, Misket Cherven, Shiroka Melnishka Loza]
  climate: "Continental in the north and Mediterranean in the south, with the Balkan Mountains between."
  styles: "Rich, dark reds (Mavrud, Melnik), simple fresh whites and aromatic Misket."
  classification: "Five wine regions (Danube Plain, Black Sea, Thracian Valley, Rose Valley, Struma Valley) with PDO (Protected Designation of Origin) appellations."
  history: "The Thracians drank wine from the 2nd millennium BC, and Orpheus is said to have come from here. Bulgaria was the world's second-biggest wine exporter in the 1980s."
  facts:
    - "Melnik is a tiny town in the south-west, famed for its sandstone pyramids and wine cellars cut into the rock."
    - "Mavrud is among the oldest Bulgarian grapes, linked to a Thracian legend of a young man's dark wine."

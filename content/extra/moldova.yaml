country:
  name: Moldova
  summary: "One of the most vine-covered countries per head in the world, famous for vast underground cellars (Mileștii Mici has 200 km of tunnels) and a revival of Fetească and Rară Neagră."
  grapes: [chardonnay, pinot-noir, cabernet-sauvignon, merlot, sauvignon-blanc, pinot-grigio, riesling]
  local: [Fetească Albă, Fetească Regală, Fetească Neagră, Rară Neagră, Plavai, Viorica, Rkatsiteli]
  climate: "Temperate continental, mild and sunny, with long summers and hard winters."
  styles: "Simple fruity whites, sparkling wine made in underground cellars, and richer reds from Fetească Neagră and Rară Neagră."
  classification: "Three PGI regions (Valul lui Traian, Ștefan Vodă, Codru) plus Divin (brandy) and PDO regions such as Codru, Ștefan Vodă and Valul lui Traian."
  facts:
    - "The Mileștii Mici cellar holds the biggest wine collection in the world (almost 2 million bottles) in tunnels 85 m below ground."
    - "Wine has long been Moldova's top export, with the former Soviet Union as its main market."

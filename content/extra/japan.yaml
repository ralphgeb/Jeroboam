country:
  name: Japan
  summary: "A very small but beautiful wine industry, built on Koshu, a pale pink grape grown in Yamanashi for over 1,000 years, and on increasingly serious wines from Nagano and Hokkaido."
  grapes: [chardonnay, merlot, cabernet-sauvignon, pinot-noir, riesling, cabernet-franc, syrah, pinot-grigio]
  local: [Koshu, Muscat Bailey A, Delaware, Niagara, Zweigelt, Kerner]
  climate: "Humid with typhoon rain in summer, so vines are trained overhead (pergola style) to keep the grapes dry."
  styles: "Delicate, citrusy Koshu, fresh whites, light reds and fine sparkling wine."
  classification: "Japan Wine (made only from grapes grown in Japan) and Geographical Indications for Yamanashi, Hokkaido, Nagano and Yamagata."
  history: "Legend says the Buddhist monk Gyoki brought Koshu in 718 AD. Modern winemaking began in Yamanashi in 1877."
  facts:
    - "Koshu is grown on tall pergolas to avoid rot in Japan's rain and humidity."
    - "Only wines made entirely from grapes grown in Japan may be called Japan Wine (nihon wain)."

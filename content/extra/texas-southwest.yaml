country:
  name: Texas & the Southwest
  summary: "Hot, high and dry: Texas (the second most visited wine region in the US), New Mexico (America's oldest wine tradition, 1629) and Arizona grow Mediterranean grapes such as Tempranillo, Mourvèdre, Viognier and Grenache."
  grapes: [tempranillo, mourvedre, viognier, grenache, cabernet-sauvignon, sangiovese, tannat, albarino]
  local: [Black Spanish]
  climate: "Hot summers, big day-night swings at altitude, and very little rain. Cool, high plains sites and the Hill Country do best."
  styles: "Rhône and Spanish varieties: Tempranillo, Mourvèdre, Viognier, Grenache, plus Bordeaux reds and sparkling."
  classification: "American Viticultural Areas (AVAs) such as Texas Hill Country, Texas High Plains, Mesilla Valley, Sonoita and Willcox."
  facts:
    - "About 85% of Texas grapes are grown in the High Plains near Lubbock, on high, dry plateau."
    - "New Mexico's first vines were planted by Spanish missionaries in the 1620s, the oldest wine region in the United States."

country:
  name: Ontario, Quebec & Nova Scotia
  summary: "Canada's cool-climate East. Ontario is the world's largest ice wine producer and a rising star for Riesling, Chardonnay and Pinot Noir; Nova Scotia and Quebec grow crisp sparkling wines and hardy hybrids."
  grapes: [riesling, chardonnay, cabernet-franc, pinot-noir, gamay, cabernet-sauvignon]
  local: [Vidal Blanc, L'Acadie Blanc, Baco Noir, Frontenac]
  climate: "Cold continental winters. The Great Lakes (and the Atlantic in Nova Scotia) keep winter lows just above the point where vines die."
  styles: "Ice wine (Vidal and Riesling), sparkling wine, Riesling, Chardonnay and Cabernet Franc."
  classification: "Vintners Quality Alliance (VQA) designated viticultural areas: Niagara Peninsula, Prince Edward County, Lake Erie North Shore, Nova Scotia."
  facts:
    - "Ice wine grapes are picked frozen by hand at -8°C or lower, often at night."
    - "Prince Edward County sits on the same limestone as parts of Burgundy; growers there bury their vines each winter to protect them from the cold."

country:
  name: Turkey
  summary: "One of the world's biggest grape growers (mostly for eating and raisins), and the cradle of winemaking in Anatolia, 4,000 years old. A small, fast-improving quality wine industry uses over 1,000 native grape varieties."
  grapes: [syrah, cabernet-sauvignon, merlot, chardonnay, sauvignon-blanc, tempranillo]
  local: [Öküzgözü, Boğazkere, Kalecik Karası, Narince, Emir, Sultaniye, Papazkarası, Bornova Misketi, Çalkarası]
  climate: "Varied: Mediterranean on the coast, continental and cold on the high central plateau and the east."
  styles: "Dry reds, fresh mineral whites, rakı (aniseed spirit) and a growing group of boutique wineries."
  classification: "Wine areas by region (Thrace & Marmara, Aegean, Central Anatolia, Eastern Anatolia, Mediterranean) with geographical indication (PGI) status."
  history: "The Hittites made wine in Anatolia 4,000 years ago; Dionysus, god of wine, was worshipped in the Aegean cities of Asia Minor. Noah's ark is said to have landed on Mount Ararat in the east."
  facts:
    - "Boğazkere and Öküzgözü are the two great red grapes of eastern Anatolia; they are often blended, one for tannin and the other for fruit."
    - "In Cappadocia, vines grow among tuff fairy chimneys and cave cellars."

country:
  name: China
  summary: "Now among the world's top ten wine producers and the second-largest vineyard area in the world (mostly table grapes). Ningxia in the north-west is the quality leader, with Cabernet Gernischt, Marselan and Cabernet Sauvignon grown in winter-buried vines."
  grapes: [cabernet-sauvignon, merlot, chardonnay, syrah, pinot-noir, riesling, cabernet-franc]
  local: [Cabernet Gernischt, Marselan, Longyan, Beichun, Vidal Blanc, Muscat Hamburg, Shuijing]
  climate: "Mostly continental, with huge winter cold: vines must be buried every winter in Ningxia and Xinjiang."
  styles: "Rich Cabernet blends in Ningxia, fresh whites in Shandong, ice wine in the north-east and fortified wines in Shanxi."
  classification: "The main wine regions are Ningxia, Shandong, Hebei, Xinjiang, Yunnan, Shanxi and Gansu, plus Liaoning and Jilin for ice wine."
  history: "Grape wine was drunk in Xinjiang from at least the Han dynasty. Zhang Bishi founded the first big modern winery, Changyu, in Yantai in 1892."
  facts:
    - "In 2011 Chateau Helan Mountain's Ningxia Cabernet beat Bordeaux in an international competition in Decanter."
    - "Vineyards in Ningxia are buried under 30–50 cm of soil each winter to survive temperatures of -25°C."

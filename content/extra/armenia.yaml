country:
  name: Armenia
  summary: "Home of the oldest winery ever found: a 6,100-year-old cave at Areni. High-altitude vineyards, volcanic soils and native grapes make fresh, mineral wines."
  grapes: []
  local: [Areni, Voskehat, Kangun, Khatun Kharji, Garan Dmak, Haghtanak, Kakhet, Sireni, Kharji]
  climate: "Continental with hot summers and cold winters; vineyards sit at 800 to 2,000 m, among the highest in the world."
  styles: "Dry and fortified wines, especially from Areni (a light, spicy red) and Voskehat (a rich, floral white)."
  classification: "Wine regions: Ararat Valley, Vayots Dzor, Aragatsotn, Armavir, Tavush, Syunik, Kotayk and Shirak, with a growing system of appellations."
  history: "In 2007 archaeologists found a 6,100-year-old winery in the Areni-1 cave, with a wine press, fermentation vats and storage jars. Armenian legend says Noah planted the first vineyard on the slopes of Mount Ararat."
  facts:
    - "Areni-1 is the oldest known winery in the world."
    - "Armenia's high elevations and sandy volcanic soils protected many vines from phylloxera, so lots of old, ungrafted vines survive."

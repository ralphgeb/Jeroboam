country:
  name: Cyprus
  summary: "The home of Commandaria, one of the world's oldest named wines (since the 12th century), and Xynisteri and Mavro grapes grown among Troodos mountain villages."
  grapes: [syrah, cabernet-sauvignon, grenache, mourvedre, chardonnay, sauvignon-blanc, muscat]
  local: [Xynisteri, Mavro, Maratheftiko, Yiannoudi, Ofthalmo, Promara, Spourtiko]
  climate: "Hot, dry Mediterranean summers; the best vineyards climb the Troodos mountains to 1,500 m."
  styles: "Dry whites from Xynisteri, red Maratheftiko, and the sweet, raisined Commandaria."
  classification: "Regional PDO and PGI areas such as Commandaria, Laona-Akamas, Pitsilia, Krasochoria and Vouni Panagias-Ambelitis."
  history: "Cyprus has made wine for 6,000 years. Commandaria was served at the wedding of Richard the Lionheart in 1191 and is thought to be the oldest still-made wine."
  facts:
    - "Many Cypriot vines are old, ungrafted bush vines, as phylloxera never arrived on the island."
    - "Commandaria is made from sun-dried Xynisteri and Mavro grapes in 14 villages of the Limassol mountains."

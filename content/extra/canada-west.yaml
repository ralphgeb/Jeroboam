country:
  name: British Columbia
  summary: "Canada's biggest wine province: sunny, desert-like valleys in the interior and cool coastal islands, with fresh whites, Pinot Noir and serious Bordeaux-style reds."
  grapes: [pinot-noir, merlot, chardonnay, cabernet-franc, riesling, pinot-grigio, syrah, gewurztraminer]
  local: [Pinot Gris, Gewürztraminer, Marechal Foch]
  climate: "The interior valleys are hot and dry, sheltered from the Pacific by mountains; the coast is cool and wet."
  styles: "Pinot Noir, Merlot, Chardonnay, Riesling and ice wine; fresh aromatic whites and big, ripe reds in the south."
  classification: "Geographical Indications (GIs) under the Vintners Quality Alliance (VQA): Okanagan Valley, Similkameen Valley, Fraser Valley, Vancouver Island and Gulf Islands."
  facts:
    - "The Okanagan Valley is home to Canada's only true desert, at Osoyoos, where vines grow beside cactus."
    - "More than 80% of Canadian ice wine is made in Ontario, but BC also makes it in cold years."

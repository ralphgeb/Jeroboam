country:
  name: Southern Brazil
  summary: "Brazil makes wine mostly in the south: sparkling wine and Merlot from the Italian-settled Serra Gaúcha, fresh reds and whites from the cooler heights of Santa Catarina and a rising Campanha. (There is also tropical winemaking in the São Francisco Valley in the north-east, with two harvests a year.)"
  grapes: [merlot, cabernet-sauvignon, chardonnay, tannat, pinot-noir, sauvignon-blanc, riesling, malbec, cabernet-franc]
  local: [Isabel, Bordô, Moscato Giallo, Touriga Nacional, Pinot Nero]
  climate: "Subtropical and humid, with heavy rain in summer. The vines sit on hills at 600 to 1,400 m to find cooler air."
  styles: "Traditional-method and Moscato sparkling wine (Brazil's best), Merlot and Cabernet Franc, and ever finer still wines."
  classification: "Indicações Geográficas (IGs) and Denominações de Origem: Vale dos Vinhedos (the first, 2002), Pinto Bandeira, Altos Montes, Farroupilha, Campanha Gaúcha and Campos de Cima da Serra."
  history: "Italian immigrants arrived in the Serra Gaúcha in 1875 with vines and winemaking skills; they made wine from the hybrid Isabel grape for a century before European grapes took over."
  facts:
    - "The Vale dos Vinhedos was Brazil's first geographical indication for wine, in 2002."
    - "Brazil is among the world's top three sparkling-wine consumers per head in South America."

country:
  name: Slovenia
  summary: "A small country at the crossroads of the Alps, the Mediterranean and the Pannonian plain, with a deep wine culture, orange wines, white blends and a trio of wine regions."
  grapes: [chardonnay, sauvignon-blanc, pinot-noir, merlot, riesling, pinot-grigio, cabernet-sauvignon]
  local: [Rebula, Zelen, Pinela, Vitovska, Teran, Cviček, Šipon, Refošk, Malvazija]
  climate: "Alpine in the north, Mediterranean on the coast and continental in the east."
  styles: "Fresh whites from Štajerska, rich Rebula and orange wines in Goriška Brda, Teran from the Karst, and the light red-white blend Cviček."
  classification: "Three wine regions (Podravje, Posavje, Primorska) divided into nine districts (including Štajerska Slovenija, Goriška Brda, Vipavska dolina, Kras)."
  facts:
    - "In Maribor, the Old Vine is the oldest vine in the world, about 400 years old and still bearing fruit."
    - "Goriška Brda is a hill region that continues over the border into Italy's Collio, with the same ripe, skin-contact white wines."
